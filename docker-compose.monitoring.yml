# =============================================================================
# TempConnect — Monitoring Overlay (Prometheus + Grafana)
# =============================================================================
# Optionales Overlay — wird NICHT automatisch geladen.
#
# Nutzung (Dev):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Nutzung (Prod):
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Zugriff:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3001 (admin / admin)
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tempconnect_prometheus
    restart: unless-stopped
    # PROMETHEUS_METRICS_SECRET: muss dem ADMIN_SECRET in api/.env entsprechen,
    # damit Prometheus den /metrics Endpoint der API authentifizieren kann.
    environment:
      PROMETHEUS_METRICS_SECRET: ${PROMETHEUS_METRICS_SECRET}
    volumes:
      # prometheus.yml ist das Template — start-prometheus.sh substituiert das Secret
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/start-prometheus.sh:/etc/prometheus/start-prometheus.sh:ro
      - ./monitoring/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - prometheus_data:/prometheus
    # Entrypoint übernimmt Secret-Substitution, dann startet Prometheus normal
    entrypoint: ["/bin/sh", "/etc/prometheus/start-prometheus.sh"]
    command:
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: tempconnect_alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: tempconnect_grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  grafana_data:
