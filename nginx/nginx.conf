server_tokens off;

server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Public Landing (exakte URL /)
    location = / {
        root /usr/share/nginx/html;
        try_files /landing.html =404;
    }

    # Pulse-Bereich Redirects
    location = /sla {
        return 302 /public/enterprise.html;
    }
    location = /pulse {
        return 302 /public/enterprise.html;
    }

    # Legacy Suche Redirect
    location = /search {
        return 302 /index.html#dashboard;
    }


    # Alte SPA-Einstiege — alle auf Landing umleiten
    location = /app        { return 302 /; }
    location = /index.html { return 302 /; }

    # Legal-Pages (Clean-URLs: /legal/agb -> agb.html)
    location /legal/ {
        root /usr/share/nginx/html/public;
        try_files $uri $uri.html =404;
    }

    # Frontend — statische Dateien; 404 zeigt Landing (kein SPA-Fallback mehr)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /landing.html;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Health Check Endpoint (prüft API wirklich)
    location /health {
        access_log off;
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
