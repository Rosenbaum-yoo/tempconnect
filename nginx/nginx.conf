# =============================================================================
# ⚠️ TLS-PFLICHT IN PRODUKTION: Dieser Server lauscht NUR auf Port 80 (HTTP) und
# ist bewusst an 127.0.0.1 gebunden (docker-compose.prod.yml). Er MUSS in Prod
# hinter einem TLS-terminierenden Reverse-Proxy laufen:
#   - Empfohlen: Caddy mit Auto-Let's-Encrypt -> deploy/Caddyfile.example
#   - Alternativ: nginx mit Zertifikaten     -> deploy/nginx-ssl.example.conf
# NIEMALS Port 80 dieses Containers direkt oeffentlich exponieren (Session-Cookies
# laufen sonst unverschluesselt; `secure`-Cookies funktionieren nicht).
# Setup-Anleitung: docs/DEPLOYMENT_HETZNER.md
# =============================================================================
server_tokens off;

server {
    listen 80;
    server_name localhost;

    # ── Cloudflare real-IP ─────────────────────────────────────────────────
    # Wenn TempConnect HINTER Cloudflare laeuft, ist $remote_addr sonst Cloudflares IP.
    # Wir uebernehmen die echte Besucher-IP (CF-Connecting-IP) NUR von Cloudflare-Ranges
    # (kein Spoofing). Andernfalls greifen Rate-Limiter/Abuse-Controls falsch (alle CF-Besucher
    # = eine IP) und secure-Cookie-/Proto-Erkennung leidet. Ranges: https://www.cloudflare.com/ips/
    # Ungenutzt (kein CF davor) = harmlos: ohne CF-Peer findet keine Ersetzung statt.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content-Security-Policy
    # unsafe-inline erlaubt weil das Frontend Vanilla JS mit Inline-Scripts nutzt.
    # Langfristig auf Hash-basiertes CSP oder nonce migrieren (nach Framework-Migration).
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # =========================================================================
    # Routing
    # =========================================================================

    # Health Check — Docker healthcheck + Load-Balancer Probe
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Public Landing (exakte URL /)
    location = / {
        root /usr/share/nginx/html;
        try_files /landing.html =404;
    }

    # Redirects — Pulse / SLA
    location = /sla   { return 302 /public/enterprise.html; }
    location = /pulse { return 302 /public/enterprise.html; }

    # Marktstart-Pilot One-Pager (saubere Marketing-URL fuer LinkedIn etc.)
    location = /pilot { return 302 /public/onepager.html; }

    # Legacy Redirects
    location = /search                             { return 302 /index.html#dashboard; }
    location = /public/notifications.html          { return 301 /public/activity.html; }
    location = /public/demand_request_form.html    { return 301 /public/marketplace_demand_create.html; }
    location = /public/login.html                  { return 301 /; }
    location = /app                                { return 302 /; }
    location = /index.html                         { return 302 /; }

    # Legal-Pages (Clean-URLs: /legal/agb -> agb.html)
    location /legal/ {
        root /usr/share/nginx/html/public;
        try_files $uri $uri.html =404;
    }

    # Geschützte App-HTML — niemals cachen (Logout + Browser-Back-Härtung)
    location ~ ^/public/.*\.html$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Un-gehashtes App-JS/CSS (direkt aus dem Repo, KEIN Content-Hash im Dateinamen) →
    # immer revalidieren, damit Frontend-Änderungen Nutzer sofort erreichen. Browser fragt
    # per If-Modified-Since nach; unverändert = 304 (billig), geändert = frische Datei.
    # Gehashte Bundles (/staff/assets/, /owner-control/assets/, …) bleiben separat immutable.
    location ~* ^/public/(js|css)/.*\.(js|css)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Upload-Dateien — Proxy zur API
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Upload-Endpoint (bis 5MB)
    location /api/offer-assets/ {
        client_max_body_size 6m;
        proxy_pass http://api:3000/api/offer-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Health Check
    location /health {
        access_log off;
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # =========================================================================
    # Owner Control Center (OCC) – React SPA
    # Serverseitig durch requireOwnerControlAccess abgesichert (API-Seite).
    # Nginx liefert nur den React-Build aus – Security kommt vom Backend.
    # noindex/nofollow: OCC soll nicht in Suchmaschinen erscheinen.
    # =========================================================================

    # Redirect ohne trailing slash
    location = /owner-control {
        return 301 /owner-control/;
    }

    # OCC SPA – Deep-Link-Fallback auf occ.html (= Vite-Build-Entry, NICHT index.html)
    location /owner-control/ {
        root /usr/share/nginx/html;
        # Kein Cachen des Entry-Points (immer aktuelle Shell)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /owner-control/occ.html;
    }

    # OCC Assets – aggressives Caching via Hash-Filenames (Vite)
    location /owner-control/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================================================================
    # Staff Control Center (SCC) – React SPA
    # Interne TempConnect-Team-Konsole. Strikt getrennt von Plattform und OCC.
    # Security liegt vollständig im Backend (staffControlAccess.js + tc.staff.sid).
    # Nginx liefert nur den React-Build aus. noindex/nofollow.
    # =========================================================================

    # Redirect ohne trailing slash
    location = /staff {
        return 301 /staff/;
    }

    # SCC API — Proxy zum Node-Server (MUSS vor dem /staff/ SPA-Block stehen)
    location /staff/api/ {
        proxy_pass http://api:3000/staff/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # SCC SPA – Deep-Link-Fallback auf staff.html (Vite entry point)
    # Build-Output liegt in frontend/public/staff/ → gemountet als /public/staff/
    location /staff/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /public/staff/staff.html;
    }

    # SCC Assets – aggressives Caching via Hash-Filenames (Vite)
    location /staff/assets/ {
        root /usr/share/nginx/html/public;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # =========================================================================
    # Support Operations Center (SOC) – React SPA
    # Strikt getrennte Oberfläche unter /support-ops/.
    # =========================================================================

    # Redirect ohne trailing slash
    location = /support-ops {
        return 301 /support-ops/;
    }

    # SOC SPA – Deep-Link-Fallback auf index.html
    location /support-ops/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /support-ops/index.html;
    }

    # SOC Assets – aggressive immutable caching
    location /support-ops/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Statische Dateien (Plattform)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /landing.html;
    }
}
