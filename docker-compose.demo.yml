# ─────────────────────────────────────────────────────────────────────────────
# TempConnect — Öffentliche Pilot-Demo via Cloudflare Tunnel (OHNE eigenen Server)
# ─────────────────────────────────────────────────────────────────────────────
# Macht den lokalen Docker-Stack unter einer öffentlichen Adresse erreichbar,
# damit Pilot-/Interessenten damit spielen können — kein Server mieten, keine
# offenen Ports, keine feste IP. Läuft auf DEINEM PC (muss an sein).
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# WICHTIG: beide -f explizit angeben. Dadurch wird der Dev-Override
# (docker-compose.override.yml) NICHT geladen → die API läuft aus dem gebackenen
# Image (kein ./api:/app Bind-Mount) → STABIL, keine 502-Blips für Publikum.
#
# Voraussetzung für den benannten Tunnel: CLOUDFLARE_TUNNEL_TOKEN in .env.
# Schnelltest ganz ohne Token/Account: siehe docs/launch/G_DEMO-CLOUDFLARE-TUNNEL.md
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Demo-Welt seeden (Migration 052 + Demo-Accounts der 3 Perspektiven).
  migrate:
    environment:
      SEED_DEMO_WORLD: "true"

  # E-Mails NUR in den Mock (nie echt nach außen). Profil leeren, damit
  # Mailpit im Demo-Betrieb mitläuft (sonst nur unter --profile dev).
  mailpit:
    profiles: []

  api:
    # KEIN ./api:/app Bind-Mount (Override nicht geladen) → stabiles Image.
    environment:
      # NODE_ENV bleibt hier stehen und ist NICHT redundant: Die Basis setzt
      # `NODE_ENV: ${NODE_ENV:-production}` und zieht damit den Wert aus der
      # lokalen .env — dort steht `development`. Ohne diese Zeile liefe eine
      # OEFFENTLICH getunnelte Demo mit abgeschalteter Produktionshaertung
      # (u. a. waere der SSO-Stub-Login wieder erreichbar).
      NODE_ENV: production
      PAYMENT_MODE: demo          # keine echten Zahlungen
      # FEATURE_GATE_BYPASS war hier "true" — und hat den Stack seit dem ersten
      # Tag am Booten gehindert: `envValidator` lehnt die Kombination mit
      # NODE_ENV=production hart ab (featureFlags.js, productionConstraint
      # "forbidden_when_true"). Die Datei entstand am 2026-07-02, der Guard
      # existierte seit dem 2026-06-01 — der Demo-Stack war NIE lauffaehig,
      # nicht "seit P0-08 kaputt".
      #
      # Schwerer wiegt, dass diese Datei AUSGELIEFERT wird (git-getrackt, nicht
      # in der EXCLUDE_LIST von release-package.sh) und der CI-Waechter gegen den
      # Bypass nur `.env*`-Dateien durchsucht — eine .yml lief unbemerkt durch.
      # Jeder Kunde bekam damit eine Compose-Datei, die alle Plan-Gates oeffnet.
      #
      # Der Kommentar nannte die Absicht: "voller Funktionsumfang im Demo
      # sichtbar". Das ist eine ENTITLEMENT-Frage (Ebene C), kein
      # Plattform-Kill-Switch (Ebene B) — der Bypass war das falsche Werkzeug.
      # Die Demo-Welt vergibt bereits echte Plaene (Mig 052: PLUS + PRO). Wer
      # mehr zeigen will, hebt dort das Plan-Niveau; der Interessent sieht dann
      # die ECHTE Gating-Mechanik statt einer Welt, in der alles frei ist.
      FEATURE_GATE_BYPASS: "false"

      # E-Mail-Flows landen im Mailpit-Mock statt echt rauszugehen
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "demo@tempconnect.de"
      # Öffentliche Demo-Adresse (Links + CORS). Für *.trycloudflare.com-Schnelltest
      # einfach DEMO_BASE_URL in .env auf die trycloudflare-URL setzen.
      BASE_URL: ${DEMO_BASE_URL:-https://demo.tempconnect.de}
      CORS_ORIGIN: ${DEMO_BASE_URL:-https://demo.tempconnect.de}

  # Cloudflare Tunnel: verbindet nginx (frontend:80) ausgehend-verschlüsselt mit
  # Cloudflare → öffentliche URL. Token kommt aus dem Cloudflare-Dashboard
  # (Zero Trust → Networks → Tunnels → Create → Docker → Token kopieren).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tempconnect_cloudflared
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
