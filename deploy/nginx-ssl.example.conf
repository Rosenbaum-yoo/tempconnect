# Nginx – Reverse Proxy + SSL (Let's Encrypt mit certbot)
# Als Vorlage z. B. nach /etc/nginx/sites-available/tempconnect kopieren,
# Domain ersetzen, aktivieren: ln -s ../sites-available/tempconnect sites-enabled/
# SSL: certbot --nginx -d deine-domain.de
#
# Vorher: docker-compose.ports-internal.yml nutzen, App lauscht auf 127.0.0.1:8080.

server {
    listen 80;
    server_name deine-domain.de;
    # Nach certbot: wird zu listen 443 ssl; und ssl_certificate ergaenzt
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
