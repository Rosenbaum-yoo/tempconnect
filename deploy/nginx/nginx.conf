server_tokens off;

server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content-Security-Policy
    # unsafe-inline erlaubt weil das Frontend Vanilla JS mit Inline-Scripts nutzt.
    # Langfristig auf Hash-basiertes CSP oder nonce migrieren (nach Framework-Migration).
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # =========================================================================
    # Routing
    # =========================================================================

    # Public Landing (exakte URL /)
    location = / {
        root /usr/share/nginx/html;
        try_files /landing.html =404;
    }

    # Worker-Einladungs-/Login-Link aus E-Mails (BASE_URL/worker-login.html?invite=...)
    # Die Datei liegt unter /public/ — ohne diesen Alias faellt die URL in den
    # Catch-all und serviert die LANDING: die Einladung waere eine Sackgasse.
    location = /worker-login.html {
        root /usr/share/nginx/html;
        try_files /public/worker-login.html =404;
    }

    # Redirects — Pulse / SLA
    location = /sla   { return 302 /public/enterprise.html; }
    location = /pulse { return 302 /public/enterprise.html; }

    # Legacy Redirects
    location = /search                             { return 302 /index.html#dashboard; }
    location = /public/notifications.html          { return 301 /public/activity.html; }
    location = /public/demand_request_form.html    { return 301 /public/marketplace_demand_create.html; }
    location = /public/login.html                  { return 301 /; }
    location = /app                                { return 302 /; }
    location = /index.html                         { return 302 /; }

    # Legal-Pages (Clean-URLs: /legal/agb -> agb.html)
    location /legal/ {
        root /usr/share/nginx/html/public;
        try_files $uri $uri.html =404;
    }

    # Geschützte App-HTML — niemals cachen (Logout + Browser-Back-Härtung)
    location ~ ^/public/.*\.html$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Upload-Dateien — Proxy zur API
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Upload-Endpoint (bis 5MB)
    location /api/offer-assets/ {
        client_max_body_size 6m;
        proxy_pass http://api:3000/api/offer-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # API Reverse Proxy
    location /api/ {
        # P7b-Fix: ohne Override gilt der nginx-Default von 1m — die Upload-
        # Endpunkte dahinter erlauben aber bis 15m (worker/documents 10m,
        # compliance 10m, document-center 15m, Profil-/Firmenfoto 5m).
        client_max_body_size 16m;
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Health Check
    location /health {
        access_log off;
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Statische Dateien
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /landing.html;
    }
}
