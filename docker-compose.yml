services:
  db:
    image: postgres:16-alpine
    container_name: tempconnect_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Standard: nur localhost (Prod-sicher). Dev mit externem Zugriff: in docker-compose.override.yml ports auf "0.0.0.0:5432:5432" setzen.
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: tempconnect_mailpit
    restart: always
    profiles:
      - dev
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: tempconnect_redis
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: postgres:16-alpine
    container_name: tempconnect_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Demo-Seed-Welt (Migration 052): default AUS (prod-sicher). Der dev-Override
      # (docker-compose.override.yml) setzt dies auf "true"; docker-compose.prod.yml
      # pinnt "false". Wird in migrate.sh zur Session-GUC app.seed_demo_world.
      SEED_DEMO_WORLD: ${SEED_DEMO_WORLD:-false}
    volumes:
      - ./sql/migrate.sh:/migrate.sh:ro
      - ./sql/migrations:/migrations:ro
    command: sh /migrate.sh
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: tempconnect_api
    container_name: tempconnect_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-tempconnect}
      POSTGRES_USER: ${POSTGRES_USER:-tempconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BASE_URL: ${BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      PAYMENT_MODE: ${PAYMENT_MODE:-demo}
      FEATURE_GATE_BYPASS: ${FEATURE_GATE_BYPASS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # ── Staff Control Center ─────────────────────────────────────────────────
      # STAFF_USER_IDS: Komma-separierte UUIDs der ersten Staff-Mitglieder.
      # Diese werden automatisch in die tempconnect_staff-Allowlist eingetragen
      # wenn sie sich zum ersten Mal einloggen (Bootstrap-Mechanismus).
      # Deine User-ID findest du mit: SELECT id FROM users WHERE email='deine@email.de';
      STAFF_USER_IDS: ${STAFF_USER_IDS:-}
      # Eigener Session-Secret für tc.staff.sid (empfohlen, sonst: SESSION_SECRET + ":staff")
      STAFF_SESSION_SECRET: ${STAFF_SESSION_SECRET:-}
      # Hetzner Cloud API Token (leer = Stub-Mode mit Demo-Daten)
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
    volumes:
      - uploads:/app/uploads
      # Lese-Mount fuer Frontend-JS — benoetigt fuer visibilityMatrix-Tests (drift protection + hubVisibility)
      - ./frontend/public/js:/app/frontend/public/js:ro
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: nginx:alpine
    container_name: tempconnect_frontend
    restart: always
    depends_on:
      api:
        condition: service_healthy
    # Dev: 8080:80 OK. Produktion hinter Nginx Reverse Proxy: Port nur intern (z. B. 127.0.0.1:8080:80).
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./support-ops-dist:/usr/share/nginx/html/support-ops:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dbdata:
  uploads:
