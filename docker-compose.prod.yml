# =============================================================================
# TempConnect – PRODUCTION Compose (Explicit, Safe)
# =============================================================================
# Nutzung: IMMER über scripts/prod-up.sh oder explizit:
#   docker compose -f docker-compose.prod.yml [-f docker-compose.prod.managed.yml] up -d --build
#
# KEIN docker-compose.override.yml wird geladen (kein Auto-Merge).
# KEIN lokaler DB-Container – Managed PostgreSQL wird über DATABASE_URL erwartet.
# =============================================================================

services:
  migrate:
    image: postgres:16-alpine
    container_name: tempconnect_migrate
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-}
      POSTGRES_DB: ${POSTGRES_DB:-tempconnect}
      POSTGRES_USER: ${POSTGRES_USER:-tempconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Demo-Seed-Welt (Migration 052) in PROD HART auf false gepinnt (override-t
      # einen etwaigen .env-Wert) — niemals Demo-Accounts mit oeffentlichem Passwort
      # auf Produktion. Remediation-Migration 125 neutralisiert evtl. Altbestand.
      SEED_DEMO_WORLD: "false"
    volumes:
      - ./sql/migrate.sh:/migrate.sh:ro
      - ./sql/migrations:/migrations:ro
    command: sh /migrate.sh
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    container_name: tempconnect_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: tempconnect_api:prod
    container_name: tempconnect_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-tempconnect}
      POSTGRES_USER: ${POSTGRES_USER:-tempconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BASE_URL: ${BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      PAYMENT_MODE: ${PAYMENT_MODE:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["npm", "run", "start"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: nginx:alpine
    container_name: tempconnect_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./support-ops-dist:/usr/share/nginx/html/support-ops:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
