<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/public/js/theme.js"></script>
  <script src="/public/js/i18n.js"></script>
  <title data-i18n="sc.b.docTitle">Preisrahmen – TempConnect</title>
  <link rel="stylesheet" href="/public/css/enterprise.css"/>
  <style>
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--ds-space-3); margin-bottom: var(--ds-space-5); }
    .kpi-tile { padding: var(--ds-space-4); border-radius: var(--ds-radius-lg); border: 1px solid var(--ds-border); background: var(--tc-kpi-bg); text-align: center; }
    .kpi-tile .kpi-val { font-size: 26px; font-weight: 800; display: block; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .kpi-tile .kpi-label { font-size: 11px; color: var(--ds-text-secondary); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .section { margin-bottom: var(--ds-space-6); padding: var(--ds-space-5); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-lg); background: var(--tc-filter-surface); }
    .section h3 { margin: 0 0 var(--ds-space-4); font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ds-text-secondary); font-weight: 700; }
    .filter-row { display: flex; gap: var(--ds-space-3); margin-bottom: var(--ds-space-4); align-items: flex-end; flex-wrap: wrap; padding: var(--ds-space-3); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-lg); background: var(--tc-filter-surface); }
    .filter-row select, .filter-row input { width: auto; margin: 0; max-width: 180px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ds-text-secondary); padding: 8px 10px; border-bottom: 1px solid var(--ds-border); font-weight: 700; }
    td { padding: 10px; border-bottom: 1px solid var(--tc-table-row-border); vertical-align: middle; }
    tr:hover td { background: var(--tc-table-hover-bg); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    .badge-draft { background: var(--tc-badge-neutral-bg); color: var(--ds-text-secondary); }
    .badge-active { background: var(--ds-success-muted); color: var(--good); }
    .badge-expired { background: var(--ds-danger-muted); color: var(--bad); }
    .badge-archived { background: var(--ds-warning-muted); color: var(--warn); }
    .rate-display { font-variant-numeric: tabular-nums; font-weight: 600; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--ds-bg-surface); border: 1px solid var(--ds-border); border-radius: var(--ds-radius-lg); padding: var(--ds-space-6); width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 var(--ds-space-4); font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ds-space-3); }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 12px; color: var(--ds-text-secondary); font-weight: 600; margin-bottom: 2px; display: block; }
    .form-grid input, .form-grid select, .form-grid textarea { width: 100%; margin: 0; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: var(--ds-space-4); }
    .compliance-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
    .empty-state { text-align: center; padding: 40px; color: var(--ds-text-secondary); font-size: 14px; }
    .link-row { display:flex; gap:8px; flex-wrap:wrap; margin: 0 0 var(--ds-space-4); }
    .context-badge { display:none; background: var(--ds-brand-muted); border:1px solid rgba(74,158,255,.2); border-radius:8px; padding:10px 14px; font-size:13px; margin:0 0 var(--ds-space-4); color:var(--ds-text-secondary); }
    /* .page-state canonical definitions live in design-system.css (WAVE_10) */
    .section-note { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--ds-border); color: var(--ds-text-secondary); font-size: 12px; background: var(--tc-filter-surface); }

    /* EDITORIAL — de-blue context-badge border (surfaces use --ds/--tc tokens; scoped, dark untouched) */
    [data-theme="editorial"] .context-badge { border-color: rgba(31,58,46,.2); }
    /* JS-set purple stat color on .kpi-val (inline) → forest (attribute hook beats inline style) */
    [data-theme="editorial"] .kpi-val[style*="#7c5cff"] { color: #1f3a2e !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="tc-shell"></div>

    <div class="ds-page-header">
      <div class="ds-page-header__content">
        <h1 class="ds-page-title" data-i18n="sc.b.page.title">Preisrahmen</h1>
        <p class="ds-page-subtitle" data-i18n="sc.b.page.subtitle">Ziel- und Maximalsaetze pro Rolle, Region und Lieferant steuern.</p>
      </div>
      <div class="ds-page-header__actions">
        <button id="rateCardCreateBtn" class="btn primary" data-feature-key="rate_card_management" onclick="openCreateModal()" data-i18n="sc.b.action.create">+ Neuer Preisrahmen</button>
      </div>
    </div>
    <div class="link-row">
      <a class="btn" data-feature-key="supplier_management" href="/public/vendor_pool.html" data-i18n="sc.b.nav.vendorPool">Lieferantenpool</a>
      <a class="btn" href="/public/requisitions.html" data-i18n="sc.b.nav.requisitions">Angebote</a>
      <a class="btn" data-feature-key="spend_analytics" href="/public/spend-analytics.html" data-i18n="sc.b.nav.spend">Spend &amp; Kosten</a>
      <a class="btn" data-feature-key="supplier_ratings" href="/public/supplier_scorecard.html" data-i18n="sc.b.nav.scorecard">Lieferantenbewertung</a>
    </div>
    <div id="rateCardContextBadge" class="context-badge"></div>
    <div id="rateCardState" class="page-state"></div>

    <!-- KPI Tiles -->
    <div class="kpi-grid" id="kpiGrid"><div class="kpi-tile"><span class="kpi-val">–</span><span class="kpi-label" data-i18n="sc.b.loading">Lade…</span></div></div>

    <!-- Filters — option[value] bleibt unveraendert: die Werte gehen als
         status= / compliance_status= an den Server, nur die Labels sind zweisprachig. -->
    <div class="filter-row">
      <div><label style="margin:0;font-size:11px;color:var(--ds-text-secondary)" data-i18n="sc.b.filter.status">Status</label>
        <select id="fStatus" onchange="refreshRateCards()"><option value="" data-i18n="sc.b.filter.all">Alle</option><option value="active" data-i18n="sc.b.status.active">Aktiv</option><option value="draft" data-i18n="sc.b.status.draft">Entwurf</option><option value="expired" data-i18n="sc.b.status.expired">Abgelaufen</option><option value="archived" data-i18n="sc.b.status.archived">Archiviert</option></select></div>
      <div><label style="margin:0;font-size:11px;color:var(--ds-text-secondary)" data-i18n="sc.b.filter.compliance">Compliance (30 Tage)</label>
        <select id="fComplianceStatus" onchange="refreshRateCards()"><option value="" data-i18n="sc.b.filter.all">Alle</option><option value="at_risk" data-i18n="sc.b.comp.atRisk">Warnung / Verstoß</option><option value="warning" data-i18n="sc.b.comp.warning">Nur Warnung</option><option value="non_compliant" data-i18n="sc.b.comp.nonCompliant">Nur Verstoß</option></select></div>
      <div><label style="margin:0;font-size:11px;color:var(--ds-text-secondary)" data-i18n="sc.b.filter.role">Rolle</label>
        <input id="fRole" type="text" placeholder="z.B. Schweißer" data-i18n-ph="sc.b.filter.rolePh" onkeydown="if(event.key==='Enter')refreshRateCards()"/></div>
      <div><label style="margin:0;font-size:11px;color:var(--ds-text-secondary)" data-i18n="sc.b.filter.region">Region</label>
        <input id="fRegion" type="text" placeholder="z.B. München" data-i18n-ph="sc.b.filter.regionPh" onkeydown="if(event.key==='Enter')refreshRateCards()"/></div>
      <div><label style="margin:0;font-size:11px;color:var(--ds-text-secondary)" data-i18n="sc.b.filter.supplier">Lieferant</label>
        <select id="fSupplier" onchange="refreshRateCards()"><option value="" data-i18n="sc.b.filter.allSuppliers">Alle Lieferanten</option></select></div>
      <button class="btn" data-feature-key="rate_card_management" onclick="refreshRateCards()" data-i18n="sc.b.filter.apply">Filtern</button>
    </div>

    <!-- Table -->
    <div class="section">
      <h3 data-i18n="sc.b.section.list">Preisrahmen</h3>
      <div id="tableWrap">
        <table>
          <thead><tr>
            <th data-i18n="sc.b.col.role">Rolle</th><th data-i18n="sc.b.col.region">Region</th><th data-i18n="sc.b.col.vendor">Vendor</th><th data-i18n="sc.b.col.target">Ziel €/h</th><th data-i18n="sc.b.col.max">Max €/h</th><th data-i18n="sc.b.col.validFrom">Gültig ab</th><th data-i18n="sc.b.col.status">Status</th><th data-i18n="sc.b.col.actions">Aktionen</th>
          </tr></thead>
          <tbody id="tableBody"><tr><td colspan="8" class="empty-state" data-i18n="sc.b.loading">Lade…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- Compliance Summary -->
    <div class="section">
      <h3 data-i18n="sc.b.section.compliance">Preisrahmen-Compliance (30 Tage)</h3>
      <div class="kpi-grid" id="complianceGrid" style="grid-template-columns:repeat(4,1fr)"></div>
    </div>
  </div>

  <!-- Create/Edit Modal (hidden) -->
  <div id="modalOverlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2 id="modalTitle" data-i18n="sc.b.modal.title">Neuer Preisrahmen</h2>
      <form id="rcForm" onsubmit="return saveCard(event)">
        <input type="hidden" id="editId" value=""/>
        <div class="form-grid">
          <div><label data-i18n="sc.b.form.role">Rolle / Kategorie *</label><input id="fmRole" required placeholder="z.B. Schweißer" data-i18n-ph="sc.b.filter.rolePh"/></div>
          <div><label data-i18n="sc.b.form.region">Region</label><input id="fmRegion" placeholder="Stadt / Bundesland" data-i18n-ph="sc.b.form.regionPh"/></div>
          <div class="full"><label data-i18n="sc.b.form.supplier">Lieferant (optional)</label><select id="fmSupplierOrg"><option value="" data-i18n="sc.b.filter.allSuppliers">Alle Lieferanten</option></select></div>
          <div><label data-i18n="sc.b.form.target">Ziel-Satz (Cent) *</label><input id="fmTarget" type="number" min="1" required placeholder="3500 = 35,00 €" data-i18n-ph="sc.b.form.targetPh"/></div>
          <div><label data-i18n="sc.b.form.max">Max-Satz (Cent) *</label><input id="fmMax" type="number" min="1" required placeholder="4500 = 45,00 €" data-i18n-ph="sc.b.form.maxPh"/></div>
          <div><label data-i18n="sc.b.form.min">Min-Satz (Cent)</label><input id="fmMin" type="number" min="0" placeholder="optional" data-i18n-ph="sc.b.form.minPh"/></div>
          <div><label data-i18n="sc.b.form.validFrom">Gültig ab *</label><input id="fmFrom" type="date" required/></div>
          <div><label data-i18n="sc.b.form.validTo">Gültig bis</label><input id="fmTo" type="date"/></div>
          <div><label data-i18n="sc.b.form.overtime">ÜZ-Zuschlag %</label><input id="fmOT" type="number" step="0.1" value="25.0"/></div>
          <div class="full"><label data-i18n="sc.b.form.notes">Notizen</label><textarea id="fmNotes" rows="2" placeholder="Interne Notiz…" data-i18n-ph="sc.b.form.notesPh"></textarea></div>
        </div>
        <div class="btn-row">
          <button type="button" class="btn" onclick="closeModal()" data-i18n="sc.b.form.cancel">Abbrechen</button>
          <button type="submit" class="btn primary" id="saveBtn" data-feature-key="rate_card_management" data-i18n="sc.b.form.save">Speichern</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/public/js/planFeatures.js"></script>
  <script src="/public/js/entitlements.js"></script>

  /* ── Woerterbuch (P6.1, DE/EN) fuer rate-cards.html ───────────────────────
     Zweiter Unter-Namensraum "sc.b." der Lieferanten-/Konditionsgruppe, damit
     nichts mit supplier_scorecard.html ("sc.") kollidiert. i18n.js liegt im
     <head>, der Sprach-Umschalter kommt aus pageShell.js.

     Bewusst NICHT uebersetzt:
     - Topbar/Navigation/Nutzerbereich (pageShell.js)
     - API-Datenwerte: Rollen-/Kategoriebezeichnung, Region, Lieferantenname,
       Status-Rohwerte (draft/active/expired/archived), Betraege, Datumswerte
     - option[value] aller Filter (status=, compliance_status=, supplier_org_id=)
     - result.message / result.error aus der API (serverseitig formuliert)

     Rollenlage: rate-cards.html ist laut api/config/visibilityMatrix.js auf
     allowed_org_types ["company"] begrenzt — nur die Unternehmensseite erreicht
     die Inhalte. Ihre feste Buyer-Sprache ("Lieferant") ist damit korrekt.

    function centsToEur(c) { return c != null ? (c / 100).toFixed(2) : '–'; }
    function formatDate(value) {
      if (!value) return '';
      var date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString(TCi18n.dateLocale());
    }
    function isWindowOverlapDrilldown() {
      return rateCardView.statusGroup === 'window_overlap_30d' && rateCardView.windowDateFrom && rateCardView.windowDateTo;
    }
    function applyRateCardContextDefaults() {
      var statusEl = document.getElementById('fStatus');
      if (!statusEl) return;
      if (rateCardView.lockedStatus) {
        statusEl.value = rateCardView.lockedStatus;
        statusEl.disabled = true;
        statusEl.title = t('sc.b.ctx.lockedStatusTitle');
      } else {
        statusEl.disabled = false;
        statusEl.title = '';
      }
    }
    function renderPageState(id, tone, title, text) {
      var el = document.getElementById(id);
      if (!el) return;
      if (!title && !text) {
        el.className = 'page-state';
        el.innerHTML = '';
        el.style.display = 'none';
        return;
      }
      el.className = 'page-state page-state--' + (tone || 'info');
      el.innerHTML = '<div class="page-state__title">' + esc(title || '') + '</div><div class="page-state__text">' + esc(text || '') + '</div>';
      el.style.display = '';
    }
    function showRateCardState(tone, title, text) { renderPageState('rateCardState', tone, title, text); }
    function clearRateCardState() { renderPageState('rateCardState'); }
    function sectionNote(text) { return '<div class="section-note">' + esc(text) + '</div>'; }
    function gridNote(text) { return '<div class="section-note" style="grid-column:1 / -1">' + esc(text) + '</div>'; }
    function parseApiError(result, fallback) {
      if (!result) return fallback;
      if (typeof result.error === 'string' && result.error) return result.error;
      if (Array.isArray(result.details) && result.details.length) return result.details.join(', ');
      if (typeof result.details === 'string' && result.details) return result.details;
      return fallback;
    }
    function readStoredRateCardFilters() {
      try {
        var raw = sessionStorage.getItem(RATE_CARD_FILTER_STORAGE_KEY);
        if (!raw) return {};
        var parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (e) { return {}; }
    }
    function writeStoredRateCardFilters(filters) {
      try { sessionStorage.setItem(RATE_CARD_FILTER_STORAGE_KEY, JSON.stringify(filters || {})); } catch (e) {}
    }
    function setStatsLoading() {
      document.getElementById('kpiGrid').innerHTML = '<div class="kpi-tile"><span class="kpi-val">–</span><span class="kpi-label">' + esc(t('sc.b.loading')) + '</span></div>';
      document.getElementById('complianceGrid').innerHTML = gridNote(t('sc.b.loading.compliance'));
    }
    function setRateCardLoading() {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="empty-state">' + esc(t('sc.b.loading')) + '</td></tr>';
    }
    function collectRateCardIssues() {
      var issues = [];
      if (rateCardSupplierOptionsIssue) issues.push(t('sc.b.issue.supplierFilter'));
      if (rateCardStatsIssue) issues.push(t('sc.b.issue.stats'));
      return issues;
    }
    function joinIssues(issues) { return issues.join(t('sc.b.issue.separator')); }
    function extraMissing(issues) {
      return issues.length ? t('sc.b.state.extraMissing', { issues: joinIssues(issues) }) : '';
    }
    function syncRateCardState(listFailed) {
      if (!rateCardAccess.canRead) return;
      var issues = collectRateCardIssues();
      if (listFailed) {
        showRateCardState('bad', t('sc.b.state.listFailTitle'), t('sc.b.state.listFailText') + extraMissing(issues));
        return;
      }
      if (rateCardView.statusGroup === 'window_overlap_30d' && !isWindowOverlapDrilldown()) {
        showRateCardState('warn', t('sc.b.state.drilldownIncompleteTitle'), t('sc.b.state.drilldownIncompleteText') + extraMissing(issues));
        return;
      }
      if (issues.length) {
        showRateCardState('warn', t('sc.b.state.partialTitle'), t('sc.b.state.partialText', { issues: joinIssues(issues) }));
      } else if (rateCardAccess.mode === 'read_only') {
        showRateCardState('info', t('sc.b.access.readonlyTitle'), t('sc.b.access.readonlyText'));
      } else {
        clearRateCardState();
      }
    }
    function renderPostMutationState(title, text) {
      var issues = collectRateCardIssues();
      if (issues.length) {
        showRateCardState('warn', title, text + t('sc.b.state.postMutationSuffix', { issues: joinIssues(issues) }));
      } else {
        showRateCardState('good', title, text);
      }
    }
    function buildScorecardUrl(supplierId, supplierName) {
      return '/public/supplier_scorecard.html?agencyId=' + encodeURIComponent(supplierId || '') + '&agencyName=' + encodeURIComponent(supplierName || '');
    }
    function buildSpendUrl(supplierId, supplierName, role, region) {
      var url = '/public/spend-analytics.html?vendor_id=' + encodeURIComponent(supplierId || '') + '&supplier=' + encodeURIComponent(supplierName || '');
      if (role) url += '&category=' + encodeURIComponent(role);
      if (region) url += '&region=' + encodeURIComponent(region);
      return url;
    }
    function currentRateCardFilters() {
      var filters = {
        status: document.getElementById('fStatus').value || '',
        complianceStatus: document.getElementById('fComplianceStatus').value || '',
        role: document.getElementById('fRole').value.trim(),
        region: document.getElementById('fRegion').value.trim(),
        supplierOrgId: document.getElementById('fSupplier').value || '',
        dateFrom: '',
        dateTo: ''
      };
      if (isWindowOverlapDrilldown()) {
        filters.status = rateCardView.lockedStatus || 'active';
        filters.dateFrom = rateCardView.windowDateFrom;
        filters.dateTo = rateCardView.windowDateTo;
      }
      return filters;
    }
    function buildRateCardQueryString(includeLimit) {
      var filters = currentRateCardFilters();
      var parts = [];
      if (includeLimit) parts.push('limit=100');
      if (filters.status) parts.push('status=' + encodeURIComponent(filters.status));
      if (filters.complianceStatus) parts.push('compliance_status=' + encodeURIComponent(filters.complianceStatus));
      if (filters.role) parts.push('role_category=' + encodeURIComponent(filters.role));
      if (filters.region) parts.push('region=' + encodeURIComponent(filters.region));
      if (filters.supplierOrgId) parts.push('supplier_org_id=' + encodeURIComponent(filters.supplierOrgId));
      if (filters.dateFrom) parts.push('date_from=' + encodeURIComponent(filters.dateFrom));
      if (filters.dateTo) parts.push('date_to=' + encodeURIComponent(filters.dateTo));
      return parts.length ? ('?' + parts.join('&')) : '';
    }
    function ensureSelectOption(selectEl, value, label) {
      if (!selectEl || !value) return;
      for (var i = 0; i < selectEl.options.length; i += 1) {
        if (selectEl.options[i].value === value) return;
      }
      var option = document.createElement('option');
      option.value = value;
      option.textContent = label || value;
      selectEl.appendChild(option);
    }
    async function fetchCurrentMe() {
      try {
        var response = await fetch('/api/me', { credentials: 'include' });
        if (response.status === 401) {
          location.href = '/';
          return null;
        }
        if (!response.ok) return null;
        return await response.json();
      } catch (err) {
        return null;
      }
    }
    function buildAccessFromApiError(result) {
      if (!result || !result.error) return null;
      if (result.error === 'RATE_CARD_NOT_AVAILABLE_FOR_ORG_TYPE') {
        return {
          mode: 'org_locked',
          tone: 'info',
          canRead: false,
          canWrite: false,
          titleKey: 'sc.b.access.orgTitle',
          textKey: 'sc.b.access.orgText',
          // Serverseitig formulierte Meldung gewinnt und wird NICHT uebersetzt.
          textRaw: result.message || ''
        };
      }
      if (result.error === 'FEATURE_NOT_ALLOWED' && result.feature === 'rate_card_management') {
        return {
          mode: 'plan_locked',
          tone: 'warn',
          canRead: false,
          canWrite: false,
          titleKey: 'sc.b.access.planTitle',
          textKey: 'sc.b.access.planTextShort'
        };
      }
      return null;
    }
    function applyRateCardApiErrorState(result) {
      var access = buildAccessFromApiError(result);
      if (!access) return false;
      rateCardAccess = access;
      applyRateCardAccess(rateCardAccess);
      return true;
    }

    function getLocHeader() {
      try { return (window.TC && TC.api && typeof TC.api.getActiveLocationId === 'function') ? TC.api.getActiveLocationId() : null; } catch (_e) { return null; }
    }
    function getLocLabel() {
      try { return sessionStorage.getItem('tc.activeLocationName') || null; } catch (_e) { return null; }
    }
    async function api(path, opts) {
      try {
        var o = Object.assign({ credentials: 'include' }, opts || {});
        if (o.body && typeof o.body === 'object' && !(o.body instanceof FormData)) {
          o.headers = Object.assign({ 'Content-Type': 'application/json', 'x-csrf-token': csrfToken }, o.headers || {});
          o.body = JSON.stringify(o.body);
        }
        var locId = getLocHeader();
        if (locId) o.headers = Object.assign({}, o.headers || {}, { 'X-Location-Id': locId });
        var r = await fetch('/api' + path, o);
        if (r.status === 401) { location.href = '/'; return null; }
        var text = await r.text();
        var data = {};
        if (text) {
          try { data = JSON.parse(text); } catch (err) { data = {}; }
        }
        if (r.ok) return data;
        if (!data.error) data.error = r.status === 403 ? t('sc.b.error.forbidden') : 'HTTP ' + r.status;
        return data;
      } catch (e) {
        return { error: t('sc.b.error.network') };
      }
    }

    function selectedSupplierName() {
      var sel = document.getElementById('fSupplier');
      if (!sel || !sel.value || !sel.selectedOptions || !sel.selectedOptions[0]) return '';
      return sel.selectedOptions[0].textContent || '';
    }

    /* Rohwert (at_risk/warning/…) bleibt der Server-Filterwert; nur das
       angezeigte Etikett ist zweisprachig. */
    function complianceStatusLabel(value) {
      if (value === 'at_risk') return t('sc.b.comp.atRisk');
      if (value === 'warning') return t('sc.b.comp.warning');
      if (value === 'non_compliant') return t('sc.b.comp.nonCompliant');
      if (value === 'compliant') return t('sc.b.comp.compliant');
      return '';
    }

    function renderContextBadge(preSupplierName) {
      var filters = currentRateCardFilters();
      var supplierName = selectedSupplierName() || preSupplierName || '';
      var parts = [];
      var title = '';
      var text = '';
      // [P2-B] Standort-Kontext: Rate Cards gelten org-weit, kein Location-Scope-Filter
      var locId = getLocHeader();
      var locLbl = getLocLabel();
      if (isWindowOverlapDrilldown()) {
        title = t('sc.b.ctx.drilldownTitle');
        text = t('sc.b.ctx.drilldownText', { from: formatDate(rateCardView.windowDateFrom), to: formatDate(rateCardView.windowDateTo) });
        parts.push(esc(t('sc.b.ctx.period')) + ' <strong>' + esc(formatDate(rateCardView.windowDateFrom) + ' – ' + formatDate(rateCardView.windowDateTo)) + '</strong>');
        // "active" ist der Status-Rohwert der API, kein Anzeigetext.
        parts.push(esc(t('sc.b.ctx.status')) + ' <strong>active</strong>');
      } else if (filters.status) {
        parts.push(esc(t('sc.b.ctx.status')) + ' <strong>' + esc(filters.status) + '</strong>');
      }
      if (filters.complianceStatus) parts.push(esc(t('sc.b.ctx.compliance')) + ' <strong>' + esc(complianceStatusLabel(filters.complianceStatus)) + '</strong>');
      if (filters.role) parts.push(esc(t('sc.b.ctx.role')) + ' <strong>' + esc(filters.role) + '</strong>');
      if (filters.region) parts.push(esc(t('sc.b.ctx.region')) + ' <strong>' + esc(filters.region) + '</strong>');
      if (filters.supplierOrgId) parts.push(esc(t('sc.b.ctx.supplier')) + ' <strong>' + esc(supplierName) + '</strong>');
      var badge = document.getElementById('rateCardContextBadge');
      if (!title && !parts.length && !locId) {
        badge.style.display = 'none';
        badge.innerHTML = '';
        return;
      }
      badge.style.display = 'block';
      badge.innerHTML =
        (title ? '<strong>' + esc(title) + '</strong>' : '') +
        (text ? '<div style="margin-top:6px">' + esc(text) + '</div>' : '') +
        (parts.length ? '<div style="margin-top:6px">' + esc(t('sc.b.ctx.activeContext')) + parts.join(' &bull; ') + '</div>' : '') +
        (locId ? '<div style="margin-top:8px;color:var(--ds-text-secondary);font-size:12px">' + esc(t('sc.b.ctx.locationNote', { loc: locLbl || locId })) + '</div>' : '') +
        ((title || parts.length) ? '<div style="margin-top:6px"><a href="/public/rate-cards.html" style="color:var(--brand);font-size:12px">' + esc(t('sc.b.ctx.reset')) + ' &times;</a></div>' : '');
    }
    function renderKpiTiles(cards) {
      var tiles;
      if (isWindowOverlapDrilldown()) {
        tiles = [
          { label: t('sc.b.kpi.activeInWindow'), val: cards.total || cards.active || 0, color: 'var(--good)' },
          { label: t('sc.b.kpi.rolesInWindow'), val: cards.role_categories || 0, color: 'var(--brand)' },
          { label: t('sc.b.kpi.vendorSpecific'), val: cards.vendor_specific || 0, color: '#7c5cff' }
        ];
      } else {
        tiles = [
          { label: t('sc.b.kpi.total'), val: cards.total || 0, color: 'var(--text)' },
          { label: t('sc.b.kpi.active'), val: cards.active || 0, color: 'var(--good)' },
          { label: t('sc.b.kpi.draft'), val: cards.draft || 0, color: 'var(--ds-text-secondary)' },
          { label: t('sc.b.kpi.expired'), val: cards.expired || 0, color: 'var(--bad)' },
          { label: t('sc.b.kpi.roles'), val: cards.role_categories || 0, color: 'var(--brand)' },
          { label: t('sc.b.kpi.vendorSpecific'), val: cards.vendor_specific || 0, color: '#7c5cff' }
        ];
      }
      // Laufvariable heisst bewusst NICHT t — das wuerde die Uebersetzerfunktion
      // in diesem Block verdecken.
      document.getElementById('kpiGrid').innerHTML = tiles.map(function(tile) {
        return '<div class="kpi-tile"><span class="kpi-val" style="color:' + tile.color + '">' + esc(String(tile.val)) + '</span><span class="kpi-label">' + esc(tile.label) + '</span></div>';
      }).join('');
    }
    function renderComplianceTiles(comp) {
      document.getElementById('complianceGrid').innerHTML = [
        { label: t('sc.b.kpi.checked'), val: comp.total_checks || 0, color: 'var(--text)' },
        { label: t('sc.b.kpi.compliant'), val: comp.compliant || 0, color: 'var(--good)' },
        { label: t('sc.b.kpi.warning'), val: comp.warnings || 0, color: 'var(--warn)' },
        { label: t('sc.b.kpi.nonCompliant'), val: comp.non_compliant || 0, color: 'var(--bad)' }
      ].map(function(tile) {
        return '<div class="kpi-tile"><span class="kpi-val" style="color:' + tile.color + '">' + esc(String(tile.val)) + '</span><span class="kpi-label">' + esc(tile.label) + '</span></div>';
      }).join('');
    }
    function buildRateCardLoadingText() {
      return isWindowOverlapDrilldown()
        ? t('sc.b.state.loadingDrilldown')
        : t('sc.b.state.loadingDefault');
    }

    async function init() {
      showRateCardState('info', t('sc.b.state.initTitle'), t('sc.b.state.initText'));
      setStatsLoading();
      setRateCardLoading();
      currentMe = await fetchCurrentMe();
      rateCardAccess = resolveRateCardAccess(currentMe);
      applyRateCardAccess(rateCardAccess);
      if (!rateCardAccess.canRead) return;
      if (rateCardAccess.canWrite) {
        try {
          var csrf = await fetch('/api/csrf', { credentials: 'include' });
          if (csrf.ok) { var d = await csrf.json(); csrfToken = d.csrfToken || ''; }
        } catch (e) {
          showRateCardState('warn', t('sc.b.state.csrfTitle'), t('sc.b.state.csrfText'));
        }
      }
      var hasUrlFilters = rateCardQuery.has('status_group') || rateCardQuery.has('date_from') || rateCardQuery.has('date_to') ||
        rateCardQuery.has('status') || rateCardQuery.has('compliance_status') || rateCardQuery.has('role') || rateCardQuery.has('region') ||
        rateCardQuery.has('supplier_org_id') || rateCardQuery.has('vendor_id') || rateCardQuery.has('supplier_name') || rateCardQuery.has('supplier');
      var storedFilters = hasUrlFilters ? {} : readStoredRateCardFilters();
      var preComplianceStatus = hasUrlFilters ? (rateCardQuery.get('compliance_status') || '') : (storedFilters.complianceStatus || '');
      var preRole = hasUrlFilters ? (rateCardQuery.get('role') || '') : (storedFilters.role || '');
      var preRegion = hasUrlFilters ? (rateCardQuery.get('region') || '') : (storedFilters.region || '');
      var preSupplierId = hasUrlFilters
        ? (rateCardQuery.get('supplier_org_id') || rateCardQuery.get('vendor_id') || '')
        : (storedFilters.supplierOrgId || '');
      var preSupplierName = rateCardQuery.get('supplier_name') || rateCardQuery.get('supplier') || '';
      var preStatus = hasUrlFilters ? (rateCardQuery.get('status') || '') : (storedFilters.status || '');
      if (preComplianceStatus) document.getElementById('fComplianceStatus').value = preComplianceStatus;
      if (preRole) document.getElementById('fRole').value = preRole;
      if (preRegion) document.getElementById('fRegion').value = preRegion;
      if (!rateCardView.lockedStatus && preStatus) document.getElementById('fStatus').value = preStatus;
      applyRateCardContextDefaults();
      await loadSupplierOptions(preSupplierId, preSupplierName);
      if (preSupplierId) document.getElementById('fSupplier').value = preSupplierId;
      renderContextBadge(preSupplierName);
      await refreshRateCards(preSupplierName, false);
    }

    async function loadSupplierOptions(preselectedId, preselectedName) {
      if (!rateCardAccess.canRead) return;
      var d = await api('/suppliers/enriched?limit=100');
      var sel = document.getElementById('fmSupplierOrg');
      var filterSel = document.getElementById('fSupplier');
      if (!sel) return;
      // value="" bleibt leer (Server-Filter) — nur das Label ist zweisprachig.
      var allOption = '<option value="">' + esc(t('sc.b.filter.allSuppliers')) + '</option>';
      if (!d || d.error) {
        rateCardSupplierOptionsIssue = true;
        sel.innerHTML = allOption;
        if (filterSel) filterSel.innerHTML = allOption;
        return;
      }
      var items = (d && d.items) || [];
      rateCardSupplierOptionsIssue = false;
      var options = items.map(function(it){
        var id = it.supplier_org_id || '';
        var name = it.supplier_org_name || it.supplier_org_id || t('sc.b.filter.supplierFallback');
        return '<option value="' + esc(id) + '">' + esc(name) + '</option>';
      }).join('');
      sel.innerHTML = allOption + options;
      if (filterSel) filterSel.innerHTML = allOption + options;
      if (preselectedId) {
        ensureSelectOption(sel, preselectedId, preselectedName || preselectedId);
        ensureSelectOption(filterSel, preselectedId, preselectedName || preselectedId);
      }
    }

    async function loadStats(loadId) {
      if (!rateCardAccess.canRead) return { status: 'blocked' };
      var d = await api('/rate-cards/stats' + buildRateCardQueryString(false));
      if (loadId !== rateCardLoadVersion) return { status: 'stale' };
      if (applyRateCardApiErrorState(d)) return { status: 'blocked' };
      if (!d || d.error || !d.data) {
        rateCardStatsIssue = true;
        document.getElementById('kpiGrid').innerHTML = '<div class="kpi-tile"><span class="kpi-val">!</span><span class="kpi-label">' + esc(t('sc.b.stats.unavailable')) + '</span></div>';
        document.getElementById('complianceGrid').innerHTML = gridNote(t('sc.b.stats.complianceFail'));
        return { status: 'error' };
      }
      rateCardStatsIssue = false;
      renderKpiTiles(d.data.cards || {});
      renderComplianceTiles(d.data.compliance_30d || {});
      return { status: 'ok' };
    }

    async function loadCards(loadId, preSupplierName) {
      if (!rateCardAccess.canRead) return { status: 'blocked' };
      var filters = currentRateCardFilters();
      var qs = buildRateCardQueryString(true);
      renderContextBadge(preSupplierName);
      var d = await api('/rate-cards' + qs);
      var body = document.getElementById('tableBody');
      if (loadId !== rateCardLoadVersion) return { status: 'stale' };
      if (applyRateCardApiErrorState(d)) {
        body.innerHTML = '<tr><td colspan=\"8\" class=\"empty-state\">' + esc(t('sc.b.access.blockedRow')) + '</td></tr>';
        return { status: 'blocked' };
      }
      if (!d || d.error || !d.data || !d.data.items) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state">' + esc(t('sc.b.list.loadFail')) + '</td></tr>';
        return { status: 'error' };
      }
      if (!d.data.items.length) {
        var hasScopedFilter = filters.complianceStatus || filters.role || filters.region || filters.supplierOrgId || (!isWindowOverlapDrilldown() && filters.status);
        var locLbl = getLocLabel();
        var emptyText = isWindowOverlapDrilldown()
          ? (hasScopedFilter
            ? t('sc.b.empty.drilldownFiltered')
            : t('sc.b.empty.drilldown'))
          : (hasScopedFilter
            ? (locLbl ? t('sc.b.empty.filteredLoc', { loc: locLbl }) : t('sc.b.empty.filtered'))
            : (locLbl ? t('sc.b.empty.noneLoc', { loc: locLbl }) : t('sc.b.empty.none')));
        body.innerHTML = '<tr><td colspan="8" class="empty-state">' + esc(emptyText) + '</td></tr>';
        return { status: 'empty' };
      }

      body.innerHTML = d.data.items.map(function(rc) {
        var badge = '<span class="badge badge-' + rc.status + '">' + esc(rc.status) + '</span>';
        // Lieferantenname, Region und Status-Rohwert sind API-Daten und bleiben
        // unuebersetzt; nur die Platzhalter-Etiketten sind zweisprachig.
        var vendor = rc.supplier_name && rc.supplier_org_id
          ? '<a href="' + buildScorecardUrl(rc.supplier_org_id, rc.supplier_name) + '" style="color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.2)" title="' + esc(t('sc.b.cell.scorecardTitle')) + '">' + esc(rc.supplier_name) + '</a>'
          : (rc.supplier_name || '<span style="color:var(--ds-text-secondary)">' + esc(t('sc.b.cell.allSuppliers')) + '</span>');
        var regionLabel = rc.region || (rc.location_name || '<span style="color:var(--ds-text-secondary)">' + esc(t('sc.b.cell.global')) + '</span>');
        var validFrom = rc.valid_from ? rc.valid_from.slice(0,10) : '–';
        var actions = '';
        if (rateCardAccess.canWrite && rc.status === 'draft') {
          actions += '<button class="btn" data-feature-key="rate_card_management" style="padding:2px 8px;font-size:11px" onclick="activateCard(\''+rc.id+'\')">' + esc(t('sc.b.row.activate')) + '</button> ';
        }
        if (rateCardAccess.canWrite && (rc.status === 'draft' || rc.status === 'active')) {
          actions += '<button class="btn" data-feature-key="rate_card_management" style="padding:2px 8px;font-size:11px" onclick="archiveCard(\''+rc.id+'\')">' + esc(t('sc.b.row.archive')) + '</button>';
        }
        if (rc.supplier_org_id) {
          actions += ' <a class="btn" data-feature-key="supplier_ratings" style="padding:2px 8px;font-size:11px" href="' + buildScorecardUrl(rc.supplier_org_id, rc.supplier_name || '') + '">' + esc(t('sc.b.row.scorecard')) + '</a>';
          actions += ' <a class="btn" data-feature-key="spend_analytics" style="padding:2px 8px;font-size:11px" href="' + buildSpendUrl(rc.supplier_org_id, rc.supplier_name || '', rc.role_category, rc.region || rc.location_name || '') + '">' + esc(t('sc.b.row.spend')) + '</a>';
        }
        return '<tr>'+
          '<td><strong>'+esc(rc.role_category)+'</strong></td>'+
          '<td>'+regionLabel+'</td>'+
          '<td>'+vendor+'</td>'+
          '<td class="rate-display">'+centsToEur(rc.target_rate_cents)+' €</td>'+
          '<td class="rate-display">'+centsToEur(rc.max_rate_cents)+' €</td>'+
          '<td>'+validFrom+'</td>'+
          '<td>'+badge+'</td>'+
          '<td>'+actions+'</td>'+
          '</tr>';
      }).join('');
      applyRateCardDomLocks(body);
      return { status: 'ok' };
    }

    async function refreshRateCards(preSupplierName, persist) {
      if (!rateCardAccess.canRead) return { status: 'blocked' };
      var shouldPersist = persist !== false;
      if (shouldPersist) {
        var stored = currentRateCardFilters();
        writeStoredRateCardFilters({
          status: rateCardView.lockedStatus ? '' : (stored.status || ''),
          complianceStatus: stored.complianceStatus || '',
          role: stored.role || '',
          region: stored.region || '',
          supplierOrgId: stored.supplierOrgId || ''
        });
      }
      var loadId = ++rateCardLoadVersion;
      renderContextBadge(preSupplierName);
      showRateCardState('info', isWindowOverlapDrilldown() ? t('sc.b.state.drilldownTitle') : t('sc.b.state.initTitle'), buildRateCardLoadingText());
      setStatsLoading();
      setRateCardLoading();
      var results = await Promise.all([loadStats(loadId), loadCards(loadId, preSupplierName)]);
      if (loadId !== rateCardLoadVersion) return { status: 'stale' };
      var listResult = results[1] || { status: 'error' };
      if (listResult.status === 'blocked') return { status: 'blocked', stats: results[0], list: listResult };
      syncRateCardState(listResult.status === 'error');
      return { status: listResult.status, stats: results[0], list: listResult };
    }

    function openCreateModal() {
      if (!ensureRateCardWriteAccess('sc.b.write.create')) return;
      document.getElementById('editId').value = '';
      // Marker bleibt stehen (parameterloser Schluessel) — apply() darf hier
      // ruhig nachziehen, es ist derselbe Text.
      document.getElementById('modalTitle').textContent = t('sc.b.modal.title');
      document.getElementById('rcForm').reset();
      document.getElementById('fmOT').value = '25.0';
      document.getElementById('fmRole').value = document.getElementById('fRole').value.trim();
      document.getElementById('fmRegion').value = document.getElementById('fRegion').value.trim();
      document.getElementById('fmSupplierOrg').value = document.getElementById('fSupplier').value || '';
      document.getElementById('modalOverlay').style.display = '';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    async function saveCard(e) {
      e.preventDefault();
      if (!ensureRateCardWriteAccess('sc.b.write.save')) return false;
      var target = parseInt(document.getElementById('fmTarget').value, 10);
      var max = parseInt(document.getElementById('fmMax').value, 10);
      if (target > max) {
        showRateCardState('warn', t('sc.b.save.invalidTitle'), t('sc.b.save.invalidText'));
        return false;
      }

      var payload = {
        role_category: document.getElementById('fmRole').value.trim(),
        region: document.getElementById('fmRegion').value.trim() || null,
        supplier_org_id: document.getElementById('fmSupplierOrg').value || null,
        target_rate_cents: target,
        max_rate_cents: max,
        min_rate_cents: parseInt(document.getElementById('fmMin').value, 10) || null,
        valid_from: document.getElementById('fmFrom').value,
        valid_to: document.getElementById('fmTo').value || null,
        overtime_surcharge_pct: parseFloat(document.getElementById('fmOT').value) || 25.0,
        notes: document.getElementById('fmNotes').value.trim() || null
      };

      var editId = document.getElementById('editId').value;
      var result;
      if (editId) {
        result = await api('/rate-cards/' + editId, { method: 'PATCH', body: payload });
      } else {
        result = await api('/rate-cards', { method: 'POST', body: payload });
      }
      if (applyRateCardApiErrorState(result)) return false;
      if (result && !result.error) {
        closeModal();
        var refreshResult = await refreshRateCards();
        var savedTitle = editId ? t('sc.b.save.updatedTitle') : t('sc.b.save.createdTitle');
        if (refreshResult && refreshResult.status === 'error') {
          showRateCardState('warn', savedTitle, t('sc.b.save.partialText'));
        } else {
          renderPostMutationState(savedTitle, editId ? t('sc.b.save.updatedText') : t('sc.b.save.createdText'));
        }
      } else {
        // parseApiError liefert bevorzugt die Server-Meldung — die bleibt, wie sie ist.
        showRateCardState('bad', t('sc.b.save.failTitle'), parseApiError(result, t('sc.b.save.failText')));
      }
      return false;
    }

    async function activateCard(id) {
      if (!ensureRateCardWriteAccess('sc.b.write.activate')) return;
      if (!confirm(t('sc.b.confirm.activate'))) return;
      var result = await api('/rate-cards/' + id + '/activate', { method: 'POST', body: {} });
      if (applyRateCardApiErrorState(result)) return;
      if (result && !result.error) {
        var refreshResult = await refreshRateCards();
        if (refreshResult && refreshResult.status === 'error') {
          showRateCardState('warn', t('sc.b.activate.okTitle'), t('sc.b.activate.partialText'));
        } else {
          renderPostMutationState(t('sc.b.activate.okTitle'), t('sc.b.activate.okText'));
        }
      } else {
        showRateCardState('bad', t('sc.b.activate.failTitle'), parseApiError(result, t('sc.b.activate.failText')));
      }
    }

    async function archiveCard(id) {
      if (!ensureRateCardWriteAccess('sc.b.write.archive')) return;
      if (!confirm(t('sc.b.confirm.archive'))) return;
      var result = await api('/rate-cards/' + id + '/archive', { method: 'POST', body: {} });
      if (applyRateCardApiErrorState(result)) return;
      if (result && !result.error) {
        var refreshResult = await refreshRateCards();
        if (refreshResult && refreshResult.status === 'error') {
          showRateCardState('warn', t('sc.b.archive.okTitle'), t('sc.b.archive.partialText'));
        } else {
          renderPostMutationState(t('sc.b.archive.okTitle'), t('sc.b.archive.okText'));
        }
      } else {
        showRateCardState('bad', t('sc.b.archive.failTitle'), parseApiError(result, t('sc.b.archive.failText')));
      }
    }

    init();

    /* Sprachwechsel: Kontext-Badge, KPI-Kacheln, Tabelle, Sperrtafel und
       Zustandsbanner entstehen alle per innerHTML aus JS — die deklarative
       Hydration erreicht sie nicht. Sie werden hier gezielt neu aufgebaut,
       sonst bliebe die halbe Seite in der alten Sprache stehen. */
    document.addEventListener('tc:langchange', function () {
      applyRateCardContextDefaults();
      applyRateCardAccess(rateCardAccess);
      if (!rateCardAccess.canRead) return;
      var sel = document.getElementById('fSupplier');
      var modalSel = document.getElementById('fmSupplierOrg');
      [sel, modalSel].forEach(function (el) {
        if (el && el.options.length && el.options[0].value === '') {
          el.options[0].textContent = t('sc.b.filter.allSuppliers');
        }
      });
      refreshRateCards(selectedSupplierName(), false);
    });
  </script>
