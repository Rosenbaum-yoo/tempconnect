  <title data-i18n="demd.od.docTitle">Angebotsdetail – TempConnect</title>

  <style>
    .od-hero{padding:var(--ds-space-5);border-radius:var(--ds-radius-xl);border:1px solid var(--ds-border);background:rgba(255,255,255,.02);margin-bottom:var(--ds-space-4)}
    .od-hero--emergency{border-color:rgba(255,92,122,.3);background:rgba(255,92,122,.03)}
    .od-hero__top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--ds-space-4);flex-wrap:wrap}
    .od-hero__title{font-size:20px;font-weight:800;margin-bottom:4px}
    .od-hero__meta{font-size:12px;color:var(--ds-text-secondary)}
    .od-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700}
    .od-badge--action{background:rgba(255,204,0,.15);color:#ffd700}
    .od-badge--waiting{background:rgba(74,158,255,.12);color:var(--ds-brand)}
    .od-badge--done{background:rgba(57,217,138,.12);color:var(--ds-success)}
    .od-badge--emergency{background:rgba(255,92,122,.15);color:#ff5c7a}
    .od-badge--status{background:rgba(255,255,255,.06);color:var(--ds-text-secondary)}
    .od-progress{padding:var(--ds-space-5);border-radius:var(--ds-radius-xl);border:1px solid rgba(74,158,255,.2);background:rgba(74,158,255,.02);margin-bottom:var(--ds-space-4)}
    .od-progress--emergency{border-color:rgba(255,92,122,.2);background:rgba(255,92,122,.02)}
    .od-progress__header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--ds-space-3)}
    .od-progress__title{font-size:15px;font-weight:800}
    .od-progress__counter{font-size:13px;color:var(--ds-text-secondary)}
    .od-progress__bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-bottom:var(--ds-space-4);overflow:hidden}
    .od-progress__fill{height:100%;border-radius:3px;background:var(--ds-success);transition:width .3s}
    .od-steps{display:flex;flex-direction:column;gap:var(--ds-space-2)}
    .od-step{display:flex;align-items:flex-start;gap:var(--ds-space-3);padding:var(--ds-space-2) var(--ds-space-3);border-radius:var(--ds-radius-md)}
    .od-step--current{background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.15)}
    .od-step--emergency.od-step--current{background:rgba(255,92,122,.06);border-color:rgba(255,92,122,.15)}
    .od-step__icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
    .od-step__icon--done{background:rgba(57,217,138,.15);color:var(--ds-success)}
    .od-step__icon--current{background:rgba(74,158,255,.15);color:var(--ds-brand)}
    .od-step__icon--future{background:rgba(255,255,255,.06);color:var(--ds-text-tertiary)}
    .od-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--ds-space-4);margin-bottom:var(--ds-space-4)}
    @media(max-width:768px){.od-grid{grid-template-columns:1fr}}
    .od-card{padding:var(--ds-space-4);border-radius:var(--ds-radius-lg);border:1px solid var(--ds-border);background:rgba(255,255,255,.02)}
    .od-card__title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ds-text-secondary);margin-bottom:var(--ds-space-3)}
    .od-field{margin-bottom:var(--ds-space-2)}
    .od-field__label{font-size:11px;color:var(--ds-text-tertiary);text-transform:uppercase;letter-spacing:.04em}
    .od-field__value{font-weight:600;font-size:14px}
    .od-docs{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;margin-top:var(--ds-space-3)}
    .od-doc-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--ds-border);background:rgba(255,255,255,.03);color:var(--ds-text);font-size:12px;font-weight:600;text-decoration:none;transition:all .15s}
    .od-doc-btn:hover{background:rgba(255,255,255,.08);border-color:var(--ds-border-hover)}
    .od-actions{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;margin-top:var(--ds-space-3)}
    .od-list{display:flex;flex-direction:column;gap:var(--ds-space-2)}
    .od-list__item{padding:12px 14px;border-radius:10px;border:1px solid var(--ds-border);background:rgba(255,255,255,.02)}
    .od-list__top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .od-list__title{font-weight:700;font-size:13px}
    .od-list__meta{font-size:11px;color:var(--ds-text-secondary);margin-top:4px}
    .od-tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);font-size:11px;color:var(--ds-text-secondary)}
    .od-upload{margin-top:var(--ds-space-3);padding:12px;border:1px dashed var(--ds-border);border-radius:10px;background:rgba(255,255,255,.02)}
    .od-upload__row{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;align-items:center}
    .od-upload__hint{font-size:11px;color:var(--ds-text-secondary);margin-top:8px}
    .od-timeline{display:flex;flex-direction:column;gap:var(--ds-space-2)}
    .od-timeline__item{padding:12px 14px;border-left:3px solid rgba(74,158,255,.3);background:rgba(74,158,255,.04);border-radius:8px}
    .od-timeline__title{font-weight:700;font-size:13px}
    .od-timeline__meta{font-size:11px;color:var(--ds-text-secondary);margin-top:4px}
    .od-timeline__details{font-size:12px;color:var(--ds-text-secondary);margin-top:6px}
    .od-empty{font-size:13px;color:var(--ds-text-secondary)}
    .od-note{font-size:12px;color:var(--ds-text-secondary);margin-top:8px}
    .od-list__actions{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;margin-top:10px}
    .od-card--full{margin-bottom:var(--ds-space-4)}
    .od-status-line{display:flex;gap:var(--ds-space-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--ds-space-3)}
    .od-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .od-pill--neutral{background:rgba(255,255,255,.06);color:var(--ds-text-secondary)}
    .od-pill--success{background:rgba(57,217,138,.12);color:var(--ds-success)}
    .od-pill--warn{background:rgba(255,204,0,.15);color:#ffd700}
    .od-pill--danger{background:rgba(255,92,122,.15);color:#ff7d97}

    /* EDITORIAL — de-blue + warm boxes (scoped; dark/light/ultra byte-identical) */
    [data-theme="editorial"] .od-hero { background: #ebe4d3; border-color: #d4cab3; }
    [data-theme="editorial"] .od-badge--waiting { background: rgba(31,58,46,.1); }
    [data-theme="editorial"] .od-badge--status { background: #fffdf6; }
    [data-theme="editorial"] .od-progress { border-color: rgba(31,58,46,.2); background: rgba(31,58,46,.04); }
    [data-theme="editorial"] .od-progress__bar { background: rgba(31,58,46,.1); }
    [data-theme="editorial"] .od-step--current { background: rgba(31,58,46,.06); border-color: rgba(31,58,46,.15); }
    [data-theme="editorial"] .od-step__icon--current { background: rgba(31,58,46,.12); }
    [data-theme="editorial"] .od-step__icon--future { background: #fffdf6; }
    [data-theme="editorial"] .od-card { background: #ebe4d3; border-color: #d4cab3; }
    [data-theme="editorial"] .od-doc-btn { background: #fffdf6; }
    [data-theme="editorial"] .od-doc-btn:hover { background: rgba(31,58,46,.05); }
    [data-theme="editorial"] .od-list__item { background: #fffdf6; }
    [data-theme="editorial"] .od-tag { background: rgba(31,58,46,.08); }
    [data-theme="editorial"] .od-upload { background: #fffdf6; }
    [data-theme="editorial"] .od-timeline__item { border-left-color: rgba(31,58,46,.3); background: rgba(31,58,46,.06); }
    [data-theme="editorial"] .od-pill--neutral { background: rgba(31,58,46,.08); }

    function setLoadingText(key, params) {
      var el = document.getElementById('od-loading');
      if (!el) return;
      if (params) { el.removeAttribute('data-i18n'); el.textContent = TCi18n.t(key, params); return; }
      el.setAttribute('data-i18n', key);
      el.textContent = TCi18n.t(key);
    }

    if (!offerId) { setLoadingText('demd.od.noId'); return; }

    function esc(value) {
      var d = document.createElement('div');
      d.textContent = value == null ? '' : String(value);
      return d.innerHTML;
    }
    function fmtDate(value) {
      if (!value) return '\u2014';
      try { return new Date(value).toLocaleDateString(TCi18n.dateLocale()); } catch (e) { return '\u2014'; }
    }
    function fmtDateTime(value) {
      if (!value) return '\u2014';
      try { return new Date(value).toLocaleString(TCi18n.dateLocale()); } catch (e) { return '\u2014'; }
    }
    function fmtMoney(value, suffix) {
      if (value == null || value === '') return '\u2014';
      var num = Number(value);
      if (!isFinite(num)) return String(value);
      return num.toLocaleString(TCi18n.dateLocale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (suffix ? ' ' + suffix : '');
    }
    function fmtInt(value, suffix) {
      if (value == null || value === '') return '\u2014';
      return esc(String(value)) + (suffix ? ' ' + esc(suffix) : '');
    }
    function field(label, value) {
      return '<div class="od-field"><div class="od-field__label">' + esc(label) + '</div><div class="od-field__value">' + (value == null || value === '' ? '\u2014' : String(value)) + '</div></div>';
    }
    function toCount(value, fallback) {
      var num = Number(value);
      return isFinite(num) ? Math.max(0, Math.trunc(num)) : fallback;
    }
    /* Status-Rohwerte bleiben Server-Enums; nur der sichtbare Text kommt aus dem
       Woerterbuch. Unbekannter Rohwert -> t() liefert '' -> Rohwert bleibt sichtbar. */
    function capacityStatusLabel(status) {
      return (status ? TCi18n.t('demd.od.capStatus.' + status) : '') || status || '\u2014';
    }
    function capacityHeadcountSummary(offer) {
      if (!offer || !offer.capacity_post_id) return '\u2014';
      var total = Math.max(1, toCount(offer.capacity_headcount, 1));
      var remaining = offer.capacity_remaining_headcount != null ? Math.max(0, toCount(offer.capacity_remaining_headcount, 0)) : total;
      var committed = offer.capacity_committed_headcount != null ? Math.max(0, toCount(offer.capacity_committed_headcount, 0)) : 0;
      if (offer.capacity_commercial_status || committed > 0 || remaining !== total) {
        return remaining + ' ' + TCi18n.t('demd.od.cap.free') + ' / ' + total + ' ' + TCi18n.t('demd.od.cap.total') +
          (committed > 0 ? ' \u00b7 ' + committed + ' ' + TCi18n.t('demd.od.cap.committed') : '');
      }
      return total + ' ' + TCi18n.t('demd.od.cap.total');
    }
    function agreementStatusLabel(status) {
      return TCi18n.t('demd.od.agrStatus.' + (status || 'none')) || (status || '\u2014');
    }
    function signatureStatusLabel(required, status) {
      if (!required || status === 'not_required' || !status) return TCi18n.t('demd.od.sig.notRequired');
      return TCi18n.t('demd.od.sigStatus.' + status) || status;
    }
    function actionStateMeta(actionState) {
      var ACTION_CLS = {
        action_required: 'od-badge--action',
        waiting: 'od-badge--waiting',
        completed: 'od-badge--done',
        cancelled: 'od-badge--status',
        expired: 'od-badge--status',
        closed: 'od-badge--status'
      };
      if (!actionState || !ACTION_CLS[actionState]) return null;
      return { text: TCi18n.t('demd.od.action.' + actionState), cls: ACTION_CLS[actionState] };
    }
    function docTypeLabel(type) {
      return (type ? TCi18n.t('demd.od.docType.' + type) : '') || type || TCi18n.t('demd.od.docType.fallback');
    }
    function pillClass(status) {
      if (status === 'current' || status === 'activated' || status === 'confirmed') return 'od-pill--success';
      if (status === 'superseded' || status === 'pending_confirmation' || status === 'pending') return 'od-pill--warn';
      if (status === 'cancelled' || status === 'expired' || status === 'failed' || status === 'archived') return 'od-pill--danger';
      return 'od-pill--neutral';
    }
    function assetUrl(path) {
      if (!path) return null;
      if (/^https?:\/\//i.test(path)) return path;
      return '/' + String(path).replace(/^\/+/, '');
    }
    function documentUrl(doc) {
      if (!doc) return null;
      if (doc.document_type === 'conditions_sheet') return API + '/marketplace/offers/' + offerId + '/document?type=conditions';
      if (doc.document_type === 'agreement') return API + '/marketplace/offers/' + offerId + '/document?type=agreement';
      if (doc.asset_file_path) return assetUrl(doc.asset_file_path);
      return null;
    }
    // Audit-Aktionen sind Server-Enums; nur der Titel ist uebersetzt. Eine
    // unbekannte Aktion bleibt roh sichtbar statt zu verschwinden.
    function timelineTitle(action) {
      return (action ? TCi18n.t('demd.od.tl.' + action) : '') || action;
    }
    function timelineDetail(details) {
      if (!details) return '';
      if (details.from || details.to) {
        return [details.from || '\u2014', details.to || '\u2014'].join(' \u2192 ');
      }
      if (details.signature_provider || details.signature_reference) {
        return [details.signature_provider, details.signature_reference].filter(Boolean).join(' \u00b7 ');
      }
      if (details.asset_type || details.mime_type) {
        return [details.asset_type, details.mime_type].filter(Boolean).join(' \u00b7 ');
      }
      if (details.reason) return details.reason;
      if (details.agreement_ref) return details.agreement_ref;
      return '';
    }
    function renderDocumentList(items, emptyText, allowGeneratedFallback) {
      if (!items || !items.length) return '<div class="od-empty">' + esc(emptyText) + '</div>';
      var html = '<div class="od-list">';
      items.forEach(function(item) {
        var title = item.title || item.asset_original_name || item.original_name || docTypeLabel(item.document_type);
        var url = documentUrl(item);
        if (!url && allowGeneratedFallback && item.document_type === 'conditions_sheet') url = API + '/marketplace/offers/' + offerId + '/document?type=conditions';
        if (!url && allowGeneratedFallback && item.document_type === 'agreement') url = API + '/marketplace/offers/' + offerId + '/document?type=agreement';
        var meta = [];
        if (item.document_type) meta.push(docTypeLabel(item.document_type));
        if (item.version != null) meta.push(TCi18n.t('demd.od.doc.version') + ' ' + item.version);
        if (item.generated_at) meta.push(fmtDateTime(item.generated_at));
        if (item.created_at && !item.generated_at) meta.push(fmtDateTime(item.created_at));
        html += '<div class="od-list__item">';
        html += '<div class="od-list__top"><div><div class="od-list__title">' + esc(title) + '</div><div class="od-list__meta">' + esc(meta.join(' \u00b7 ')) + '</div></div>';
        html += '<span class="od-pill ' + pillClass(item.status) + '">' + esc(item.status || 'current') + '</span></div>';
        if (item.content_hash) {
          html += '<div class="od-note">' + esc(TCi18n.t('demd.od.doc.hash')) + ' <code>' + esc(String(item.content_hash).slice(0, 16)) + '</code></div>';
        }
        if (url) {
          html += '<div class="od-list__actions"><a href="' + esc(url) + '" target="_blank" class="od-doc-btn">' + esc(TCi18n.t('demd.od.open')) + '</a></div>';
        }
        html += '</div>';
      });
      html += '</div>';
      return html;
    }
    function renderAssetList(items, emptyText) {
      if (!items || !items.length) return '<div class="od-empty">' + esc(emptyText) + '</div>';
      var html = '<div class="od-list">';
      items.forEach(function(item) {
        var url = assetUrl(item.file_path);
        var meta = [];
        if (item.mime_type) meta.push(item.mime_type);
        if (item.created_at) meta.push(fmtDateTime(item.created_at));
        html += '<div class="od-list__item">';
        html += '<div class="od-list__top"><div><div class="od-list__title">' + esc(item.original_name || TCi18n.t('demd.od.attachment')) + '</div><div class="od-list__meta">' + esc(meta.join(' \u00b7 ')) + '</div></div>';
        html += '<span class="od-pill od-pill--neutral">' + esc(TCi18n.t('demd.od.attachment')) + '</span></div>';
        if (url) {
          html += '<div class="od-list__actions"><a href="' + esc(url) + '" target="_blank" class="od-doc-btn">' + esc(TCi18n.t('demd.od.open')) + '</a></div>';
        }
        html += '</div>';
      });
      html += '</div>';
      return html;
    }

    async function getCsrf() {
      var r = await fetch(API + '/csrf', { credentials: 'include' });
      var d = await r.json();
      return d.token || '';
    }
    async function apiPost(path, body, isFormData) {
      var csrf = await getCsrf();
      var headers = { 'X-CSRF-Token': csrf };
      if (!isFormData) headers['Content-Type'] = 'application/json';
      return fetch(API + path, {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: isFormData ? body : JSON.stringify(body || {})
      });
    }

    try {
      var detailResponse = await fetch(API + '/marketplace/offers/' + offerId + '/detail', { credentials: 'include' });
      if (!detailResponse.ok) {
        setLoadingText(detailResponse.status === 403 ? 'demd.od.forbidden' : 'demd.od.notFound');
        return;
      }
      var dossierResponse = await fetch(API + '/marketplace/offers/' + offerId + '/dossier', { credentials: 'include' });
      var o = await detailResponse.json();
      var dossier = dossierResponse.ok ? await dossierResponse.json() : null;

      lastOffer = o;
      lastDossier = dossier;
      document.getElementById('od-loading').style.display = 'none';
      document.getElementById('od-content').style.display = 'block';
      renderAll(o, dossier);

      /* Sprachwechsel: diese Ansicht wird vollstaendig per JS gebaut, i18n.js
         kann daran nichts nachziehen. Deshalb zeichnen wir sie aus dem bereits
         geladenen Stand neu - ohne die Endpunkte erneut zu belasten. */
      document.addEventListener('tc:langchange', function () {
        if (lastOffer) renderAll(lastOffer, lastDossier);
      });
    } catch (e) {
      var errEl = document.getElementById('od-loading');
      if (errEl) {
        errEl.removeAttribute('data-i18n');
        errEl.textContent = TCi18n.t('demd.od.err.prefix') + e.message;
      }
    }

    /* Baut die komplette Dealakte aus dem geladenen Stand. Als eigene Funktion,
       damit ein Sprachwechsel exakt dieselbe Ansicht neu zeichnen kann. */
    function renderAll(o, dossier) {
      var root = document.getElementById('od-content');
      if (!root) return;

      var isEmergency = o.urgency === 'notdienst' || o.urgency === 'critical' || o.urgency === 'urgent';
      var agSt = o.agreement_status || 'none';
      var actionMeta = actionStateMeta(o.action_required);
      var signature = dossier && dossier.signature ? dossier.signature : {
        required: o.signature_required,
        status: o.signature_status,
        provider: o.signature_provider,
        reference: o.signature_reference
      };
      var generatedDocs = dossier && dossier.documents ? dossier.documents.generated || [] : [];
      var uploadedDocs = dossier && dossier.documents ? dossier.documents.uploaded || [] : [];
      var attachments = dossier && dossier.documents ? dossier.documents.attachments || [] : [];
      var timeline = dossier && dossier.timeline ? dossier.timeline : [];
      var terminal = agSt === 'cancelled' || agSt === 'expired' || o.action_required === 'closed';

      var steps = isEmergency ? [
        { key: 'committed', label: TCi18n.t('demd.od.step.committed'), done: true },
        { key: 'agreement', label: TCi18n.t('demd.od.step.emgAgreement'), done: agSt !== 'none', action: agSt === 'none' && o.status === 'accepted' && o.action_required === 'action_required' ? 'create-agreement' : null, actionLabel: TCi18n.t('demd.od.step.emgAgreementCta') },
        { key: 'confirmed', label: TCi18n.t('demd.od.step.confirmed'), done: ['confirmed', 'activated'].indexOf(agSt) !== -1, action: agSt === 'pending_confirmation' && o.action_required === 'action_required' ? 'confirm-agreement' : null, actionLabel: TCi18n.t('demd.od.step.emgConfirmCta') },
        { key: 'activated', label: TCi18n.t('demd.od.step.emgActivated'), done: agSt === 'activated', action: agSt === 'confirmed' && o.action_required === 'action_required' ? 'activate' : null, actionLabel: TCi18n.t('demd.od.act.activate') }
      ] : [
        { key: 'created', label: TCi18n.t('demd.od.step.created'), done: true },
        { key: 'sent', label: TCi18n.t('demd.od.step.sent'), done: o.status !== 'draft' },
        { key: 'accepted', label: TCi18n.t('demd.od.step.accepted'), done: o.status === 'accepted' },
        { key: 'agreement', label: TCi18n.t('demd.od.step.agreement'), done: agSt !== 'none', action: agSt === 'none' && o.status === 'accepted' && o.action_required === 'action_required' ? 'create-agreement' : null, actionLabel: TCi18n.t('demd.od.act.createAgreement') },
        { key: 'confirmed', label: TCi18n.t('demd.od.step.confirmed'), done: ['confirmed', 'activated'].indexOf(agSt) !== -1, action: agSt === 'pending_confirmation' && o.action_required === 'action_required' ? 'confirm-agreement' : null, actionLabel: TCi18n.t('demd.od.act.confirm') },
        { key: 'activated', label: TCi18n.t('demd.od.step.activated'), done: agSt === 'activated', action: agSt === 'confirmed' && o.action_required === 'action_required' ? 'activate' : null, actionLabel: TCi18n.t('demd.od.act.activate') }
      ];
      var doneCount = steps.filter(function(s) { return s.done; }).length;
      var totalSteps = steps.length;
      var progressPct = Math.round((doneCount / totalSteps) * 100);

      var canCreateAgreement = agSt === 'none' && o.status === 'accepted' && o.action_required === 'action_required';
      var canConfirm = agSt === 'pending_confirmation' && o.action_required === 'action_required';
      var canActivate = agSt === 'confirmed' && o.action_required === 'action_required';
      var canPrepareSignature = agSt === 'confirmed' && o.action_required === 'action_required' && ['pending', 'fully_signed'].indexOf(signature.status || '') === -1;
      var canCancel = agSt === 'pending_confirmation' || agSt === 'confirmed';

      var h = '';

      h += '<div class="od-hero' + (isEmergency ? ' od-hero--emergency' : '') + '">';
      h += '<div class="od-hero__top"><div>';
      h += '<div class="od-hero__title">' + esc(o.capacity_title || o.demand_title || o.demand_role || TCi18n.t('demd.od.offerFallback')) + '</div>';
      h += '<div class="od-hero__meta">' + esc((o.capacity_location || o.demand_location || '')) + ' \u00b7 ' + esc(o.supplier_company_name || '') + ' \u2192 ' + esc(o.requester_company_name || '') + '</div>';
      h += '</div><div style="text-align:right;display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
      if (isEmergency) h += '<span class="od-badge od-badge--emergency">\u26a0 ' + esc(TCi18n.t('demd.od.emergency')) + '</span>';
      if (actionMeta) h += '<span class="od-badge ' + actionMeta.cls + '">' + esc(actionMeta.text) + '</span>';
      h += '<span class="od-badge od-badge--status">' + esc(o.status) + '</span>';
      if (o.capacity_post_id) h += '<span class="od-badge od-badge--status">' + esc(capacityStatusLabel(o.capacity_commercial_status || o.capacity_status)) + '</span>';
      if (o.agreement_ref) h += '<span class="od-badge od-badge--status">' + esc(o.agreement_ref) + '</span>';
      h += '</div></div></div>';

      h += '<div class="od-progress' + (isEmergency ? ' od-progress--emergency' : '') + '">';
      h += '<div class="od-progress__header">';
      h += '<div class="od-progress__title">' + (isEmergency ? '\u26a1 ' + esc(TCi18n.t('demd.od.progress.emergency')) : '\ud83d\udccb ' + esc(TCi18n.t('demd.od.progress.title'))) + '</div>';
      h += '<div class="od-progress__counter">' + esc(TCi18n.t('demd.od.progress.counter', { done: doneCount, total: totalSteps })) + '</div>';
      h += '</div>';
      h += '<div class="od-progress__bar"><div class="od-progress__fill" style="width:' + progressPct + '%"></div></div>';
      if (agSt === 'cancelled') h += '<div class="od-note">' + esc(TCi18n.t('demd.od.progress.cancelled')) + '</div>';
      if (agSt === 'expired') h += '<div class="od-note">' + esc(TCi18n.t('demd.od.progress.expired')) + '</div>';
      h += '<div class="od-steps">';
      var foundCurrent = false;
      steps.forEach(function(s) {
        var isCurrent = !terminal && !s.done && !foundCurrent;
        if (isCurrent) foundCurrent = true;
        var iconCls = s.done ? 'od-step__icon--done' : isCurrent ? 'od-step__icon--current' : 'od-step__icon--future';
        var iconText = s.done ? '\u2713' : isCurrent ? '\u25b6' : '\u25cb';
        var stepCls = 'od-step' + (isCurrent ? ' od-step--current' + (isEmergency ? ' od-step--emergency' : '') : '');
        h += '<div class="' + stepCls + '">';
        h += '<div class="od-step__icon ' + iconCls + '">' + iconText + '</div>';
        h += '<div><div class="od-step__label">' + esc(s.label) + '</div>';
        if (isCurrent && s.action) {
          h += '<div style="font-size:11px;color:var(--ds-text-secondary);margin-top:2px">' + esc(TCi18n.t('demd.od.step.needsAction')) + '</div>';
          h += '<div style="margin-top:8px"><button class="ds-btn ds-btn--primary" onclick="doAction(\'' + s.action + '\', this)">' + esc(s.actionLabel) + '</button></div>';
        } else if (isCurrent) {
          h += '<div style="font-size:11px;color:var(--ds-text-secondary);margin-top:2px">' + esc(TCi18n.t('demd.od.step.waiting')) + '</div>';
        } else if (s.done && s.key === 'activated' && o.assignment_id) {
          h += '<div style="font-size:11px;color:var(--ds-success);margin-top:2px">' + esc(TCi18n.t('demd.od.step.assignment')) + ' ' + esc(o.assignment_id) + '</div>';
        }
        h += '</div></div>';
      });
      h += '</div></div>';

      h += '<div id="od-assign-cta"></div>';
      h += '<div id="od-pool-cta"></div>';

      h += '<div class="od-grid">';
      h += '<div class="od-card"><div class="od-card__title">' + esc(TCi18n.t('demd.od.card.posting')) + '</div>';
      h += field(TCi18n.t('demd.od.field.role'), esc(o.demand_role || '\u2014'));
      h += field(TCi18n.t('demd.od.field.location'), esc(o.demand_location || '\u2014'));
      h += field(TCi18n.t('demd.od.field.period'), esc(fmtDate(o.demand_start) + ' \u2014 ' + fmtDate(o.demand_end)));
      h += field(TCi18n.t('demd.od.field.quantity'), esc(o.demand_headcount || '\u2014'));
      h += field(TCi18n.t('demd.od.field.company'), esc(o.requester_company_name || '\u2014'));
      h += '</div>';
      h += '<div class="od-card"><div class="od-card__title">' + esc(TCi18n.t('demd.od.card.terms')) + '</div>';
      h += field(TCi18n.t('demd.od.field.offeredQuantity'), esc(o.offered_quantity || '\u2014'));
      h += field(TCi18n.t('demd.od.field.hourlyRate'), esc(fmtMoney(o.offered_hourly_rate, 'EUR/h')));
      h += field(TCi18n.t('demd.od.field.start'), esc(fmtDate(o.start_confirmed)));
      h += field(TCi18n.t('demd.od.field.end'), esc(fmtDate(o.end_date)));
      h += field(TCi18n.t('demd.od.field.billing'), esc(o.billing_unit || '\u2014'));
      h += field(TCi18n.t('demd.od.field.responseTime'), fmtInt(o.response_time_minutes, TCi18n.t('demd.od.unit.min')));
      h += field(TCi18n.t('demd.od.field.replacement'), fmtInt(o.replacement_sla_minutes, TCi18n.t('demd.od.unit.min')));
      h += '</div>';
      if (o.capacity_post_id) {
        h += '<div class="od-card"><div class="od-card__title">' + esc(TCi18n.t('demd.od.card.capacity')) + '</div>';
        h += field(TCi18n.t('demd.od.field.staff'), esc(o.capacity_title || '\u2014'));
        h += field(TCi18n.t('demd.od.field.role'), esc(o.capacity_role || '\u2014'));
        h += field(TCi18n.t('demd.od.field.site'), esc(o.capacity_location || '\u2014'));
        h += field(TCi18n.t('demd.od.field.status'), esc(capacityStatusLabel(o.capacity_commercial_status || o.capacity_status)));
        h += field(TCi18n.t('demd.od.field.available'), esc(capacityHeadcountSummary(o)));
        h += '</div>';
      }
      h += '</div>';

      h += '<div class="od-card od-card--full">';
      h += '<div class="od-card__title">' + esc(TCi18n.t('demd.od.card.agreement')) + '</div>';
      h += '<div class="od-status-line">';
      h += '<span class="od-pill ' + pillClass(agSt) + '">' + esc(agreementStatusLabel(agSt)) + '</span>';
      h += '<span class="od-pill ' + pillClass(signature.status) + '">' + esc(signatureStatusLabel(signature.required, signature.status)) + '</span>';
      if (o.capacity_post_id) h += '<span class="od-pill od-pill--neutral">' + esc(capacityHeadcountSummary(o)) + '</span>';
      if (dossier && dossier.document_count != null) h += '<span class="od-pill od-pill--neutral">' + esc(String(dossier.document_count)) + ' ' + esc(TCi18n.t('demd.od.documents')) + '</span>';
      h += '</div>';
      if (agSt === 'none') {
        h += '<div class="od-empty">' + esc(TCi18n.t('demd.od.agr.none')) + '</div>';
      } else {
        h += '<div class="od-grid" style="margin:0 0 var(--ds-space-3)">';
        h += '<div>';
        h += field(TCi18n.t('demd.od.field.reference'), esc(o.agreement_ref || '\u2014'));
        h += field(TCi18n.t('demd.od.field.status'), esc(agreementStatusLabel(agSt)));
        h += field(TCi18n.t('demd.od.field.version'), esc(o.agreement_version || '\u2014'));
        h += '</div><div>';
        h += field(TCi18n.t('demd.od.field.confirmed'), esc(o.confirmed_at ? fmtDateTime(o.confirmed_at) : TCi18n.t('demd.od.pending')));
        h += field(TCi18n.t('demd.od.field.activated'), esc(o.activated_at ? fmtDateTime(o.activated_at) : TCi18n.t('demd.od.pending')));
        if (o.assignment_id) h += field(TCi18n.t('demd.od.field.assignment'), esc(o.assignment_id));
        h += '</div></div>';
      }
      h += '<div class="od-docs">';
      h += '<a href="' + API + '/marketplace/offers/' + offerId + '/document?type=conditions" target="_blank" class="od-doc-btn">' + esc(TCi18n.t('demd.od.doc.openConditions')) + '</a>';
      if (agSt !== 'none') h += '<a href="' + API + '/marketplace/offers/' + offerId + '/document?type=agreement" target="_blank" class="od-doc-btn">' + esc(TCi18n.t('demd.od.doc.openAgreement')) + '</a>';
      h += '</div>';
      if (canCreateAgreement || canConfirm || canActivate || canPrepareSignature || canCancel) {
        h += '<div class="od-actions">';
        if (canCreateAgreement) h += '<button class="ds-btn ds-btn--primary" onclick="doAction(\'create-agreement\', this)">' + esc(TCi18n.t('demd.od.act.createAgreement')) + '</button>';

      h += field(TCi18n.t('demd.od.field.status'), esc(signatureStatusLabel(signature.required, signature.status)));
      h += field(TCi18n.t('demd.od.field.provider'), esc(signature.provider || '\u2014'));
      h += field(TCi18n.t('demd.od.field.reference'), esc(signature.reference || o.signature_reference || '\u2014'));

      h += '<div class="od-card"><div class="od-card__title">' + esc(TCi18n.t('demd.od.card.attachments')) + '</div>';
      h += renderAssetList(attachments, TCi18n.t('demd.od.empty.attachments'));
      h += '</div>';
      h += '</div>';

      // Welle 7 - Phase 6+7+8: Einsatzbesetzung-Block in der Dealakte.
      h += '<div class="od-card od-card--full" id="od-staffing-block" data-staffing-state="loading">';
      h += '<div class="od-card__title">' + esc(TCi18n.t('demd.od.card.staffing')) + '</div>';
      h += '<div class="od-empty" id="od-staffing-body">' + esc(TCi18n.t('demd.od.staffing.loading')) + '</div>';
      h += '</div>';

      h += '<div class="od-card od-card--full">';
      h += '<div class="od-card__title">' + esc(TCi18n.t('demd.od.card.timeline')) + '</div>';

        h += '<div class="od-empty">' + esc(TCi18n.t('demd.od.empty.timeline')) + '</div>';

        h += '<div class="od-timeline">';
        timeline.forEach(function(item) {

        });
        h += '</div>';
      }
      h += '</div>';

      /* Inhalt melden (Plan I, Abschnitt 10). Bewusst unten, klein und ohne
         Warnfarbe: eine Meldefunktion, die wie ein Hauptknopf aussieht, wird
         aus Versehen gedrueckt — und jede Fehlmeldung kostet das
         TempConnect-Team dieselbe Bearbeitung wie eine echte. */
      h += '<div class="od-card" id="od-melden-card" style="margin-top:16px;display:none">';
      h += '<div class="od-card__title">' + esc(TCi18n.t('demd.od.melden.title')) + '</div>';
      h += '<div style="font-size:12px;color:var(--ds-text-secondary);line-height:1.6;margin-bottom:10px">' + esc(TCi18n.t('demd.od.melden.hint')) + '</div>';
      h += '<div id="od-melden-form" style="display:none;margin-bottom:10px">';
      h += '<select id="od-melden-grund" class="ds-input" style="width:100%;max-width:340px;margin-bottom:8px"></select>';
      h += '<textarea id="od-melden-text" class="ds-input" style="width:100%;min-height:80px;margin-bottom:8px" maxlength="500" placeholder="' + esc(TCi18n.t('demd.od.melden.detailsPlaceholder')) + '"></textarea>';
      h += '<div><button type="button" class="ds-btn ds-btn--primary" id="od-melden-senden">' + esc(TCi18n.t('demd.od.melden.send')) + '</button></div>';
      h += '</div>';
      h += '<div id="od-melden-msg" style="display:none;font-size:12px;line-height:1.6;margin-bottom:8px"></div>';
      h += '<button type="button" class="ds-btn" id="od-melden-oeffnen">' + esc(TCi18n.t('demd.od.melden.open')) + '</button>';
      /* PERSON MELDEN (Migration 194). Zwei verschiedene Dinge, deshalb zwei
         Knoepfe: der erste meldet den INHALT des Angebots, der zweite das
         VERHALTEN der Gegenperson. Genau dafuer gibt es seit 194 die Gruende
         `fraud` und `harassment` — Betrug ist kein Inhalt, Belaestigung auch
         nicht. Die Dealakte ist die einzige Flaeche des Produkts, auf der ein
         Nutzer einem anderen NUTZER begegnet: supplier_company_id und
         requester_company_id sind Nutzerkennungen. */
      h += ' <button type="button" class="ds-btn" id="od-person-oeffnen">' + esc(TCi18n.t('demd.od.person.open')) + '</button>';
      h += '<div id="od-person-form" style="display:none;margin-top:10px">';
      h += '<select id="od-person-grund" class="ds-input" style="width:100%;max-width:340px;margin-bottom:8px"></select>';
      h += '<textarea id="od-person-text" class="ds-input" style="width:100%;min-height:80px;margin-bottom:8px" maxlength="500" placeholder="' + esc(TCi18n.t('demd.od.person.detailsPlaceholder')) + '"></textarea>';
      h += '<div><button type="button" class="ds-btn ds-btn--primary" id="od-person-senden">' + esc(TCi18n.t('demd.od.melden.send')) + '</button></div>';
      h += '<div id="od-person-msg" style="display:none;font-size:12px;line-height:1.6;margin-top:8px"></div>';
      h += '</div>';
      h += '</div>';

      root.innerHTML = h;
      verdrahteMelden(o);
      verdrahtePersonMelden(o);
      renderStaffingBlock(o).catch(function () { /* non-critical */ });
    }

    /* Gruende und Werte kommen aus dem Zod-Schema von POST /offers/:id/report.
       Wer hier einen Wert erfindet, bekommt 400 — die verbindliche Liste steht
       am Server. */
    var MELDE_GRUENDE = ['spam', 'fake_profile', 'misleading_info', 'inappropriate_content', 'other'];

    function meldeMeldung(text, gut) {
      var el = document.getElementById('od-melden-msg');
      if (!el) return;
      el.textContent = text;
      el.style.color = gut ? 'var(--ds-success-text,#1a7f37)' : 'var(--ds-danger-text,#b42318)';
      el.style.display = 'block';
    }

    /* Gruende der PERSONEN-Meldung. Zwei mehr als beim Inhalt, und die zwei
       sind der ganze Punkt: `fraud` ist nicht `fake_profile` (eine Firma kann
       echt sein und trotzdem betruegen), `harassment` ist ein Verhalten, kein
       Inhalt. In `other` geschmolzen waeren sie unsichtbar. */
    var PERSON_GRUENDE = ['fraud', 'harassment', 'spam', 'misleading_info', 'inappropriate_content', 'other'];

    function verdrahtePersonMelden(o) {
      var oeffnen = document.getElementById('od-person-oeffnen');
      var senden  = document.getElementById('od-person-senden');
      var form    = document.getElementById('od-person-form');
      if (!oeffnen || !senden || !form) return;

      /* Die Gegenperson: wer ICH bin, entscheidet, wen ich melde. Der Server
         prueft es ohnehin (gemeinsamer Deal, kein Selbst-Report) — das hier
         ist Anzeige, damit im Text der richtige Name steht. */
      var gegenperson = null;
      fetch('/api/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (m) {
          var ich = m && (m.user ? m.user.id : m.id);
          if (!ich) return;
          gegenperson = String(ich) === String(o.supplier_company_id)
            ? o.requester_company_id
            : o.supplier_company_id;
          if (!gegenperson) return;
          oeffnen.style.display = '';
        })
        .catch(function () { /* im Zweifel nicht anbieten */ });
      oeffnen.style.display = 'none';

      var grund = document.getElementById('od-person-grund');
      PERSON_GRUENDE.forEach(function (g) {
        var opt = document.createElement('option');
        opt.value = g;
        opt.textContent = TCi18n.t('demd.od.person.grund.' + g);
        grund.appendChild(opt);
      });

      oeffnen.addEventListener('click', function () {
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      senden.addEventListener('click', function () {
        var msg = document.getElementById('od-person-msg');
        function zeige(text, gut) {
          msg.textContent = text;
          msg.style.color = gut ? 'var(--ds-success-text,#1a7f37)' : 'var(--ds-danger-text,#b42318)';
          msg.style.display = 'block';
        }
        if (!gegenperson) { zeige(TCi18n.t('demd.od.melden.err'), false); return; }
        senden.disabled = true;
        var vorher = senden.textContent;
        senden.textContent = TCi18n.t('demd.od.melden.sending');
        fetch('/api/csrf', { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (csrf) {
            return fetch('/api/users/' + encodeURIComponent(gegenperson) + '/report', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf.token || '' },
              body: JSON.stringify({
                reason: grund.value || 'other',
                details: document.getElementById('od-person-text').value.trim() || null
              })
            });
          })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (a) {
            if (a.ok) {
              zeige(TCi18n.t('demd.od.person.ok'), true);
              form.style.display = 'none';
              oeffnen.style.display = 'none';
              return;
            }
            zeige((a.body && a.body.error && a.body.error.message) || TCi18n.t('demd.od.melden.err'), false);
          })
          .catch(function () { zeige(TCi18n.t('demd.od.melden.err'), false); })
          .then(function () { senden.disabled = false; senden.textContent = vorher; });
      });
    }

    function verdrahteMelden(o) {
      var oeffnen = document.getElementById('od-melden-oeffnen');
      var senden = document.getElementById('od-melden-senden');
      var karte = document.getElementById('od-melden-card');
      if (!oeffnen || !senden || !karte) return;

      /* Der Anbieter kann sein eigenes Angebot nicht melden — die Route weist
         es mit SELF_REPORT_NOT_ALLOWED ab. Ein Knopf, der nur eine
         Fehlermeldung erzeugt, ist ein toter Knopf, und tote Knoepfe sind in
         diesem Projekt ausdruecklich verboten. Deshalb erscheint die Karte
         ERST, wenn feststeht, dass der Betrachter nicht der Anbieter ist.
         Die Entscheidung faellt weiterhin am Server; das hier ist Anzeige. */
      fetch('/api/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (m) {
          var ich = m && (m.user ? m.user.id : m.id);
          if (ich && String(ich) === String(o.supplier_company_id)) return;
          karte.style.display = '';
        })
        .catch(function () { /* im Zweifel nicht anzeigen — der Server bliebe ohnehin die Instanz */ });

      oeffnen.addEventListener('click', function () {
        var form = document.getElementById('od-melden-form');
        var auswahl = document.getElementById('od-melden-grund');
        if (!auswahl.options.length) {
          MELDE_GRUENDE.forEach(function (g) {
            var opt = document.createElement('option');
            opt.value = g;
            opt.textContent = TCi18n.t('demd.od.melden.grund.' + g);
            auswahl.appendChild(opt);
          });
        }
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
      });

      senden.addEventListener('click', function () {
        senden.disabled = true;
        var vorher = senden.textContent;
        senden.textContent = TCi18n.t('demd.od.melden.sending');
        fetch('/api/csrf', { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (csrf) {
            return fetch('/api/offers/' + encodeURIComponent(o.id) + '/report', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf.token || '' },
              body: JSON.stringify({
                reason: document.getElementById('od-melden-grund').value || 'other',
                details: document.getElementById('od-melden-text').value.trim() || null
              })
            });
          })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (a) {
            if (a.ok) {
              meldeMeldung(TCi18n.t('demd.od.melden.ok'), true);
              document.getElementById('od-melden-form').style.display = 'none';
              return;
            }
            /* Die Antwort der Route woertlich zeigen: bei SELF_REPORT und
               OFFER_WITHOUT_ORG sagt sie etwas Konkretes, das dem Nutzer hilft. */
            meldeMeldung((a.body && (a.body.message || (a.body.error && a.body.error.message))) || TCi18n.t('demd.od.melden.err'), false);
          })
          .catch(function () { meldeMeldung(TCi18n.t('demd.od.melden.err'), false); })
          .then(function () { senden.disabled = false; senden.textContent = vorher; });
      });
    }

    // Welle 7 - Phase 6+7+8: Staffing-Kontext + One-click-/Bulk-Zuweisung.
    async function renderStaffingBlock(offerRow) {
      var block = document.getElementById('od-staffing-block');
      var body = document.getElementById('od-staffing-body');
      if (!block || !body) return;
      if (!offerRow || offerRow.agreement_status === 'none' || offerRow.agreement_status === 'cancelled' || offerRow.agreement_status === 'expired') {
        block.style.display = 'none';
        return;
      }
      try {
        var r = await fetch(API + '/marketplace/offers/' + offerId + '/staffing-context', { credentials: 'include' });
        if (!r.ok) {
          body.textContent = r.status === 403
            ? TCi18n.t('demd.od.staffing.forbidden')
            : TCi18n.t('demd.od.staffing.failed');
          return;
        }
        var ctx = await r.json();
        if (!ctx || !ctx.assignment) {
          body.textContent = TCi18n.t('demd.od.staffing.pending');
          return;
        }
        var asg = ctx.assignment;
        var requested = Number(asg.requested_quantity || 0);
        var filled = Number(asg.filled_quantity || 0);
        var reserved = Number(asg.reserved_quantity || 0);
        var open = Number(asg.open_quantity != null ? asg.open_quantity : Math.max(requested - filled - reserved, 0));
        var isSupplier = !!ctx.is_supplier;
        var safeCandidates = Array.isArray(ctx.safe_candidates) ? ctx.safe_candidates : [];

        // Prominente Supplier-CTA direkt unter dem Deal-Fortschritt: sobald der Einsatz
        // aktiv ist und Plaetze offen sind, fuehrt EIN Button zum 1-Klick-Zuweisungspanel
        // (kein Suchen). Nur fuer den Lieferanten, nur bei offenem Bedarf.
        var assignCta = document.getElementById('od-assign-cta');
        if (assignCta) {
          assignCta.innerHTML = (isSupplier && open > 0)
            ? '<div class="od-card od-card--full" style="border-color:var(--ds-brand);display:flex;flex-wrap:wrap;gap:var(--ds-space-3);align-items:center;justify-content:space-between">'
              + '<div><div class="od-card__title" style="margin:0">' + esc(TCi18n.t('demd.od.cta.assignTitle', { count: String(open) })) + '</div>'
              + '<div style="font-size:12px;color:var(--ds-text-secondary);margin-top:2px">' + esc(TCi18n.t('demd.od.cta.assignText')) + '</div></div>'
              + '<button type="button" class="ds-btn ds-btn--primary" onclick="var b=document.getElementById(\'od-staffing-block\');if(b)b.scrollIntoView({behavior:\'smooth\',block:\'start\'});">' + esc(TCi18n.t('demd.od.cta.assignBtn')) + ' \u2192</button>'
              + '</div>'
            : '';
        }

        // Kaeufer-CTA: nach erfolgreich abgeschlossenem Deal den Lieferanten 1-Klick in den
        // eigenen Lieferantenpool aufnehmen (Endpoint /vendor-pool/from-deal). Nur fuer den
        // Auftraggeber (is_supplier=false) und nur bei "completed" (aktiviert + Ende vorbei) -
        // exakt die Bedingung, die der Endpoint serverseitig erzwingt.
        var poolCta = document.getElementById('od-pool-cta');
        if (poolCta) {
          var dealCompleted = offerRow.agreement_status === 'activated' && offerRow.end_date && new Date(offerRow.end_date) < new Date();
          poolCta.innerHTML = (!isSupplier && dealCompleted)
            ? '<div class="od-card od-card--full" style="display:flex;flex-wrap:wrap;gap:var(--ds-space-3);align-items:center;justify-content:space-between">'
              + '<div><div class="od-card__title" style="margin:0">' + esc(TCi18n.t('demd.od.pool.title')) + '</div>'
              + '<div style="font-size:12px;color:var(--ds-text-secondary);margin-top:2px">' + esc(TCi18n.t('demd.od.pool.text')) + '</div></div>'
              + '<button type="button" id="od-add-pool-btn" class="ds-btn ds-btn--primary" onclick="addSupplierToPool(this)">' + esc(TCi18n.t('demd.od.pool.cta')) + '</button>'
              + '</div>'
            : '';
        }

        var html = '';
        html += '<div class="od-status-line">';
        html += '<span class="od-pill od-pill--neutral">' + esc(TCi18n.t('demd.od.staffing.assignment')) + ' ' + esc(String(asg.id).substring(0, 8)) + '</span>';
        html += '<span class="od-pill ' + (open > 0 ? "od-pill--warn" : "od-pill--success") + '">' + esc(open > 0 ? TCi18n.t('demd.od.staffing.open', { count: open }) : TCi18n.t('demd.od.staffing.full')) + '</span>';
        html += '<span class="od-pill od-pill--neutral">' + esc(TCi18n.t('demd.od.staffing.filled', { filled: filled, total: requested })) + '</span>';
        if (reserved > 0) html += '<span class="od-pill od-pill--neutral">' + esc(TCi18n.t('demd.od.staffing.reserved', { count: reserved })) + '</span>';
        html += '</div>';

        if (!isSupplier) {
          html += '<div class="od-note">' + esc(TCi18n.t('demd.od.staffing.buyerNote')) + '</div>';
          body.innerHTML = html;
          return;
        }

        if (open <= 0) {
          html += '<div class="od-empty" style="margin-top:var(--ds-space-3)">' + esc(TCi18n.t('demd.od.staffing.complete')) + '</div>';
          if (ctx.staffing_ready_link) {
            html += '<div class="od-actions"><a class="ds-btn ds-btn--secondary" href="' + esc(ctx.staffing_ready_link) + '">' + esc(TCi18n.t('demd.od.staffing.toControl')) + '</a></div>';
          }
          body.innerHTML = html;
          return;
        }

        if (safeCandidates.length === 0) {
          html += '<div class="od-empty" style="margin-top:var(--ds-space-3)">' + esc(TCi18n.t('demd.od.staffing.noCandidates')) + '</div>';
          html += '<div class="od-actions">';
          if (ctx.staffing_ready_link) html += '<a class="ds-btn ds-btn--primary" href="' + esc(ctx.staffing_ready_link) + '">' + esc(TCi18n.t('demd.od.staffing.toWorkspace')) + '</a>';
          html += '</div>';
          body.innerHTML = html;
          return;
        }

        html += '<div class="od-note" style="margin-top:var(--ds-space-3)">';
        html += esc(TCi18n.t('demd.od.staffing.safeNote', { count: Math.min(safeCandidates.length, open) }));
        html += '</div>';
        html += '<div class="od-list" style="margin-top:var(--ds-space-3)">';
        safeCandidates.forEach(function (entry) {
          var label = [entry.first_name, entry.last_name].filter(Boolean).join(' ') || TCi18n.t('demd.od.staffing.workerFallback');
          var sub = entry.personnel_number ? TCi18n.t('demd.od.staffing.personnelNo') + ' ' + entry.personnel_number : '';
          if (entry.match_score != null) sub = (sub ? sub + ' \u00b7 ' : '') + TCi18n.t('demd.od.staffing.match') + ' ' + Math.round(Number(entry.match_score));
          html += '<label class="od-list__item" style="display:flex;gap:10px;align-items:center;cursor:pointer">';
          html += '<input type="checkbox" class="od-staffing-candidate" value="' + esc(entry.worker_user_id) + '" checked />';
          html += '<div style="flex:1;min-width:0"><div class="od-list__title">' + esc(label) + '</div>';
          if (sub) html += '<div class="od-list__meta">' + esc(sub) + '</div>';
          html += '</div>';
          html += '<span class="od-pill od-pill--success">' + esc(TCi18n.t('demd.od.staffing.safePill')) + '</span>';
          html += '</label>';
        });
        html += '</div>';

        html += '<div class="od-actions" style="margin-top:var(--ds-space-3)">';
        html += '<button id="od-staffing-assign-btn" class="ds-btn ds-btn--primary" onclick="quickAssignFromDeal(this)">' + esc(TCi18n.t('demd.od.staffing.assignCta')) + '</button>';
        if (ctx.staffing_ready_link) html += '<a class="ds-btn ds-btn--secondary" href="' + esc(ctx.staffing_ready_link) + '">' + esc(TCi18n.t('demd.od.staffing.fullView')) + '</a>';
        html += '</div>';
        html += '<div id="od-staffing-result" style="margin-top:var(--ds-space-3);display:none"></div>';
        body.innerHTML = html;
      } catch (err) {
        body.textContent = TCi18n.t('demd.od.staffing.failedWith', {
          reason: (err && err.message) ? err.message : TCi18n.t('demd.od.staffing.errorFallback')
        });
      }
    }

    window.addSupplierToPool = async function (btn) {
      var orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = TCi18n.t('demd.od.pool.running');
      try {
        var r = await apiPost('/vendor-pool/from-deal/' + offerId, {}, false);
        var d = await r.json().catch(function () { return {}; });
        if (r.ok) { btn.textContent = '\u2713 ' + TCi18n.t('demd.od.pool.done'); return; }
        var map = {
          NOT_DEAL_REQUESTER: 'demd.od.pool.errNotRequester',
          DEAL_NOT_COMPLETED: 'demd.od.pool.errNotCompleted',
          CANNOT_ADD_SELF: 'demd.od.pool.errSelf',
          SUPPLIER_NO_ORG: 'demd.od.pool.errNoOrg',
          FORBIDDEN: 'demd.od.pool.errForbidden',
          PERMISSION_DENIED: 'demd.od.pool.errForbidden',
          ORG_CONTEXT_REQUIRED: 'demd.od.pool.errOrgContext'
        };
        btn.disabled = false;
        btn.textContent = orig;
        alert(map[d.error] ? TCi18n.t(map[d.error]) : (TCi18n.t('demd.od.err.prefix') + (d.error || r.status)));
      } catch (e) {
        btn.disabled = false;
        btn.textContent = orig;
        alert(TCi18n.t('demd.od.err.network'));
      }
    };

    window.quickAssignFromDeal = async function (btn) {
      var boxes = document.querySelectorAll('#od-staffing-block .od-staffing-candidate:checked');
      var ids = Array.prototype.map.call(boxes, function (b) { return b.value; }).filter(Boolean);
      if (!ids.length) {
        alert(TCi18n.t('demd.od.staffing.pickOne'));
        return;
      }
      var originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = TCi18n.t('demd.od.staffing.assigning');
      try {
        var r = await apiPost('/marketplace/offers/' + offerId + '/quick-assign-to-deal', { worker_user_ids: ids }, false);
        var d = await r.json();
        if (!r.ok) {
          alert(TCi18n.t('demd.od.err.prefix') + (d.message || d.error || r.status));
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }
        var resultBox = document.getElementById('od-staffing-result');
        if (resultBox) {
          var summary = d.summary || {};
          resultBox.className = 'od-note';
          resultBox.style.display = 'block';
          resultBox.textContent = TCi18n.t('demd.od.staffing.result', {
            assigned: summary.assigned_count || 0,
            skipped: summary.skipped_count || 0,
            open: summary.open_quantity_after || 0
          });
        }
        setTimeout(function () { location.reload(); }, 1500);
      } catch (e) {
        alert(TCi18n.t('demd.od.err.prefix') + e.message);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    /* ══ P8 Welle D — mehrstufige Bestaetigung ══════════════════════════════
       Drei Bestaetigungsschritte ohne benannte Folge waeren Buerokratie und
       erzeugten Klick-Blindheit. Der Hebel ist der letzte Schritt: er sagt,
       was ein Storno KOSTET — mit den echten Zahlen aus /commitment-preview
       bzw. /cancellation-impact, nie mit festem Text.

       Der Storno-Dialog ersetzt zugleich einen toten Pfad: seit Welle A
       verlangt die Route `reason_code` aus einer geschlossenen Liste, das
       alte window.prompt schickte aber Freitext unter `reason` — die
       Stornierung lief seither in eine 400er-Validierung.                    */
    var wiz = {
      el: null, schritte: [], index: 0, daten: null, absenden: null,
      auswahl: { reason_code: null, note: '' }
    };

    function wizEl(id) { return document.getElementById(id); }
    function wizZahl(v) { return (v === null || v === undefined || v === '') ? TCi18n.t('demd.od.wiz.noData') : String(v); }
    function wizDatum(iso) {
      if (!iso) return TCi18n.t('demd.od.wiz.noData');
      var t = String(iso).split('-');
      return t.length === 3 ? (t[2] + '.' + t[1] + '.' + t[0]) : String(iso);
    }
    function wizZeile(label, wert) {
      return '<div class="od-wiz-row"><dt>' + esc(label) + '</dt><dd>' + esc(wizZahl(wert)) + '</dd></div>';
    }

    /* Der Folgen-Block. EINE Funktion fuer beide Ablaeufe, damit Abschluss und
       Storno nie unterschiedliche Konsequenzen behaupten. */
    function wizFolgen(f, gewaehlterGrund) {
      if (!f) return '';
      var h = '<div class="od-wiz-effect">';
      var grund = null;
      if (gewaehlterGrund && f.gruende) {
        for (var i = 0; i < f.gruende.length; i++) {
          if (f.gruende[i].reason_code === gewaehlterGrund) { grund = f.gruende[i]; break; }
        }
      }
      var gewicht = grund ? grund.gewicht : (f.vorlauf_klasse === 'kurzfristig' ? 2 : (f.vorlauf_klasse === 'unkritisch' ? 0 : 1));
      if (grund && grund.gewicht === 0) h += '<div>' + esc(TCi18n.t('demd.od.fx.weightNone')) + '</div>';
      else if (f.vorlauf_klasse === 'unbekannt') h += '<div>' + esc(TCi18n.t('demd.od.fx.leadUnknown')) + '</div>';
      else if (gewicht >= 2) h += '<div>' + esc(TCi18n.t('demd.od.fx.weightDouble')) + '</div>';
      else h += '<div>' + esc(TCi18n.t('demd.od.fx.weightSingle')) + '</div>';

      if (f.quote_hat_aussage) {
        var danach = grund ? grund.quote_danach : null;
        h += '<div style="margin-top:8px">' + esc(TCi18n.t('demd.od.fx.quoteNow')) + ': <strong>'
           + esc(String(f.quote_aktuell)) + '%</strong>';
        if (danach !== null && danach !== undefined && grund && grund.gewicht > 0) {
          h += ' → ' + esc(TCi18n.t('demd.od.fx.quoteAfter')) + ' <strong>' + esc(String(danach)) + '%</strong>';
        }
        h += '<div style="font-size:12px;opacity:.75">' + esc(TCi18n.t('demd.od.fx.deals', { n: f.verbindliche_deals })) + '</div></div>';
      } else {
        h += '<div style="margin-top:8px">' + esc(TCi18n.t('demd.od.fx.quoteNone', { n: f.quote_sichtbar_ab })) + '</div>';
      }

      if (f.bounties_in_gefahr && f.bounties_in_gefahr.length && gewicht > 0) {
        h += '<ul class="od-wiz-list">';
        for (var b = 0; b < f.bounties_in_gefahr.length; b++) {
          var bo = f.bounties_in_gefahr[b];
          h += '<li>' + esc(TCi18n.t('demd.od.fx.bounty', {
            name: bo.name, pct: bo.discount_pct, date: wizDatum(bo.wieder_ab)
          })) + '</li>';
        }
        h += '</ul>';
      } else if (!f.bounties_in_gefahr || !f.bounties_in_gefahr.length) {
        h += '<div style="margin-top:8px;font-size:12px;opacity:.75">' + esc(TCi18n.t('demd.od.fx.bountyNone')) + '</div>';
      }
      return h + '</div>';
    }

    function wizRender() {
      var schritt = wiz.schritte[wiz.index];
      wizEl('od-wiz-progress').textContent = TCi18n.t('demd.od.wiz.step', { n: wiz.index + 1, total: wiz.schritte.length });
      wizEl('od-wiz-body').innerHTML = schritt.html();
      wizEl('od-wiz-back').style.display = wiz.index === 0 ? 'none' : '';
      wizEl('od-wiz-back').textContent = TCi18n.t('demd.od.wiz.back');
      wizEl('od-wiz-abort').textContent = TCi18n.t('demd.od.wiz.abort');
      var letzter = wiz.index === wiz.schritte.length - 1;
      var next = wizEl('od-wiz-next');
      next.textContent = letzter ? wiz.absendenLabel : TCi18n.t('demd.od.wiz.next');
      next.className = 'ds-btn ' + (letzter ? 'ds-btn--danger-solid ds-btn--primary' : 'ds-btn--primary');
      next.disabled = false;
      if (schritt.nachRender) schritt.nachRender();
    }

    function wizSchliessen() {
      // Abbruch aendert NICHTS am Zustand — es wird nur die Auswahl verworfen.
      wizEl('od-wizard').classList.remove('ds-modal--open');
      wiz.schritte = []; wiz.index = 0; wiz.daten = null;
      wiz.auswahl = { reason_code: null, note: '' };
    }

    async function wizOeffnen(titel, absendenLabel, laden, schritteBauen, absenden) {
      wizBinden();
      wiz.absendenLabel = absendenLabel;
      wiz.absenden = absenden;
      wiz.index = 0;
      wizEl('od-wiz-title').textContent = titel;
      wizEl('od-wiz-body').innerHTML = '<div class="od-wiz-hint">' + esc(TCi18n.t('demd.od.wiz.loading')) + '</div>';
      wizEl('od-wizard').classList.add('ds-modal--open');
      try {
        wiz.daten = await laden();
      } catch (e) {
        wizEl('od-wiz-body').innerHTML = '<div class="od-wiz-err">' + esc(TCi18n.t('demd.od.wiz.loadErr')) + '</div>';
        return;
      }
      wiz.schritte = schritteBauen(wiz.daten);
      wizRender();
    }

    // Die Listener werden beim ERSTEN Oeffnen gebunden, nicht beim Laden des
    // Scripts: das Modal-Markup steht weiter unten im Dokument und existiert
    // zur Ausfuehrungszeit dieses Blocks noch nicht.
    var wizGebunden = false;
    function wizBinden() {
      if (wizGebunden) return;
      wizGebunden = true;
      wizEl('od-wiz-abort').addEventListener('click', wizSchliessen);
      wizEl('od-wiz-back').addEventListener('click', function () {
        if (wiz.index > 0) { wiz.index--; wizRender(); }
      });
      wizEl('od-wiz-next').addEventListener('click', wizWeiter);
    }

    async function wizWeiter() {
      var schritt = wiz.schritte[wiz.index];
      // Kein Schritt laesst sich ueberspringen: die Pruefung steht VOR dem Weiter.
      if (schritt.pruefen && !schritt.pruefen()) return;
      if (wiz.index < wiz.schritte.length - 1) { wiz.index++; wizRender(); return; }
      var btn = wizEl('od-wiz-next');
      btn.disabled = true;
      btn.textContent = TCi18n.t('demd.od.act.running');
      try { await wiz.absenden(); } catch (e) {
        alert(TCi18n.t('demd.od.err.prefix') + e.message);
        btn.disabled = false;
        btn.textContent = wiz.absendenLabel;
      }
    }

    async function wizAbsenden(action, body) {
      var r = await apiPost('/marketplace/offers/' + offerId + '/' + action, body, false);
      var d = await r.json();
      if (!r.ok) throw new Error(d.message || d.error || r.status);
      wizSchliessen();
      location.reload();
    }

    async function wizLaden(pfad) {
      // Lesend, deshalb kein CSRF-Token noetig — gleiche Konvention wie die
      // uebrigen GETs dieser Seite (detail, dossier).
      var r = await fetch(API + '/marketplace/offers/' + offerId + '/' + pfad, { credentials: 'include' });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      return d;
    }

    /* ── Abschluss: 3 Schritte ─────────────────────────────────────────── */
    window.openCommitWizard = function () {
      wizOeffnen(
        TCi18n.t('demd.od.cm.title'), TCi18n.t('demd.od.cm.confirm'),
        function () { return wizLaden('commitment-preview'); },
        function (d) {
          var s1 = d.schritt1_was || {}, s2 = d.schritt2_wer_wie || {};
          return [
            { html: function () {
                var preis = s1.preis || {};
                var preisText = preis.wert != null ? (preis.wert + ' EUR' + (preis.abrechnungseinheit ? ' / ' + preis.abrechnungseinheit : ''))
                  : (preis.min != null || preis.max != null ? (wizZahl(preis.min) + '–' + wizZahl(preis.max) + ' EUR') : null);
                return '<h4 style="margin:0 0 8px">' + esc(TCi18n.t('demd.od.cm.s1.title')) + '</h4>'
                  + '<p class="od-wiz-hint">' + esc(TCi18n.t('demd.od.cm.s1.hint')) + '</p>'
                  + '<dl class="od-wiz-rows">'
                  + wizZeile(TCi18n.t('demd.od.cm.s1.service'), s1.leistung || s1.rolle)
                  + wizZeile(TCi18n.t('demd.od.cm.s1.period'), wizDatum((s1.zeitraum || {}).von) + ' – ' + wizDatum((s1.zeitraum || {}).bis))
                  + wizZeile(TCi18n.t('demd.od.cm.s1.qty'), s1.menge)
                  + wizZeile(TCi18n.t('demd.od.cm.s1.place'), s1.ort)
                  + wizZeile(TCi18n.t('demd.od.cm.s1.price'), preisText)
                  + '</dl>';
              } },
            { html: function () {
                var fehlt = (s2.benoetigt || 0) - (s2.bereits_zugewiesen || 0);
                return '<h4 style="margin:0 0 8px">' + esc(TCi18n.t('demd.od.cm.s2.title')) + '</h4>'
                  + '<p class="od-wiz-hint">' + esc(TCi18n.t('demd.od.cm.s2.hint')) + '</p>'
                  + '<dl class="od-wiz-rows">'
                  + wizZeile(TCi18n.t('demd.od.cm.s2.needed'), s2.benoetigt)
                  + (s2.besetzung_messbar ? wizZeile(TCi18n.t('demd.od.cm.s2.assigned'), s2.bereits_zugewiesen)
                     + wizZeile(TCi18n.t('demd.od.cm.s2.reserved'), s2.reserviert)
                     + wizZeile(TCi18n.t('demd.od.cm.s2.invites'), s2.offene_einladungen) : '')
                  + wizZeile(TCi18n.t('demd.od.cm.s2.company'), (s2.ansprechpartner || {}).unternehmen)
                  + wizZeile(TCi18n.t('demd.od.cm.s2.agency'), (s2.ansprechpartner || {}).agentur)
                  + (s2.ersatz_sla_minuten ? wizZeile(TCi18n.t('demd.od.cm.s2.sla'), TCi18n.t('demd.od.cm.s2.slaMin', { n: s2.ersatz_sla_minuten })) : '')
                  + '</dl>'
                  + (s2.besetzung_messbar && fehlt > 0
                      ? '<p class="od-wiz-hint" style="margin-top:10px;color:var(--ds-warning)">' + esc(TCi18n.t('demd.od.cm.s2.gap', { n: fehlt })) + '</p>' : '');
              } },
            { html: function () {
                return '<h4 style="margin:0 0 8px">' + esc(TCi18n.t('demd.od.cm.s3.title')) + '</h4>'
                  + '<p class="od-wiz-hint">' + esc(TCi18n.t('demd.od.cm.s3.hint')) + '</p>'
                  + wizFolgen(d.schritt3_verbindlichkeit, null);
              } }
          ];
        },
        function () { return wizAbsenden('confirm-agreement', {}); }
      );
    };

    /* ── Storno: 2 Schritte ────────────────────────────────────────────── */
    window.openCancelWizard = function () {
      wizOeffnen(
        TCi18n.t('demd.od.xm.title'), TCi18n.t('demd.od.xm.confirm'),
        function () { return wizLaden('cancellation-impact'); },
        function (d) {
          var f = d.folgen || {}, op = d.operativ || {};
          return [
            { html: function () {
                var h = '<h4 style="margin:0 0 8px">' + esc(TCi18n.t('demd.od.xm.s1.title')) + '</h4>'
                      + '<p class="od-wiz-hint">' + esc(TCi18n.t('demd.od.xm.s1.hint')) + '</p>'
                      + '<div class="od-wiz-reasons">';
                var gr = f.gruende || [];
                for (var i = 0; i < gr.length; i++) {
                  h += '<label class="od-wiz-reason" data-weight="' + esc(String(gr[i].gewicht)) + '">'
                     + '<input type="radio" name="od-wiz-grund" value="' + esc(gr[i].reason_code) + '"'
                     + (wiz.auswahl.reason_code === gr[i].reason_code ? ' checked' : '') + '/>'
                     + '<span>' + esc(gr[i].label)
                     + '<span style="display:block;font-size:11px;opacity:.7">'
                     + esc(gr[i].zaehlt ? TCi18n.t(gr[i].gewicht >= 2 ? 'demd.od.fx.weightDouble' : 'demd.od.fx.weightSingle')
                                        : TCi18n.t('demd.od.fx.weightNone'))
                     + '</span></span></label>';
                }
                h += '</div><label style="font-size:12px;display:block;margin-bottom:4px">'
                   + esc(TCi18n.t('demd.od.xm.s1.note')) + '</label>'
                   + '<textarea id="od-wiz-note" rows="2" maxlength="2000" style="width:100%" placeholder="'
                   + esc(TCi18n.t('demd.od.xm.s1.notePh')) + '">' + esc(wiz.auswahl.note || '') + '</textarea>'
                   + '<div class="od-wiz-err" id="od-wiz-pick" style="display:none;margin-top:6px">'
                   + esc(TCi18n.t('demd.od.xm.s1.pick')) + '</div>';
                return h;
              },
              nachRender: function () {
                var radios = document.getElementsByName('od-wiz-grund');
                for (var i = 0; i < radios.length; i++) {
                  radios[i].addEventListener('change', function () { wiz.auswahl.reason_code = this.value; });
                }
              },
              pruefen: function () {
                var note = wizEl('od-wiz-note');
                if (note) wiz.auswahl.note = note.value;
                if (!wiz.auswahl.reason_code) {
                  var w = wizEl('od-wiz-pick');
                  if (w) w.style.display = '';
                  return false;
                }
                return true;
              } },
            { html: function () {
                var h = '<h4 style="margin:0 0 8px">' + esc(TCi18n.t('demd.od.xm.s2.title')) + '</h4><ul class="od-wiz-list">';
                var etwas = false;
                if (op.zugewiesene_kraefte > 0) { h += '<li>' + esc(TCi18n.t('demd.od.xm.opWorkers', { n: op.zugewiesene_kraefte })) + '</li>'; etwas = true; }
                if (op.reservierungen > 0) { h += '<li>' + esc(TCi18n.t('demd.od.xm.opRes', { n: op.reservierungen })) + '</li>'; etwas = true; }
                if (op.einladungen > 0) { h += '<li>' + esc(TCi18n.t('demd.od.xm.opInv', { n: op.einladungen })) + '</li>'; etwas = true; }
                if (op.einsatz_beginn) { h += '<li>' + esc(TCi18n.t('demd.od.xm.opStart', { date: wizDatum(op.einsatz_beginn) })) + '</li>'; etwas = true; }
                if (d.gegenseite) { h += '<li>' + esc(TCi18n.t('demd.od.xm.counterparty', { name: d.gegenseite })) + '</li>'; etwas = true; }
                if (!etwas) h += '<li>' + esc(TCi18n.t('demd.od.xm.opNone')) + '</li>';
                h += '</ul><div style="margin-top:12px">' + wizFolgen(f, wiz.auswahl.reason_code) + '</div>';
                return h;
              } }
          ];
        },
        function () {
          return wizAbsenden('cancel-agreement', {
            reason_code: wiz.auswahl.reason_code,
            note: wiz.auswahl.note || null
          });
        }
      );
    };

    window.doAction = async function(action, btn) {
      if (!btn) return;
      // Diese beiden Aktionen sind seit Welle D verbindlich mehrstufig.
      if (action === 'confirm-agreement') return window.openCommitWizard();
      if (action === 'cancel-agreement') return window.openCancelWizard();
      var originalText = btn.textContent;
      var body = {};
      btn.disabled = true;
      btn.textContent = TCi18n.t('demd.od.act.running');
      try {
        var r = await apiPost('/marketplace/offers/' + offerId + '/' + action, body, false);
        var d = await r.json();
        if (!r.ok) {
          alert(TCi18n.t('demd.od.err.prefix') + (d.message || d.error || r.status));
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }
        location.reload();
      } catch (e) {
        alert(TCi18n.t('demd.od.err.prefix') + e.message);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };

    window.uploadDealDocument = async function(btn) {
      var input = document.getElementById('od-upload-file');
      if (!input || !input.files || !input.files.length) {
        alert(TCi18n.t('demd.od.upload.pickFirst'));
        return;
      }
      var originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = TCi18n.t('demd.od.upload.running');
      try {
        var form = new FormData();
        form.append('file', input.files[0]);
        form.append('asset_type', 'deal_document');
        var r = await apiPost('/offer-assets/' + offerId + '/upload', form, true);
        var d = await r.json();
        if (!r.ok || d.success === false) {
          alert(TCi18n.t('demd.od.err.prefix') + ((d && d.message) || (d && d.error) || r.status));
          btn.disabled = false;
          btn.textContent = originalText;
          return;
        }
        location.reload();
      } catch (e) {
        alert(TCi18n.t('demd.od.err.prefix') + e.message);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    };
  })();
  </script>
  <!-- P8 Welle D: mehrstufige Bestaetigung. Ein Geruest fuer beide Ablaeufe
       (Abschluss 3 Schritte, Storno 2 Schritte) — kein zweites Modal, das
       auseinanderlaufen kann. -->
  <div class="ds-modal" id="od-wizard" role="dialog" aria-modal="true" aria-labelledby="od-wiz-title">
    <div class="ds-modal__panel" style="max-width:560px">
      <div class="ds-modal__header">
        <h3 class="ds-modal__title" id="od-wiz-title"></h3>
        <div class="od-wiz-progress" id="od-wiz-progress"></div>
      </div>
      <div id="od-wiz-body" style="padding:var(--ds-space-4);min-height:180px"></div>
      <div class="ds-modal__footer">
        <button type="button" class="ds-btn ds-btn--ghost" id="od-wiz-abort"></button>
        <span style="flex:1"></span>
        <button type="button" class="ds-btn ds-btn--ghost" id="od-wiz-back"></button>
        <button type="button" class="ds-btn ds-btn--primary" id="od-wiz-next"></button>
      </div>
    </div>
  </div>
  <style>
    .od-wiz-progress { font-size:12px; color:var(--ds-text-tertiary); }
    .od-wiz-hint { font-size:12px; color:var(--ds-text-secondary); margin:0 0 var(--ds-space-3); line-height:1.5; }
    .od-wiz-rows { display:grid; gap:8px; }
    .od-wiz-row { display:flex; justify-content:space-between; gap:16px; font-size:13px;
      padding-bottom:6px; border-bottom:1px solid var(--ds-border); }
    .od-wiz-row dt { color:var(--ds-text-secondary); margin:0; }
    .od-wiz-row dd { margin:0; font-weight:600; text-align:right; }
    .od-wiz-reasons { display:grid; gap:6px; margin-bottom:var(--ds-space-3); }
    .od-wiz-reason { display:flex; align-items:flex-start; gap:10px; padding:10px 12px;
