<!DOCTYPE html>
<html lang="de">
<head>
  <script src="/public/js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempConnect – Worker Portal Login</title>
  <link rel="stylesheet" href="worker.css">
  <style>
    /* Editorial — Worker-Login an die Markenfarben angleichen. Nur Login-Scope (.wk-auth-page):
       --wk-primary lokal auf Forest umdefiniert -> Logo/Button/Focus folgen automatisch; restliches
       Worker-Portal bleibt unberührt. */
    [data-theme="editorial"] .wk-auth-page {
      --wk-primary: #1f3a2e;
      --wk-primary-d: #15291f;
      background: radial-gradient(ellipse 820px 520px at 50% -12%, rgba(31,58,46,.07), transparent 60%), #f4efe4;
    }
    [data-theme="editorial"] .wk-auth-box {
      background: #fffdf6;
      border-color: #e6dfcd;
      box-shadow: 0 1px 2px rgba(40,33,20,.05), 0 16px 40px rgba(40,33,20,.12);
    }
    [data-theme="editorial"] .wk-auth-logo { box-shadow: 0 0 0 4px rgba(31,58,46,.08); }
    [data-theme="editorial"] .wk-auth-page a { color: #7a2e2e; }
  </style>
</head>
<body>
<div class="wk-auth-page">
  <div class="wk-auth-box" id="authBox">
    <div class="wk-auth-logo">TC</div>

    <!-- PHASE 1: Einladung annehmen (mit ?invite=TOKEN) -->
    <div id="inviteSection" style="display:none">
      <h1 class="wk-auth-title">Konto einrichten</h1>
      <p class="wk-auth-subtitle" id="inviteSubtitle">Einladung wird geprüft…</p>

      <div id="inviteLoading" class="wk-loading" style="padding:20px 0">
        <div class="wk-spinner"></div>
      </div>

      <div id="inviteForm" style="display:none">
        <div class="wk-alert wk-alert-info" id="inviteInfo" style="margin-bottom:20px">
          <span>👤</span>
          <span id="inviteInfoText"></span>
        </div>

        <div class="wk-form-group">
          <label class="wk-label" for="invEmail">E-Mail-Adresse</label>
          <input type="email" id="invEmail" class="wk-input" readonly>
        </div>

        <div class="wk-form-group">
          <label class="wk-label" for="invPassword">Passwort wählen <span class="required">*</span></label>
          <input type="password" id="invPassword" class="wk-input" placeholder="Mind. 8 Zeichen" autocomplete="new-password">
          <div class="wk-pw-strength">
            <div class="wk-pw-bar"><div class="wk-pw-fill" id="pwFill"></div></div>
            <div class="wk-pw-label" id="pwLabel"></div>
          </div>
        </div>

        <div class="wk-form-group">
          <label class="wk-label" for="invPasswordConfirm">Passwort bestätigen <span class="required">*</span></label>
          <input type="password" id="invPasswordConfirm" class="wk-input" placeholder="Passwort wiederholen" autocomplete="new-password">
          <div class="wk-error-msg" id="pwMatchError" style="display:none">Passwörter stimmen nicht überein.</div>
        </div>

        <button class="wk-btn wk-btn-primary wk-btn-full" id="invAcceptBtn" onclick="acceptInvite()">
          Konto einrichten & anmelden
        </button>
        <div class="wk-error-msg" id="inviteError" style="display:none;margin-top:10px;text-align:center"></div>
      </div>

      <div id="inviteInvalid" class="wk-alert wk-alert-danger" style="display:none">
        <span>⚠️</span>
        <span id="inviteInvalidText">Dieser Einladungslink ist nicht mehr gültig.</span>
      </div>
    </div>

    <!-- PHASE 2: Login -->
    <div id="loginSection" style="display:none">
      <h1 class="wk-auth-title">Worker-Portal</h1>
      <p class="wk-auth-subtitle">Melden Sie sich an, um Ihre Stunden einzureichen</p>

      <div class="wk-form-group">
        <label class="wk-label" for="loginEmail">E-Mail-Adresse</label>
        <input type="email" id="loginEmail" class="wk-input" placeholder="ihre@email.de" autocomplete="email">
      </div>

      <div class="wk-form-group">
        <label class="wk-label" for="loginPassword">Passwort</label>
        <input type="password" id="loginPassword" class="wk-input" placeholder="Ihr Passwort" autocomplete="current-password">
      </div>

      <button class="wk-btn wk-btn-primary wk-btn-full" id="loginBtn" onclick="doLogin()">
        Anmelden
      </button>
      <div class="wk-error-msg" id="loginError" style="display:none;margin-top:10px;text-align:center"></div>

      <div class="wk-auth-footer">
        <a href="#" onclick="showForgotPw()" style="color:var(--wk-primary)">Passwort vergessen?</a>
      </div>
    </div>

    <!-- PHASE 3: Passwort vergessen -->
    <div id="forgotSection" style="display:none">
      <h1 class="wk-auth-title">Passwort zurücksetzen</h1>
      <p class="wk-auth-subtitle">Wir senden Ihnen einen Link per E-Mail</p>

      <div class="wk-form-group">
        <label class="wk-label" for="forgotEmail">E-Mail-Adresse</label>
        <input type="email" id="forgotEmail" class="wk-input" placeholder="ihre@email.de">
      </div>

      <button class="wk-btn wk-btn-primary wk-btn-full" onclick="doForgotPw()">
        Link senden
      </button>
      <div id="forgotMsg" style="display:none;margin-top:12px"></div>

      <div class="wk-auth-footer">
        <a href="#" onclick="showLogin()" style="color:var(--wk-primary)">← Zurück zum Login</a>
      </div>
    </div>
  </div>
</div>

<div id="wk-toast"></div>

<script>
const API = '/api';
const params = new URLSearchParams(location.search);
const inviteToken = params.get('invite');

/* ── CSRF ──────────────────────────────────────────────────── */
let _csrfToken = null;
async function getCsrf() {
  if (_csrfToken) return _csrfToken;
  const r = await fetch(`${API}/csrf`, { credentials:'include' });
  const d = await r.json();
  _csrfToken = d.token;
  return _csrfToken;
}

/* ── Init ─────────────────────────────────────────────────── */
(async function init() {
  if (inviteToken) {
    show('inviteSection');
    await checkInvite();
  } else {
    show('loginSection');
  }
})();

function show(id) {
  ['inviteSection','loginSection','forgotSection'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

/* ── Invite: Token prüfen ──────────────────────────────────── */
async function checkInvite() {
  try {
    const res = await fetch(`${API}/auth/worker/invite/${encodeURIComponent(inviteToken)}`);
    const data = await res.json();

    document.getElementById('inviteLoading').style.display = 'none';

    if (!res.ok || !data.valid) {
      const msgs = {
        INVITE_ALREADY_USED: 'Diese Einladung wurde bereits verwendet. Bitte melden Sie sich an.',
        INVITE_REVOKED:      'Diese Einladung wurde widerrufen. Bitte kontaktieren Sie Ihren Arbeitgeber.',
        INVITE_EXPIRED:      'Dieser Einladungslink ist abgelaufen. Bitte fordern Sie eine neue Einladung an.',
        INVITE_NOT_FOUND:    'Einladungslink nicht gefunden oder ungültig.'
      };
      document.getElementById('inviteInvalidText').textContent = msgs[data.error] || msgs.INVITE_NOT_FOUND;
      document.getElementById('inviteInvalid').style.display = 'flex';

      // Bei "already used" → Login zeigen
      if (data.error === 'INVITE_ALREADY_USED') {
        setTimeout(() => show('loginSection'), 2500);
      }
      return;
    }

    // Token gültig → Formular befüllen
    document.getElementById('invEmail').value = data.email;
    document.getElementById('inviteInfoText').textContent =
      `Hallo ${data.first_name} ${data.last_name} — Einladung von ${data.supplier_org_name || 'Ihrem Arbeitgeber'}`;
    document.getElementById('inviteSubtitle').textContent =
      `Richten Sie jetzt Ihr Worker-Konto ein`;
    document.getElementById('inviteForm').style.display = 'block';
  } catch (e) {
    document.getElementById('inviteLoading').style.display = 'none';
    document.getElementById('inviteInvalid').style.display = 'flex';
  }
}

/* ── Passwort-Stärke ───────────────────────────────────────── */
document.addEventListener('input', function(e) {
  if (e.target.id !== 'invPassword') return;
  const pw = e.target.value;
  const fill = document.getElementById('pwFill');
  const lbl  = document.getElementById('pwLabel');
  if (!pw) { fill.className = 'wk-pw-fill'; lbl.textContent = ''; return; }
  if (pw.length < 8) { fill.className = 'wk-pw-fill weak'; lbl.textContent = 'Zu kurz'; return; }
  const hasUpper = /[A-Z]/.test(pw);
  const hasNum   = /\d/.test(pw);
  const hasSpec  = /[^A-Za-z0-9]/.test(pw);
  const score = [hasUpper, hasNum, hasSpec].filter(Boolean).length;
  if (score === 0 || pw.length < 10) { fill.className = 'wk-pw-fill medium'; lbl.textContent = 'Mittel'; }
  else { fill.className = 'wk-pw-fill strong'; lbl.textContent = 'Stark'; }
});

/* ── Invite acceptieren ────────────────────────────────────── */
async function acceptInvite() {
  const pw  = document.getElementById('invPassword').value;
  const pw2 = document.getElementById('invPasswordConfirm').value;
  const errEl = document.getElementById('inviteError');
  const matchEl = document.getElementById('pwMatchError');

  matchEl.style.display = pw !== pw2 ? 'block' : 'none';
  if (pw !== pw2) return;
  if (pw.length < 8) { errEl.textContent = 'Passwort muss mindestens 8 Zeichen lang sein.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('invAcceptBtn');
  btn.disabled = true; btn.textContent = '⏳ Wird eingerichtet…';
  errEl.style.display = 'none';

  try {
    const csrf = await getCsrf();
    const res = await fetch(`${API}/auth/worker/accept-invite`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
      body: JSON.stringify({ token: inviteToken, password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fehler');
    showToast('Konto eingerichtet! Weiterleitung…', 'success');
    // Nach Annahme einer Einladung ins PROFIL, nicht aufs Dashboard (Multi-Skill Welle 2):
    // Wer gerade erst eingeladen wurde, hat ein leeres Profil. Das Dashboard zeigt ihm
    // dann leere Listen und keinen Weg nach vorn. `willkommen=1` macht dort aus dem
    // Fortschrittsbanner eine Begruessung mit dem ersten offenen Schritt.
    // Der normale Login unten fuehrt weiterhin aufs Dashboard — eine Bestandskraft will
    // ihre Einsaetze sehen, nicht ihr Profil.
    setTimeout(() => location.href = 'einsatzportal-profil.html?willkommen=1', 1500);
  } catch (e) {
    errEl.textContent = e.message === 'INVITE_ALREADY_USED'
      ? 'Diese Einladung wurde bereits verwendet.'
      : 'Fehler beim Einrichten des Kontos. Bitte versuchen Sie es erneut.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Konto einrichten & anmelden';
  }
}

/* ── Login ─────────────────────────────────────────────────── */
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  if (!email || !pw) { errEl.textContent = 'Bitte E-Mail und Passwort eingeben.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '⏳ Anmelden…';
  errEl.style.display = 'none';

  try {
    const csrf = await getCsrf();
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
      body: JSON.stringify({ email, password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'LOGIN_FAILED');
    if (data.role !== 'worker') {
      errEl.textContent = 'Dieses Portal ist nur für Worker-Accounts zugänglich.';
      errEl.style.display = 'block';
      await fetch(`${API}/auth/logout`, { method: 'POST', credentials: 'include', headers: { 'x-csrf-token': csrf } });
      btn.disabled = false; btn.textContent = 'Anmelden';
      return;
    }
    location.href = 'einsatzportal-dashboard.html';
  } catch (e) {
    errEl.textContent = e.message === 'INVALID_CREDENTIALS'
      ? 'E-Mail oder Passwort falsch.'
      : 'Anmeldung fehlgeschlagen. Bitte versuchen Sie es erneut.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginSection').style.display !== 'none') doLogin();
    if (document.getElementById('inviteSection').style.display !== 'none') acceptInvite();
  }
});

/* ── Passwort vergessen ────────────────────────────────────── */
function showForgotPw() { show('forgotSection'); }
function showLogin()    { show('loginSection'); }

async function doForgotPw() {
  const email = document.getElementById('forgotEmail').value.trim();
  const msgEl = document.getElementById('forgotMsg');
  if (!email) return;
  try {
    const csrf = await getCsrf();
    await fetch(`${API}/auth/forgot-password`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
      body: JSON.stringify({ email })
    });
    msgEl.innerHTML = '<div class="wk-alert wk-alert-success"><span>✅</span><span>Falls ein Konto existiert, wurde ein Link gesendet.</span></div>';
    msgEl.style.display = 'block';
  } catch { /* silent */ }
}

/* ── Toast ─────────────────────────────────────────────────── */
function showToast(msg, type = '') {
  const t = document.getElementById('wk-toast');
  t.textContent = msg; t.className = type ? `show ${type}` : 'show';
  setTimeout(() => { t.className = ''; }, 3000);
}
</script>
<script src="/public/js/demoBanner.js" defer></script>
<script src="/public/js/breadcrumb.js" defer></script>
</body>
</html>
