<!DOCTYPE html>
<html lang="de" data-theme="editorial">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- noindex: Persönliche Daten (DSGVO) — Einwilligungsbasierte Indexierung erst nach Consent-Tracking -->
  <meta name="robots" content="noindex, nofollow">
  <title>TempConnect – Mitarbeiterprofil</title>
  <link rel="stylesheet" href="/public/css/enterprise.css">
  <style>
    body { margin:0; background:#0a0f1e; color:#eaeff8; font-family:Inter,system-ui,sans-serif; }
    .wrap { max-width:920px; margin:0 auto; padding:32px 20px 48px; }
    .hero { padding:24px; border-radius:20px; border:1px solid rgba(255,255,255,.08); background:linear-gradient(135deg,rgba(74,158,255,.16),rgba(124,92,255,.08)); margin-bottom:18px; }
    .hero h1 { margin:0; font-size:28px; font-weight:900; }
    .hero p { margin:8px 0 0; color:#8d9bba; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
    .card { padding:20px; border-radius:16px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); }
    .card h2 { margin:0 0 12px; font-size:16px; font-weight:800; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px; border:1px solid rgba(74,158,255,.25); background:rgba(74,158,255,.12); font-size:12px; font-weight:700; }
    .qual-list { display:flex; flex-direction:column; gap:10px; }
    .qual-item { padding:12px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); }
    .qual-item strong { display:block; margin-bottom:6px; }
    .qual-meta { display:flex; flex-wrap:wrap; gap:8px; color:#8d9bba; font-size:12px; }
    .empty, .error { text-align:center; padding:48px 20px; border:1px solid rgba(255,255,255,.08); border-radius:18px; background:rgba(255,255,255,.03); }
    .error { border-color:rgba(248,113,113,.25); color:#f87171; }

    /* EDITORIAL — de-blue + warm boxes (scoped; dark untouched) */
    [data-theme="editorial"] body { background:#faf7ee; color:#14201a; }
    [data-theme="editorial"] .hero { background:#15291f; border-color:#15291f; }
    [data-theme="editorial"] .hero h1 { color:#faf7ee; }
    [data-theme="editorial"] .hero p { color:#ebe4d3; }
    [data-theme="editorial"] .card { background:#ebe4d3; border-color:#d4cab3; }
    [data-theme="editorial"] .chip { background:rgba(31,58,46,.08); border-color:rgba(31,58,46,.25); color:#1f3a2e; }
    [data-theme="editorial"] .qual-item { background:#fffdf6; border-color:#d4cab3; }
    [data-theme="editorial"] .qual-meta { color:#6b6457; }
    [data-theme="editorial"] .empty { background:#ebe4d3; border-color:#d4cab3; }
    [data-theme="editorial"] .error { background:#ebe4d3; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="state-loading" class="empty">Profil wird geladen…</div>
    <div id="state-error" class="error" style="display:none">Dieses Profil ist nicht verfügbar.</div>
    <main id="profile-root" style="display:none">
      <section class="hero">
        <h1 id="profile-name">Mitarbeiterprofil</h1>
        <p id="profile-subtitle">Freigegebene Profilinformationen</p>
      </section>
      <section class="grid">
        <article class="card" id="card-about" style="display:none">
          <h2>Kurzprofil</h2>
          <div id="profile-text" style="white-space:pre-wrap;line-height:1.6"></div>
        </article>
        <article class="card" id="card-skills" style="display:none">
          <h2>Skills</h2>
          <div id="profile-skills" class="chips"></div>
        </article>
        <article class="card" id="card-quals" style="display:none">
          <h2>Qualifikationen</h2>
          <div id="profile-quals" class="qual-list"></div>
        </article>
        <article class="card" id="card-location" style="display:none">
          <h2>Ort</h2>
          <div id="profile-city"></div>
        </article>
        <article class="card" id="card-availability" style="display:none">
          <h2>Verfügbarkeit</h2>
          <div id="profile-availability"></div>
        </article>
      </section>
    </main>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var loading = document.getElementById("state-loading");
      var error = document.getElementById("state-error");
      var root = document.getElementById("profile-root");

      function showError() {
        loading.style.display = "none";
        root.style.display = "none";
        error.style.display = "";
      }

      if (!slug) {
        showError();
        return;
      }

      fetch("/api/public/worker-profiles/" + encodeURIComponent(slug))
        .then(function (res) {
          if (!res.ok) throw new Error("NOT_FOUND");
          return res.json();
        })
        .then(function (profile) {
          loading.style.display = "none";
          root.style.display = "";
          document.getElementById("profile-name").textContent = profile.name || "Mitarbeiterprofil";

          if (profile.profile_text) {
            document.getElementById("card-about").style.display = "";
            document.getElementById("profile-text").textContent = profile.profile_text;
          }
          if (profile.skill_tags && profile.skill_tags.length) {
            document.getElementById("card-skills").style.display = "";
            document.getElementById("profile-skills").innerHTML = profile.skill_tags.map(function (skill) {
              return '<span class="chip">' + String(skill)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;") + "</span>";
            }).join("");
          }
          if (profile.qualifications && profile.qualifications.length) {
            document.getElementById("card-quals").style.display = "";
            document.getElementById("profile-quals").innerHTML = profile.qualifications.map(function (qualification) {
              var meta = [];
              if (qualification.issuer) meta.push("Aussteller: " + qualification.issuer);
              if (qualification.expires_at) meta.push("Gültig bis: " + qualification.expires_at);
              if (qualification.document_label) meta.push("Nachweis: " + qualification.document_label);
              return '<div class="qual-item"><strong>' + String(qualification.name || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;") + '</strong><div class="qual-meta">' + meta.map(function (item) {
                  return '<span>' + String(item)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;") + "</span>";
                }).join("") + "</div></div>";
            }).join("");
          }
          if (profile.city) {
            document.getElementById("card-location").style.display = "";
            document.getElementById("profile-city").textContent = profile.city;
          }
          if (profile.availability_note) {
            document.getElementById("card-availability").style.display = "";
            document.getElementById("profile-availability").textContent = profile.availability_note;
          }
        })
        .catch(showError);
    }());
  </script>
  <div id="tc-footer"></div>
  <script src="/public/js/footer.js" defer></script>
</body>
</html>
