<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>API Dokumentation – TempConnect</title>
  <link rel="stylesheet" href="/public/css/enterprise.css"/>
  <style>
    .ep-group { margin-bottom: var(--ds-space-6); padding: var(--ds-space-5); border:1px solid var(--ds-border); border-radius: var(--ds-radius-lg); background:rgba(255,255,255,.015) }
    .ep-group h3 { margin:0 0 var(--ds-space-3); font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--ds-text-secondary); font-weight:700 }
    .ep-row { display:flex; gap:10px; padding:6px 0; border-bottom:1px solid var(--ds-border); font-size:13px; align-items:baseline }
    .ep-row:last-child { border-bottom:none }
    .ep-method { font-weight:700; width:60px; flex-shrink:0; font-family:monospace; font-size:12px }
    .ep-method.get { color:var(--good) }
    .ep-method.post { color:var(--brand) }
    .ep-method.put { color:var(--warn) }
    .ep-method.patch { color:#7c5cff }
    .ep-method.delete { color:var(--bad) }
    .ep-path { font-family:monospace; color:var(--text); flex:1 }
    .ep-desc { color:var(--muted); flex:1.5 }
    .ep-auth { font-size:11px; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,.06); color:var(--muted); white-space:nowrap }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="brand"><span style="width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:inline-block;margin-right:8px"></span>TempConnect</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <a href="/public/enterprise.html" class="btn">Hub</a>
        <a href="/public/executive_dashboard.html" class="btn">Dashboard</a>
      </div>
    </div>

    <div class="ds-page-header">
      <div class="ds-page-header__content">
        <h1 class="ds-page-title">API Dokumentation</h1>
        <p class="ds-page-subtitle">Referenz aller verfügbaren REST-Endpunkte der TempConnect-Plattform.</p>
      </div>
    </div>

    <p style="font-size:13px;color:var(--muted);margin-bottom:var(--ds-space-5)">Base-URL: <code>/api</code> &nbsp;|&nbsp; Auth: JWT Cookie (<code>token</code>) &nbsp;|&nbsp; CSRF: Header <code>x-csrf-token</code> für Schreiboperationen</p>

    <div id="docs"></div>
  </div>

  <script>
    var groups = [
      { title:'Auth & Session', endpoints:[
        {m:'POST',p:'/auth/register',d:'Neuen Benutzer registrieren',a:'Public'},
        {m:'POST',p:'/auth/login',d:'Login, setzt JWT-Cookie',a:'Public'},
        {m:'POST',p:'/auth/logout',d:'Logout, löscht Cookie',a:'Auth'},
        {m:'GET',p:'/auth/me',d:'Aktueller Benutzer / Session-Info',a:'Auth'},
        {m:'GET',p:'/csrf-token',d:'CSRF-Token abrufen',a:'Auth'},
      ]},
      { title:'Benutzer & Profil', endpoints:[
        {m:'GET',p:'/users/profile',d:'Eigenes Profil laden',a:'Auth'},
        {m:'PUT',p:'/users/profile',d:'Profil aktualisieren',a:'Auth'},
        {m:'GET',p:'/users/company-profile',d:'Firmenprofil laden',a:'Auth'},
        {m:'PUT',p:'/users/company-profile',d:'Firmenprofil speichern',a:'Auth'},
      ]},
      { title:'Organisationen', endpoints:[
        {m:'POST',p:'/organizations',d:'Organisation erstellen',a:'Auth'},
        {m:'GET',p:'/organizations',d:'Eigene Organisationen auflisten',a:'Auth'},
        {m:'POST',p:'/organizations/:id/invite',d:'Mitglied einladen',a:'Auth'},
      ]},
      { title:'Requisitions', endpoints:[
        {m:'POST',p:'/requisitions',d:'Neue Requisition erstellen',a:'Auth'},
        {m:'GET',p:'/requisitions',d:'Requisitions auflisten (paginiert)',a:'Auth'},
        {m:'GET',p:'/requisitions/:id',d:'Einzelne Requisition laden',a:'Auth'},
        {m:'PATCH',p:'/requisitions/:id/status',d:'Status aktualisieren',a:'Auth'},
        {m:'POST',p:'/requisitions/:id/submit',d:'Kandidaten-Submission',a:'Auth'},
        {m:'PATCH',p:'/requisitions/:id/submissions/:sid',d:'Submission-Status ändern',a:'Auth'},
      ]},
      { title:'Vendor Pool', endpoints:[
        {m:'POST',p:'/vendor-pool',d:'Vendor-Eintrag erstellen',a:'Auth'},
        {m:'GET',p:'/vendor-pool',d:'Vendor-Pool auflisten',a:'Auth'},
        {m:'PUT',p:'/vendor-pool/:id',d:'Vendor-Eintrag bearbeiten',a:'Auth'},
        {m:'POST',p:'/vendor-pool/:id/rate',d:'Vendor bewerten',a:'Auth'},
        {m:'GET',p:'/vendor-pool/tiers',d:'Tier-Statistiken',a:'Auth'},
      ]},
      { title:'SLA', endpoints:[
        {m:'POST',p:'/sla/definitions',d:'SLA-Definition erstellen',a:'Auth'},
        {m:'GET',p:'/sla/definitions',d:'SLA-Definitionen auflisten',a:'Auth'},
        {m:'POST',p:'/sla/tracking',d:'SLA-Tracking starten',a:'Auth'},
        {m:'GET',p:'/sla/tracking',d:'SLA-Trackings abfragen',a:'Auth'},
        {m:'PUT',p:'/sla/tracking/:id',d:'Tracking aktualisieren',a:'Auth'},
      ]},
      { title:'Capacity Exchange', endpoints:[
        {m:'POST',p:'/capacity-exchange/posts',d:'Kapazitäts-Post erstellen',a:'Auth'},
        {m:'GET',p:'/capacity-exchange/feed',d:'Feed (paginiert, mit Filtern)',a:'Auth'},
        {m:'GET',p:'/capacity-exchange/posts/:id',d:'Einzelnen Post laden',a:'Auth'},
        {m:'DELETE',p:'/capacity-exchange/posts/:id',d:'Post löschen',a:'Auth'},
      ]},
      { title:'Marketplace / Matching', endpoints:[
        {m:'POST',p:'/marketplace/search-jobs',d:'Such-Auftrag erstellen',a:'Auth'},
        {m:'GET',p:'/marketplace/search-jobs',d:'Such-Aufträge auflisten',a:'Auth'},
        {m:'GET',p:'/marketplace/search-jobs/:id',d:'Such-Auftrag Detail',a:'Auth'},
        {m:'POST',p:'/marketplace/search-jobs/:id/run',d:'Matching ausführen',a:'Auth'},
        {m:'GET',p:'/marketplace/search-jobs/:id/results',d:'Matching-Ergebnisse',a:'Auth'},
        {m:'POST',p:'/marketplace/offers',d:'Angebot senden',a:'Auth'},
        {m:'GET',p:'/marketplace/my-offers',d:'Eigene gesendete Angebote',a:'Auth'},
        {m:'GET',p:'/marketplace/received-offers',d:'Empfangene Angebote',a:'Auth'},
        {m:'PATCH',p:'/marketplace/offers/:id',d:'Angebot-Status ändern',a:'Auth'},
      ]},
      { title:'Compliance', endpoints:[
        {m:'POST',p:'/compliance/documents',d:'Dokument hochladen',a:'Auth'},
        {m:'GET',p:'/compliance/documents',d:'Dokumente auflisten',a:'Auth'},
        {m:'PATCH',p:'/compliance/documents/:id/verify',d:'Dokument verifizieren',a:'Admin'},
      ]},
      { title:'Reporting & Dashboard', endpoints:[
        {m:'GET',p:'/reporting/dashboard',d:'Dashboard-KPIs (Requisitions, SLA, Compliance, Platform)',a:'Auth'},
      ]},
      { title:'Suche', endpoints:[
        {m:'GET',p:'/search?q=&type=&limit=',d:'Globale Volltextsuche',a:'Auth'},
        {m:'GET',p:'/search/status',d:'Search-Engine Status',a:'Auth'},
      ]},
      { title:'Activity Feed & Notifications', endpoints:[
        {m:'GET',p:'/activity-feed?limit=&offset=',d:'Aktivitäts-Timeline',a:'Auth'},
        {m:'GET',p:'/notification-preferences',d:'Benachrichtigungs-Einstellungen laden',a:'Auth'},
        {m:'PUT',p:'/notification-preferences',d:'Einstellungen speichern',a:'Auth'},
        {m:'GET',p:'/notification-preferences/unread-count',d:'Ungelesene Benachrichtigungen',a:'Auth'},
      ]},
      { title:'Admin', endpoints:[
        {m:'GET',p:'/admin/users?limit=&offset=',d:'Benutzer auflisten',a:'Admin'},
        {m:'PATCH',p:'/admin/users/:id',d:'Benutzer bearbeiten (role/plan/is_verified)',a:'Admin'},
        {m:'POST',p:'/admin/users/:id/deactivate',d:'Benutzer deaktivieren',a:'Admin'},
        {m:'GET',p:'/admin/organizations',d:'Organisationen auflisten',a:'Admin'},
        {m:'GET',p:'/admin/audit-log',d:'Audit-Log abfragen',a:'Admin'},
        {m:'GET',p:'/admin/metrics',d:'Plattform-Metriken',a:'Admin'},
      ]},
      { title:'System', endpoints:[
        {m:'GET',p:'/health',d:'Health-Check (DB, Redis, Service)',a:'Public'},
      ]},
    ];

    function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
    var html='';
    groups.forEach(function(g){
      html+='<div class="ep-group"><h3>'+esc(g.title)+'</h3>';
      g.endpoints.forEach(function(e){
        html+='<div class="ep-row"><span class="ep-method '+e.m.toLowerCase()+'">'+e.m+'</span><span class="ep-path">'+esc(e.p)+'</span><span class="ep-desc">'+esc(e.d)+'</span><span class="ep-auth">'+esc(e.a)+'</span></div>';
      });
      html+='</div>';
    });
    document.getElementById('docs').innerHTML=html;
  </script>
  <div id="tc-footer" data-tc-footer></div>
  <script src="/public/js/footer.js"></script>
  <script src="/public/js/logout-btn.js"></script>
</body>
</html>
