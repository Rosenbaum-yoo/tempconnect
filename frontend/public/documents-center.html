<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/public/js/theme.js"></script>
  <script src="/public/js/i18n.js"></script>
  <title data-i18n="doc.docTitle">Dokumente &amp; PDFs &ndash; TempConnect</title>
  <link rel="stylesheet" href="/public/css/design-system.css"/>
  <style>
    .dc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--ds-space-3);margin:var(--ds-space-4) 0}
    .dc-stat{border:1px solid var(--ds-border);border-radius:var(--ds-radius-lg);padding:var(--ds-space-4);background:rgba(255,255,255,.02)}
    .dc-stat__num{font-size:24px;font-weight:800}
    .dc-stat__label{font-size:12px;color:var(--ds-text-secondary);text-transform:uppercase;letter-spacing:.04em}
    .dc-card{border:1px solid var(--ds-border);border-radius:var(--ds-radius-lg);background:rgba(255,255,255,.02);padding:var(--ds-space-5);margin-bottom:var(--ds-space-4)}
    .dc-field{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--ds-space-3)}
    .dc-field label{font-size:12px;font-weight:700;color:var(--ds-text-secondary)}
    .dc-field input,.dc-field select,.dc-field textarea{padding:8px 10px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-md);background:var(--ds-bg);color:var(--ds-text);width:100%;font:inherit}
    .dc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--ds-space-3)}
    .dc-filters{display:flex;flex-wrap:wrap;gap:var(--ds-space-2);align-items:flex-end;margin-bottom:var(--ds-space-3)}
    .dc-table{width:100%;border-collapse:collapse;font-size:14px}
    .dc-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ds-text-secondary);padding:8px 10px;border-bottom:1px solid var(--ds-border)}
    .dc-table td{padding:10px;border-bottom:1px solid var(--ds-border);vertical-align:middle}
    .dc-table tr:hover td{background:rgba(255,255,255,.02)}
    .dc-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ds-brand-muted);color:var(--ds-brand)}
    .dc-badge--archived{background:rgba(138,95,26,.12);color:var(--ds-warning,#8a5f1a)}
    .dc-actions a,.dc-actions button{font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid var(--ds-border);background:none;color:var(--ds-text);cursor:pointer;text-decoration:none;margin-right:4px}
    .dc-actions a:hover,.dc-actions button:hover{border-color:var(--ds-brand);color:var(--ds-brand)}
    .toast{position:fixed;top:20px;right:20px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;max-width:340px}
    .toast.show{opacity:1}
    .toast--ok{background:rgba(45,106,79,.14);border:1px solid rgba(45,106,79,.32);color:var(--ds-success,#2d6a4f)}
    .toast--err{background:rgba(143,45,45,.12);border:1px solid rgba(143,45,45,.32);color:var(--ds-danger,#8f2d2d)}
    @media(max-width:640px){.dc-grid2{grid-template-columns:1fr}}

    /* EDITORIAL — warme Creme-Flaechen statt White-Alpha (dark/light/ultra byte-identisch) */
    [data-theme="editorial"] .dc-stat,[data-theme="editorial"] .dc-card{background:#ebe4d3;border-color:#d4cab3}
    [data-theme="editorial"] .dc-table tr:hover td{background:rgba(31,58,46,.05)}
  </style>
</head>
<body>
  <div class="ds-wrap">
    <div id="tc-shell"></div>

    <div class="ds-page-header">
      <div class="ds-page-header__content">
        <h1 class="ds-page-title" data-i18n="doc.page.title">Dokumente &amp; PDFs</h1>
        <p class="ds-page-subtitle" data-i18n="doc.page.subtitle">Ihr zentraler Dokumenten-Tresor: Rechnungen, Vertraege, Policies und Nachweise sicher ablegen, verwalten und als PDF herunterladen.</p>
      </div>
      <div class="ds-page-header__actions">
        <button class="ds-btn ds-btn--primary" id="btnNew" style="display:none" onclick="toggleUpload()" data-i18n="doc.page.upload">+ Dokument hochladen</button>
      </div>
    </div>

    <div id="dc-stats" class="dc-stats"></div>

    <!-- Upload -->
    <div class="dc-card" id="uploadCard" style="display:none">
      <h3 style="margin:0 0 var(--ds-space-3);font-size:16px;font-weight:700" data-i18n="doc.upload.heading">Neues Dokument</h3>
      <div class="dc-grid2">
        <div class="dc-field"><label data-i18n="doc.field.title">Titel *</label><input id="f-title" placeholder="z.B. Rechnung Mai 2026" data-i18n-ph="doc.field.titlePh"/></div>
        <div class="dc-field"><label data-i18n="doc.field.file">Datei (PDF, Bild &middot; max. 15 MB)</label><input type="file" id="f-file" accept=".pdf,.png,.jpg,.jpeg,.webp"/></div>
        <div class="dc-field"><label data-i18n="doc.field.type">Typ</label><select id="f-type"></select></div>
        <div class="dc-field"><label data-i18n="doc.field.cat">Kategorie</label><select id="f-cat"></select></div>
        <div class="dc-field"><label data-i18n="doc.field.valid">Gueltig bis (optional)</label><input type="date" id="f-valid"/></div>
        <div class="dc-field"><label data-i18n="doc.field.retention">Aufbewahrung bis (optional, DSGVO/GoBD)</label><input type="date" id="f-retention"/></div>
      </div>
      <div class="dc-field"><label data-i18n="doc.field.notes">Notiz (optional)</label><textarea id="f-notes" rows="2"></textarea></div>
      <div style="display:flex;gap:var(--ds-space-2);justify-content:flex-end">
        <button class="ds-btn" onclick="toggleUpload()" data-i18n="doc.upload.cancel">Abbrechen</button>
        <button class="ds-btn ds-btn--primary" id="btnUpload" onclick="uploadDoc()" data-i18n="doc.upload.submit">Hochladen</button>
      </div>
      <div id="upMsg" style="margin-top:var(--ds-space-2);font-size:12px"></div>
    </div>

    <!-- Filter -->
    <div class="dc-filters">
      <div class="dc-field" style="margin:0"><label data-i18n="doc.field.type">Typ</label><select id="flt-type"></select></div>
      <div class="dc-field" style="margin:0"><label data-i18n="doc.field.cat">Kategorie</label><select id="flt-cat"></select></div>
      <div class="dc-field" style="margin:0"><label data-i18n="doc.field.status">Status</label><select id="flt-status"><option value="" data-i18n="doc.filter.all">Alle</option><option value="active" data-i18n="doc.status.active">Aktiv</option><option value="archived" data-i18n="doc.status.archived">Archiviert</option></select></div>
      <button class="ds-btn" onclick="exportZip()" style="margin-left:auto" data-i18n="doc.filter.exportZip">Als ZIP exportieren</button>
    </div>

    <div class="dc-card" style="padding:0;overflow-x:auto">
      <table class="dc-table">
        <thead><tr><th data-i18n="doc.table.title">Titel</th><th data-i18n="doc.table.type">Typ</th><th data-i18n="doc.table.cat">Kategorie</th><th data-i18n="doc.table.size">Groesse</th><th data-i18n="doc.table.date">Datum</th><th data-i18n="doc.table.status">Status</th><th style="text-align:right" data-i18n="doc.table.actions">Aktionen</th></tr></thead>
        <tbody id="dc-rows"><tr><td colspan="7" style="padding:var(--ds-space-5);color:var(--ds-text-secondary)" data-i18n="doc.table.loading">Lade Dokumente&hellip;</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/public/js/pageShell.js"></script>
  <div id="tc-footer" data-tc-footer></div>
  <script src="/public/js/footer.js"></script>
  <script src="/public/js/breadcrumb.js" defer></script>
  <script>
  (function(){
    "use strict";

    /* ── Woerterbuch (P6.1, DE/EN) ────────────────────────────────────────────
       i18n.js liegt bereits im head; dieses Inline-Script laeuft ausschliesslich
       auf documents-center.html, TCi18n ist hier also garantiert vorhanden.

       Bewusst NICHT uebersetzt:
       - Topbar, Navigation, Nutzerbereich und Sprach-Umschalter (pageShell.js)
       - die option[value] der Filter (document_type / content_category / status)
         und der Statusrohwert "archived": diese Werte gehen an den Server
       - API-Daten (Dokumenttitel, Originaldateiname, Datum, Groesse)
       Drei-Seiten-Regel: der Dokumenten-Tresor kennt keinen rollenabhaengigen
       Begriff aus terminologyLabels.js — Rechnung, Vertrag und Nachweis heissen
       fuer Unternehmen, Personaldienstleister und Arbeiter identisch. Deshalb
       ist die feste Woerterbuch-Fassung hier korrekt.                          */
    TCi18n.register('de', {
      'doc.docTitle': 'Dokumente & PDFs – TempConnect',
      'doc.page.title': 'Dokumente & PDFs',
      'doc.page.subtitle': 'Ihr zentraler Dokumenten-Tresor: Rechnungen, Vertraege, Policies und Nachweise sicher ablegen, verwalten und als PDF herunterladen.',
      'doc.page.upload': '+ Dokument hochladen',

      'doc.stat.total': 'Dokumente',
      'doc.stat.active': 'Aktiv',
      'doc.stat.archived': 'Archiviert',
      'doc.stat.storage': 'Speicher',

      'doc.upload.heading': 'Neues Dokument',
      'doc.upload.cancel': 'Abbrechen',
      'doc.upload.submit': 'Hochladen',

      'doc.field.title': 'Titel *',
      'doc.field.titlePh': 'z.B. Rechnung Mai 2026',
      'doc.field.file': 'Datei (PDF, Bild · max. 15 MB)',
      'doc.field.type': 'Typ',
      'doc.field.cat': 'Kategorie',
      'doc.field.valid': 'Gueltig bis (optional)',
      'doc.field.retention': 'Aufbewahrung bis (optional, DSGVO/GoBD)',
      'doc.field.notes': 'Notiz (optional)',
      'doc.field.status': 'Status',

      'doc.filter.all': 'Alle',
      'doc.filter.exportZip': 'Als ZIP exportieren',
      'doc.status.active': 'Aktiv',
      'doc.status.archived': 'Archiviert',

      'doc.table.title': 'Titel',
      'doc.table.type': 'Typ',
      'doc.table.cat': 'Kategorie',
      'doc.table.size': 'Groesse',
      'doc.table.date': 'Datum',
      'doc.table.status': 'Status',
      'doc.table.actions': 'Aktionen',
      'doc.table.loading': 'Lade Dokumente…',

      'doc.type.invoice': 'Rechnung',
      'doc.type.contract': 'Vertrag',
      'doc.type.policy': 'Richtlinie',
      'doc.type.certificate': 'Zertifikat/Nachweis',
      'doc.type.report': 'Bericht',
      'doc.type.correspondence': 'Korrespondenz',
      'doc.type.other': 'Sonstiges',

      'doc.cat.financial': 'Finanzen',
      'doc.cat.legal': 'Rechtliches',
      'doc.cat.operational': 'Betrieb',
      'doc.cat.hr': 'Personal',
      'doc.cat.other': 'Sonstiges',

      'doc.action.download': 'Download',
      'doc.action.archive': 'Archivieren',
      'doc.action.reactivate': 'Reaktivieren',
      'doc.action.delete': 'Loeschen',
      'doc.badge.auto': 'Auto',
      'doc.badge.autoTitle': 'Automatisch von der Plattform abgelegt',

      'doc.state.forbidden': 'Kein Zugriff auf den Dokumenten-Tresor.',
      'doc.state.loadError': 'Fehler beim Laden.',
      'doc.state.network': 'Netzwerkfehler.',
      'doc.empty.title': 'Noch keine Dokumente',
      'doc.empty.manage': 'Laden Sie Ihr erstes Dokument hoch.',
      'doc.empty.readonly': 'Hier erscheinen die Dokumente Ihrer Organisation.',

      'doc.msg.titleRequired': 'Titel ist erforderlich.',
      'doc.msg.uploading': 'Lade hoch…',
      'doc.msg.uploadError': 'Fehler: {detail}',
      'doc.msg.uploaded': 'Dokument hochgeladen.',
      'doc.msg.actionFailed': 'Aktion fehlgeschlagen.',
      'doc.msg.deleteConfirm': 'Dokument unwiderruflich loeschen?',
      'doc.msg.deleted': 'Geloescht.',
      'doc.msg.deleteFailed': 'Loeschen fehlgeschlagen.'
    });
    TCi18n.register('en', {
      'doc.docTitle': 'Documents & PDFs – TempConnect',
      'doc.page.title': 'Documents & PDFs',
      'doc.page.subtitle': 'Your central document vault: file, manage and download invoices, contracts, policies and proofs as PDF.',
      'doc.page.upload': '+ Upload document',

      'doc.stat.total': 'Documents',
      'doc.stat.active': 'Active',
      'doc.stat.archived': 'Archived',
      'doc.stat.storage': 'Storage',

      'doc.upload.heading': 'New document',
      'doc.upload.cancel': 'Cancel',
      'doc.upload.submit': 'Upload',

      'doc.field.title': 'Title *',
      'doc.field.titlePh': 'e.g. invoice May 2026',
      'doc.field.file': 'File (PDF, image · max. 15 MB)',
      'doc.field.type': 'Type',
      'doc.field.cat': 'Category',
      'doc.field.valid': 'Valid until (optional)',
      'doc.field.retention': 'Retention until (optional, GDPR/GoBD)',
      'doc.field.notes': 'Note (optional)',
      'doc.field.status': 'Status',

      'doc.filter.all': 'All',
      'doc.filter.exportZip': 'Export as ZIP',
      'doc.status.active': 'Active',
      'doc.status.archived': 'Archived',

      'doc.table.title': 'Title',
      'doc.table.type': 'Type',
      'doc.table.cat': 'Category',
      'doc.table.size': 'Size',
      'doc.table.date': 'Date',
      'doc.table.status': 'Status',
      'doc.table.actions': 'Actions',
      'doc.table.loading': 'Loading documents…',

      'doc.type.invoice': 'Invoice',
      'doc.type.contract': 'Contract',
      'doc.type.policy': 'Policy',
      'doc.type.certificate': 'Certificate / proof',
      'doc.type.report': 'Report',
      'doc.type.correspondence': 'Correspondence',
      'doc.type.other': 'Other',

      'doc.cat.financial': 'Finance',
      'doc.cat.legal': 'Legal',
      'doc.cat.operational': 'Operations',
      'doc.cat.hr': 'HR',
      'doc.cat.other': 'Other',

      'doc.action.download': 'Download',
      'doc.action.archive': 'Archive',
      'doc.action.reactivate': 'Reactivate',
      'doc.action.delete': 'Delete',
      'doc.badge.auto': 'Auto',
      'doc.badge.autoTitle': 'Filed automatically by the platform',

      'doc.state.forbidden': 'No access to the document vault.',
      'doc.state.loadError': 'The documents could not be loaded.',
      'doc.state.network': 'Network error.',
      'doc.empty.title': 'No documents yet',
      'doc.empty.manage': 'Upload your first document.',
      'doc.empty.readonly': 'The documents of your organisation appear here.',

      'doc.msg.titleRequired': 'A title is required.',
      'doc.msg.uploading': 'Uploading…',
      'doc.msg.uploadError': 'Error: {detail}',
      'doc.msg.uploaded': 'Document uploaded.',
      'doc.msg.actionFailed': 'Action failed.',
      'doc.msg.deleteConfirm': 'Delete this document permanently?',
      'doc.msg.deleted': 'Deleted.',
      'doc.msg.deleteFailed': 'Deletion failed.'
    });
    function t(k, p){ return TCi18n.t(k, p); }

    var API = "/api", csrf = "", CAN_MANAGE = false;
    /* Rohwerte bleiben die Wahrheit (sie gehen als option[value] an den Server);
       die Beschriftung kommt zur Laufzeit aus dem Woerterbuch. */
    var TYPE_KEYS = ["invoice","contract","policy","certificate","report","correspondence","other"];
    var CAT_KEYS  = ["financial","legal","operational","hr","other"];
    var lastStats = null;

    function esc(s){ if(s==null) return ""; var d=document.createElement("div"); d.textContent=String(s); return d.innerHTML; }
    function fmtBytes(b){ b=Number(b)||0; if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
    function fmtDate(d){ return d ? String(d).substring(0,10) : "–"; }
    function toast(msg, ok){ var el=document.getElementById("toast"); el.textContent=msg; el.className="toast show "+(ok?"toast--ok":"toast--err"); setTimeout(function(){el.classList.remove("show");},3500); }
    async function getCSRF(){ if(csrf) return csrf; try{ var r=await fetch(API+"/csrf",{credentials:"include"}); var d=await r.json(); csrf=d.csrfToken||d.token||""; }catch(e){} return csrf; }
    function label(prefix, key){ return t(prefix+key) || key; }
    function opts(keys, prefix, withAll){
      var h = withAll ? '<option value="">'+esc(t('doc.filter.all'))+'</option>' : '';
      for(var i=0;i<keys.length;i++) h+='<option value="'+keys[i]+'">'+esc(label(prefix,keys[i]))+'</option>';
      return h;
    }
    function parseList(d){ return (d&&d.data&&d.data.items) || (d&&d.items) || (Array.isArray(d)?d:[]); }
    function parseObj(d){ return (d&&d.data) || d || {}; }

    /* Selects neu beschriften, ohne die gewaehlten Rohwerte zu verlieren. */
    function fillSelects(){
      var ids = ["f-type","f-cat","flt-type","flt-cat"], keep = {};
      ids.forEach(function(id){ var el=document.getElementById(id); if(el && el.options.length) keep[id]=el.value; });
      document.getElementById("f-type").innerHTML   = opts(TYPE_KEYS,'doc.type.',false);
      document.getElementById("f-cat").innerHTML    = opts(CAT_KEYS,'doc.cat.',false);
      document.getElementById("flt-type").innerHTML = opts(TYPE_KEYS,'doc.type.',true);
      document.getElementById("flt-cat").innerHTML  = opts(CAT_KEYS,'doc.cat.',true);
      ids.forEach(function(id){ var el=document.getElementById(id); if(el && keep[id]!=null) el.value=keep[id]; });
    }

    function renderStats(s){
      lastStats = s = s || {};
      var html = '';
      html += '<div class="dc-stat"><div class="dc-stat__num">'+(s.total||0)+'</div><div class="dc-stat__label">'+esc(t('doc.stat.total'))+'</div></div>';
      html += '<div class="dc-stat"><div class="dc-stat__num">'+(s.active||0)+'</div><div class="dc-stat__label">'+esc(t('doc.stat.active'))+'</div></div>';
      html += '<div class="dc-stat"><div class="dc-stat__num">'+(s.archived||0)+'</div><div class="dc-stat__label">'+esc(t('doc.stat.archived'))+'</div></div>';
      html += '<div class="dc-stat"><div class="dc-stat__num">'+fmtBytes(s.total_size_bytes)+'</div><div class="dc-stat__label">'+esc(t('doc.stat.storage'))+'</div></div>';
      document.getElementById("dc-stats").innerHTML = html;
    }

    function rowHtml(it){
      var actions = it.file_ref ? '<a href="'+API+'/document-center/'+esc(it.id)+'/download">'+esc(t('doc.action.download'))+'</a>' : '';
      if(CAN_MANAGE){
        actions += '<button onclick="archiveDoc(\''+esc(it.id)+'\')">'+esc(it.status==="archived"?t('doc.action.reactivate'):t('doc.action.archive'))+'</button>';
        actions += '<button onclick="deleteDoc(\''+esc(it.id)+'\')" style="color:var(--ds-danger,#8f2d2d)">'+esc(t('doc.action.delete'))+'</button>';
      }
      var badge = it.status==="archived"
        ? '<span class="dc-badge dc-badge--archived">'+esc(t('doc.status.archived'))+'</span>'
        : '<span class="dc-badge">'+esc(t('doc.status.active'))+'</span>';
      return '<tr>'+
        '<td><strong>'+esc(it.title)+'</strong>'+(it.source&&it.source!=="upload"?' <span class="dc-badge" title="'+esc(t('doc.badge.autoTitle'))+'">'+esc(t('doc.badge.auto'))+'</span>':'')+(it.original_name?'<div style="font-size:11px;color:var(--ds-text-secondary)">'+esc(it.original_name)+'</div>':'')+'</td>'+
        '<td>'+esc(t('doc.type.'+it.document_type)||it.document_type)+'</td>'+
        '<td>'+esc(t('doc.cat.'+it.content_category)||it.content_category)+'</td>'+
        '<td>'+fmtBytes(it.file_size_bytes)+'</td>'+
        '<td>'+fmtDate(it.created_at)+'</td>'+
        '<td>'+badge+'</td>'+
        '<td class="dc-actions" style="text-align:right;white-space:nowrap">'+actions+'</td>'+
      '</tr>';
    }

    async function loadDocs(){
      var p = new URLSearchParams();
      var ty=document.getElementById("flt-type").value, c=document.getElementById("flt-cat").value, st=document.getElementById("flt-status").value;
      if(ty) p.set("document_type",ty); if(c) p.set("content_category",c); if(st) p.set("status",st);
      var tb = document.getElementById("dc-rows");
      try{
        var r = await fetch(API+"/document-center?"+p.toString(),{credentials:"include"});
        if(!r.ok){ tb.innerHTML='<tr><td colspan="7" style="padding:var(--ds-space-5);color:var(--ds-danger,#8f2d2d)">'+esc(r.status===403?t('doc.state.forbidden'):t('doc.state.loadError'))+'</td></tr>'; return; }
        var items = parseList(await r.json());
        if(!items.length){ tb.innerHTML='<tr><td colspan="7" style="padding:var(--ds-space-6);text-align:center;color:var(--ds-text-secondary)"><strong>'+esc(t('doc.empty.title'))+'</strong><br>'+esc(CAN_MANAGE?t('doc.empty.manage'):t('doc.empty.readonly'))+'</td></tr>'; return; }
        tb.innerHTML = items.map(rowHtml).join("");
      }catch(e){ tb.innerHTML='<tr><td colspan="7" style="padding:var(--ds-space-5);color:var(--ds-danger,#8f2d2d)">'+esc(t('doc.state.network'))+'</td></tr>'; }
    }

    async function loadStats(){
      try{ var r=await fetch(API+"/document-center/stats",{credentials:"include"}); if(r.ok) renderStats(parseObj(await r.json())); }catch(e){}
    }

    window.toggleUpload = function(){ var c=document.getElementById("uploadCard"); c.style.display = c.style.display==="none" ? "block" : "none"; };

    window.uploadDoc = async function(){
      var title=(document.getElementById("f-title").value||"").trim();
      var file=document.getElementById("f-file").files[0];
      var msg=document.getElementById("upMsg");
      if(!title){ msg.style.color="var(--ds-danger,#8f2d2d)"; msg.textContent=t('doc.msg.titleRequired'); return; }
      var btn=document.getElementById("btnUpload"); btn.disabled=true; msg.style.color="var(--ds-text-secondary)"; msg.textContent=t('doc.msg.uploading');
      var fd=new FormData();
      fd.append("title",title);
      fd.append("document_type",document.getElementById("f-type").value);
      fd.append("content_category",document.getElementById("f-cat").value);
      if(file) fd.append("file",file);
      var vu=document.getElementById("f-valid").value; if(vu) fd.append("valid_until",vu);
      var rt=document.getElementById("f-retention").value; if(rt) fd.append("retention_delete_at",rt);
      var nt=document.getElementById("f-notes").value; if(nt) fd.append("notes",nt);
      try{
        var tok=await getCSRF();
        var r=await fetch(API+"/document-center",{method:"POST",credentials:"include",headers:{"x-csrf-token":tok},body:fd});
        if(!r.ok){ var e=await r.json().catch(function(){return{};}); msg.style.color="var(--ds-danger,#8f2d2d)"; msg.textContent=t('doc.msg.uploadError',{detail:(e.error&&(e.error.message||e.error))||r.status}); btn.disabled=false; return; }
        toast(t('doc.msg.uploaded'),true);
        document.getElementById("f-title").value=""; document.getElementById("f-file").value=""; document.getElementById("f-notes").value=""; document.getElementById("f-valid").value=""; document.getElementById("f-retention").value="";
        msg.textContent=""; btn.disabled=false; toggleUpload(); loadStats(); loadDocs();
      }catch(e){ msg.style.color="var(--ds-danger,#8f2d2d)"; msg.textContent=t('doc.state.network'); btn.disabled=false; }
    };

    window.archiveDoc = async function(id){
      var tok=await getCSRF();
      try{ var r=await fetch(API+"/document-center/"+id+"/archive",{method:"POST",credentials:"include",headers:{"x-csrf-token":tok}}); if(r.ok){ loadStats(); loadDocs(); } else toast(t('doc.msg.actionFailed'),false); }catch(e){ toast(t('doc.state.network'),false); }
    };

    window.deleteDoc = async function(id){
      if(!confirm(t('doc.msg.deleteConfirm'))) return;
      var tok=await getCSRF();
      try{ var r=await fetch(API+"/document-center/"+id,{method:"DELETE",credentials:"include",headers:{"x-csrf-token":tok}}); if(r.ok){ toast(t('doc.msg.deleted'),true); loadStats(); loadDocs(); } else toast(t('doc.msg.deleteFailed'),false); }catch(e){ toast(t('doc.state.network'),false); }
    };

    window.exportZip = function(){
      var p=new URLSearchParams();
      var ty=document.getElementById("flt-type").value, c=document.getElementById("flt-cat").value, st=document.getElementById("flt-status").value;
      if(ty) p.set("document_type",ty); if(c) p.set("content_category",c); if(st) p.set("status",st);
      window.location.href = API+"/document-center/export/zip?"+p.toString();
    };

    // Init
    fillSelects();
    ["flt-type","flt-cat","flt-status"].forEach(function(id){ document.getElementById(id).addEventListener("change",loadDocs); });

    /* Sprachwechsel: die per innerHTML gebauten Flaechen (Selects, Kennzahlen,
       Tabelle) tragen keine data-i18n-Marker — apply() erreicht sie nicht.
       Deshalb hier nachziehen; die Kennzahlen kommen aus dem letzten Stand,
       ein erneuter Netzabruf waere reine Verschwendung. */
    document.addEventListener("tc:langchange", function(){
      fillSelects();
      if(lastStats) renderStats(lastStats);
      loadDocs();
    });

    (async function(){
      try{ var r=await fetch(API+"/me",{credentials:"include"}); var me=r.ok?await r.json():null; CAN_MANAGE = !!(me && ["owner","admin","finance"].indexOf(me.org_role)>=0); }catch(e){}
      if(CAN_MANAGE) document.getElementById("btnNew").style.display="";
      loadStats(); loadDocs();
    })();
  })();
  </script>
</body>
</html>
