<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/public/js/theme.js"></script>
  <script src="/public/js/i18n.js"></script>
  <title>Matching-Ergebnisse – TempConnect</title>
  <link rel="stylesheet" href="/public/css/enterprise.css"/>
  <style>
    .match-card{padding:var(--ds-space-4,16px);border:1px solid var(--line);border-radius:var(--ds-radius-lg,12px);background:rgba(255,255,255,.025);margin-bottom:12px;transition:border-color .2s}
    .match-card:hover{border-color:rgba(255,255,255,.18)}
    .match-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
    .match-score{font-size:28px;font-weight:800;color:var(--brand)}
    .match-score small{font-size:12px;color:var(--muted);font-weight:600}
    .score-bars{display:flex;flex-direction:column;gap:6px;margin:10px 0}
    .score-bar{display:flex;align-items:center;gap:8px;font-size:12px}
    .score-bar__label{width:90px;color:var(--muted);flex-shrink:0;text-align:right}
    .score-bar__track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
    .score-bar__fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),var(--brand2,#7c3aed));transition:width .4s}
    .score-bar__pts{width:50px;font-weight:700;color:var(--text);font-size:11px}
    .match-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
    .match-actions{display:flex;gap:8px;margin-top:10px}

    /* P4.2 — Klartext-Begruendung ueber der Score-Zerlegung */
    .match-why{display:flex;align-items:center;flex-wrap:wrap;gap:var(--ds-space-2,8px);margin:0 0 var(--ds-space-2,8px);font-size:13px}
    .match-why__badge{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:3px 8px;border-radius:var(--ds-radius-sm,6px);background:var(--ds-warning-muted);color:var(--ds-warning)}
    .match-why--excellent .match-why__badge,
    .match-why--good .match-why__badge{background:var(--ds-success-muted);color:var(--ds-success)}
    .match-why--weak .match-why__badge{background:var(--ds-danger-muted);color:var(--ds-danger)}
    .match-why__text{color:var(--text)}
    .match-gaps{font-size:12px;color:var(--muted);margin:0 0 var(--ds-space-2,8px)}
    .score-bar--missing .score-bar__fill{background:var(--ds-danger)}
    .score-bar--missing .score-bar__label,.score-bar--missing .score-bar__pts{color:var(--muted)}
    .score-bar--full .score-bar__fill{background:linear-gradient(90deg,var(--ds-success),var(--brand))}

    /* EDITORIAL — warme Creme-Karten statt White-Alpha (dark/light/ultra byte-identisch) */
    [data-theme="editorial"] .match-card{background:#ebe4d3;border-color:#d4cab3}
    [data-theme="editorial"] .match-card:hover{border-color:rgba(31,58,46,.4)}
    [data-theme="editorial"] .score-bar__track{background:rgba(31,58,46,.10)}
  </style>
</head>
<body data-sla-guard="sla_access">
  <div id="paywall" class="wrap" style="display:none">
    <nav class="ds-topbar"><div class="ds-topbar__brand"><span class="ds-topbar__brand-dot"></span>TempConnect</div><div class="ds-topbar__nav"><a href="/" class="ds-btn">Startseite</a></div></nav>
    <div class="paywall-box">
      <h2>Bereich nicht verfuegbar</h2>
      <p>Aktueller Plan: <span id="paywall-current-plan" class="paywall-plan">–</span></p>
      <a id="paywall-cta" href="/public/sla_abo.html" class="btn primary">Abo ansehen</a>
    </div>
  </div>

  <div id="main-content" class="wrap">
    <div id="tc-shell"></div>

    <div class="ds-page-header">
      <div class="ds-page-header__content">
        <h1 class="ds-page-title" id="pageTitle">Matching-Ergebnisse</h1>
        <p class="ds-page-subtitle" id="pageSubtitle">Multi-Faktor-Scoring: Rolle, Skills, Standort, Verfuegbarkeit, Verifizierung, Vendor Pool.</p>
      </div>
    </div>

    <div id="matchInfo" style="margin-bottom:var(--ds-space-4,16px)"></div>
    <div id="matches"></div>
    <div id="emptyState" style="display:none" class="empty">Keine passenden Ergebnisse gefunden. Versuchen Sie andere Suchkriterien.</div>
  </div>

  <script src="/public/js/planFeatures.js"></script>
  <script src="/public/js/slaGuard.js"></script>
  <script>
    var API = "/api";
    function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
    function fmtDate(d){return d?String(d).substring(0,10):"–"}

    // Fallback-Beschriftung nur noch fuer Altdaten ohne Server-Erklaerung (P4.2:
    // Labels + Formulierung gehoeren dem Backend, sonst driftet jede Seite fuer sich).
    var FACTOR_LABELS={role:"Rolle",skills:"Skills",location:"Standort",availability:"Verfuegbarkeit",verified:"Verifizierung",vendorPool:"Lieferantenpool",urgency:"Dringlichkeit",reputation:"Historie",smartRank:"Smart Rank",preferredFirst:"Bevorzugt",workerCount:"Personalstaerke",compliance:"Compliance",rate:"Preisrahmen"};

    function renderScoreBars(reasons,explanation){
      var axes=(explanation&&explanation.axes&&explanation.axes.length)
        ? explanation.axes
        : (reasons||[]).map(function(r){
            return {label:FACTOR_LABELS[r.factor]||r.factor,points:r.points,max:r.max,
                    pct:r.max>0?Math.round((r.points/r.max)*100):0,
                    status:r.points>0?"partial":"missing",phrase:r.detail};
          });
      if(!axes.length)return"";
      return '<div class="score-bars">'+axes.map(function(a){
        var cls=a.status==="missing"?" score-bar--missing":(a.status==="full"?" score-bar--full":"");
        var why=a.phrase?' title="'+esc(a.phrase)+'"':'';
        return '<div class="score-bar'+cls+'"'+why+'><span class="score-bar__label">'+esc(a.label)+'</span>'+
          '<div class="score-bar__track"><div class="score-bar__fill" style="width:'+a.pct+'%"></div></div>'+
          '<span class="score-bar__pts">'+a.points+'/'+a.max+'</span></div>';
      }).join("")+'</div>';
    }

    // Klartext-Begruendung: warum dieser Treffer? (deterministisch, vom Server)
    function renderWhy(explanation){
      if(!explanation)return"";
      var q=explanation.quality||"fair";
      var out='<div class="match-why match-why--'+esc(q)+'">'+
        '<span class="match-why__badge">'+esc(explanation.quality_label||"")+'</span>'+
        '<span class="match-why__text">'+esc(explanation.summary||"")+'</span></div>';
      if(explanation.gaps&&explanation.gaps.length){
        out+='<div class="match-gaps">Einschränkung: '+esc(explanation.gaps.slice(0,2).join(", "))+'</div>';
      }
      return out;
    }

    function renderMatchCard(m,type){
      var entity=m.entity||m.capacity_post||m;
      var explanation=m.explanation||null;
      var score=(explanation&&explanation.score)||m.score||m.match_score||0;
      var reasons=m.reasons||[];
      var title=entity.title||entity.role||"–";
      var city=entity.location_city||"–";
      var role=entity.role||"–";
      var from=fmtDate(entity.availability_from||entity.start_date);
      var to=fmtDate(entity.availability_to||entity.end_date);

      var actions='';
      if(type==='capacity'){
        // Viewing matches for a capacity entry ? show requisitions/demands
        actions='<a href="/public/company_requests.html" class="btn primary" style="font-size:12px;padding:6px 12px">Details</a>';
      }else{
        // Viewing matches for a demand ? show capacity posts
        var entryId=entity.id||'';
        actions='<a href="/public/capacity_exchange_feed.html" class="btn" style="font-size:12px;padding:6px 12px">Im Feed ansehen</a>';
        actions+=' <a href="/public/sla_angebote.html?demand_id='+encodeURIComponent(entryId)+'" class="btn primary" style="font-size:12px;padding:6px 12px">Angebot erstellen</a>';
      }

      return '<div class="match-card">'+
        '<div class="match-header">'+
        '<div><div style="font-size:15px;font-weight:700">'+esc(title)+'</div><div class="match-meta"><span>Rolle: '+esc(role)+'</span><span>Stadt: '+esc(city)+'</span><span>'+from+' – '+to+'</span></div></div>'+
        '<div class="match-score">'+score+'<small>/100</small></div>'+
        '</div>'+
        renderWhy(explanation)+
        renderScoreBars(reasons,explanation)+
        '<div class="match-actions">'+actions+'</div>'+
        '</div>';
    }

    // Kein ?id= -> Analyzer-Auswahl: eigene Eintraege rollenabhaengig laden, dann Matching.
    async function renderPicker(){
      document.getElementById("pageTitle").textContent="Matching-Analyzer";
      document.getElementById("pageSubtitle").textContent="Waehlen Sie einen Ihrer Eintraege – wir berechnen die passendsten Treffer per Multi-Faktor-Scoring.";
      var container=document.getElementById("matches");
      container.innerHTML='<p style="color:var(--muted)">Lade Ihre Eintraege…</p>';
      var me=null;
      try{ var rm=await fetch(API+"/me",{credentials:"include"}); me=rm.ok?await rm.json():null; }catch(e){}
      var role=me&&me.role, cfg;
      if(role==="agency") cfg={type:"capacity",url:API+"/capacity-exchange/entries?limit=50",noun:"Personalangebot",create:"/public/capacity_exchange_form.html",createLabel:"Personal einstellen"};
      else if(role==="company") cfg={type:"demand",url:API+"/marketplace/demand-requests?limit=50",noun:"Anfrage",create:"/public/marketplace_demand_create.html",createLabel:"Arbeitsplatz anbieten"};
      else{ container.innerHTML='<p class="empty">Das Matching steht Unternehmen und Zeitarbeitsfirmen zur Verfuegung.</p>'; return; }
      var rows=[];
      try{ var r=await fetch(cfg.url,{credentials:"include"}); if(r.ok){ var d=await r.json(); rows=Array.isArray(d)?d:(d.items||(d.data&&d.data.items)||[]); } }catch(e){}
      if(!rows.length){
        container.innerHTML='<div class="empty" style="text-align:center;padding:var(--ds-space-6,24px)"><p style="font-size:15px;font-weight:700">Noch keine Eintraege</p><p style="font-size:13px;color:var(--muted);margin:6px 0 14px">Legen Sie zuerst ein '+esc(cfg.noun)+' an – dann zeigt der Analyzer die besten Treffer.</p><a href="'+cfg.create+'" class="btn primary">'+esc(cfg.createLabel)+'</a></div>';
        return;
      }
      document.getElementById("matchInfo").innerHTML='<div style="font-size:13px;color:var(--muted)">Waehlen Sie ein/e '+esc(cfg.noun)+' fuer die Matching-Analyse:</div>';
      container.innerHTML=rows.map(function(it){
        var label=esc(it.title||it.role||"Eintrag"), sub=[];
        if(it.role&&it.role!==it.title) sub.push(esc(it.role));
        if(it.location_city) sub.push(esc(it.location_city));
        if(it.status) sub.push(esc(it.status));
        return '<button class="match-card" style="width:100%;text-align:left;cursor:pointer;display:block;font:inherit;color:inherit" onclick="pickEntry(\''+esc(it.id)+'\',\''+cfg.type+'\')">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">'+
          '<div><div style="font-size:15px;font-weight:700">'+label+'</div>'+(sub.length?'<div class="match-meta" style="margin:4px 0 0"><span>'+sub.join(" · ")+'</span></div>':'')+'</div>'+
          '<span class="btn primary" style="font-size:12px;padding:6px 12px;pointer-events:none">Matching ansehen →</span>'+
          '</div></button>';
      }).join("");
    }
    function pickEntry(id,type){
      history.replaceState(null,"","?id="+encodeURIComponent(id)+"&type="+encodeURIComponent(type));
      document.getElementById("matchInfo").innerHTML="";
      document.getElementById("emptyState").style.display="none";
      loadMatches();
    }

    async function loadMatches(){
      var params=new URLSearchParams(window.location.search);
      var type=params.get("type")||"capacity"; // capacity or demand
      var id=params.get("id");
      if(!id){renderPicker();return;}

      var url;
      if(type==="capacity"){
        url=API+"/capacity-exchange/entries/"+encodeURIComponent(id)+"/matches";
        document.getElementById("pageTitle").textContent="Matching fuer Personalangebot";
        document.getElementById("pageSubtitle").textContent="Passende Arbeitsplatzangebote für Ihr Personalangebot.";
      }else{
        url=API+"/marketplace/demand-requests/"+encodeURIComponent(id)+"/matches";
        document.getElementById("pageTitle").textContent="Matching fuer Nachfrage";
        document.getElementById("pageSubtitle").textContent="Passendes Personal für Ihre Anfrage.";
      }

      var container=document.getElementById("matches");
      container.innerHTML='<p style="color:var(--muted)">Matching laeuft...</p>';

      try{
        var r=await fetch(url,{credentials:"include"});
        if(!r.ok){container.innerHTML='<p style="color:var(--bad)">Fehler: '+r.status+'</p>';return;}
        var data=await r.json();
        var items=Array.isArray(data)?data:(data.data&&data.data.items)||data.items||data.matches||[];
        if(!items.length){container.innerHTML='';document.getElementById("emptyState").style.display="block";return;}

        document.getElementById("matchInfo").innerHTML='<div style="font-size:13px;color:var(--muted)">'+items.length+' Treffer gefunden</div>';
        container.innerHTML=items.map(function(m){return renderMatchCard(m,type)}).join("");
      }catch(e){
        container.innerHTML='<p style="color:var(--bad)">Fehler: '+esc(e.message)+'</p>';
      }
    }
    loadMatches();
  </script>
  <script src="/public/js/pageShell.js"></script>
  <script src="/public/js/notifications.js"></script>
  <div id="tc-footer" data-tc-footer></div>
  <script src="/public/js/footer.js"></script>
<script src="/public/js/demoBanner.js" defer></script>
<script src="/public/js/onboardingWizard.js" defer></script><script src="/public/js/contextHints.js"></script>
<script src="/public/js/breadcrumb.js" defer></script>
</body>
</html>
