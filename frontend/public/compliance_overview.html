<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/public/js/theme.js"></script>
  <script src="/public/js/i18n.js"></script>
  <title data-i18n="apv.b.docTitle">Compliance – TempConnect</title>
  <link rel="stylesheet" href="/public/css/enterprise.css"/>
  <style>
    .filter-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .filter-row select { width:auto; margin:0; min-width:140px; }
    .tl { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
    .tl-green { background:#34d399; box-shadow:0 0 6px rgba(52,211,153,.4); }
    .tl-yellow { background:#fbbf24; box-shadow:0 0 6px rgba(251,191,36,.4); }
    .tl-red { background:#f87171; box-shadow:0 0 6px rgba(248,113,113,.4); }
    .tl-grey { background:rgba(255,255,255,.2); }
    .doc-status { font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; display:inline-block; }
    .ds-verified { color:#c8ffe7; border:1px solid rgba(57,217,138,.4); background:rgba(57,217,138,.1); }
    .ds-pending { color:#fff3c2; border:1px solid rgba(255,204,0,.4); background:rgba(255,204,0,.1); }
    .ds-rejected { color:#ffd0d8; border:1px solid rgba(255,92,122,.4); background:rgba(255,92,122,.1); }
    .ds-expired { color:#ffd0d8; border:1px solid rgba(255,92,122,.6); background:rgba(255,92,122,.2); }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
    .stat-cell { padding:14px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); text-align:center; }
    .stat-cell b { display:block; font-size:22px; margin-bottom:2px; }
    .stat-cell span { font-size:11px; color:var(--ds-text-secondary,#8d9bba); }
    .doc-row { transition:background .15s; } .doc-row:hover { background:rgba(255,255,255,.04); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .form-full { grid-column:1/-1; }
    .act-btn { padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04); color:#eaeff8; font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; margin-right:4px; }
    .act-btn:hover { background:rgba(255,255,255,.1); }
    .act-btn.good { border-color:rgba(52,211,153,.3); color:#34d399; }
    .act-btn.bad { border-color:rgba(248,113,113,.3); color:#f87171; }
    .act-btn.dl { border-color:rgba(74,158,255,.3); color:#4a9eff; }
    .context-badge { display:none; background:rgba(74,158,255,.08); border:1px solid rgba(74,158,255,.2); border-radius:8px; padding:10px 14px; font-size:13px; margin:0 0 16px; color:var(--ds-text-secondary); }
    .page-state { display:none; margin:0 0 16px; padding:12px 14px; border-radius:10px; border:1px solid transparent; }
    .page-state--info { display:block; background:rgba(74,158,255,.08); border-color:rgba(74,158,255,.22); }
    .page-state--warn { display:block; background:rgba(255,204,0,.10); border-color:rgba(255,204,0,.24); }
    .page-state--bad { display:block; background:rgba(255,92,122,.10); border-color:rgba(255,92,122,.22); }
    .page-state--good { display:block; background:rgba(52,211,153,.10); border-color:rgba(52,211,153,.22); }
    .page-state__title { font-size:13px; font-weight:700; margin-bottom:4px; }
    .page-state__text { font-size:12px; color:var(--ds-text-secondary); }
    .section-note { padding:12px 14px; border-radius:10px; border:1px dashed rgba(255,255,255,.12); color:var(--ds-text-secondary); font-size:12px; background:rgba(255,255,255,.02); }
    .risk-summary { margin-bottom:16px; padding:14px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); }
    .risk-summary__actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .file-drop { border:2px dashed rgba(255,255,255,.12); border-radius:10px; padding:20px; text-align:center; cursor:pointer; transition:border-color .2s; margin-top:8px; }
    .file-drop:hover { border-color:#4a9eff; }
    .file-drop .name { font-weight:700; color:#34d399; margin-top:6px; font-size:13px; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; }
    .modal.show { display:flex; }
    .panel { background:var(--ds-bg,#0d1117); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="tc-shell"></div>
    <div class="ds-page-header">
      <div class="ds-page-header__content">
        <h1 class="ds-page-title" data-i18n="apv.b.page.title">Compliance</h1>
        <p class="ds-page-subtitle" data-i18n="apv.b.page.subtitle">Dokumente mit Ampellogik verwalten, Ablauftermine ueberwachen und Verifizierungen durchfuehren.</p>
      </div>
      <div class="ds-page-header__actions">
        <button id="complianceUploadButton" class="ds-btn ds-btn--primary" onclick="showUpload()" data-i18n="apv.b.action.upload">+ Dokument hochladen</button>
      </div>
    </div>
    <div id="complianceContextBadge" class="context-badge"></div>
    <div id="complianceState" class="page-state"></div>
    <div id="rateCardRiskBox"></div>
    <div class="stat-grid" id="statsGrid"><div class="stat-cell"><b>&ndash;</b><span data-i18n="apv.b.loading">Lade&hellip;</span></div></div>
    <!-- Filter: option[value] bleibt unveraendert (Query-Parameter an den Server). -->
    <div class="filter-row">
      <select id="fDocType" onchange="loadDocs()"><option value="" data-i18n="apv.b.filter.allTypes">Alle Typen</option><option value="aueg_erlaubnis" data-i18n="apv.b.docType.aueg_erlaubnis">AUeG-Erlaubnis</option><option value="unbedenklichkeit" data-i18n="apv.b.docType.unbedenklichkeit">Unbedenklichkeit</option><option value="uvv_nachweis" data-i18n="apv.b.docType.uvv_nachweis">UVV-Nachweis</option><option value="versicherung" data-i18n="apv.b.docType.versicherung">Versicherung</option><option value="zertifikat" data-i18n="apv.b.docType.zertifikat">Zertifikat</option><option value="gewerbeanmeldung" data-i18n="apv.b.docType.gewerbeanmeldung">Gewerbeanmeldung</option><option value="handelsregister" data-i18n="apv.b.docType.handelsregister">Handelsregister</option><option value="datenschutz" data-i18n="apv.b.docType.datenschutz">Datenschutz</option><option value="arbeitssicherheit" data-i18n="apv.b.docType.arbeitssicherheit">Arbeitssicherheit</option><option value="qualifikation" data-i18n="apv.b.docType.qualifikation">Qualifikation</option><option value="sonstige" data-i18n="apv.b.docType.sonstige">Sonstige</option></select>
      <select id="fDocStatus" onchange="loadDocs()"><option value="" data-i18n="apv.b.filter.allStatus">Alle Status</option><option value="pending" data-i18n="apv.b.docStatus.pending">Ausstehend</option><option value="verified" data-i18n="apv.b.docStatus.verified">Verifiziert</option><option value="rejected" data-i18n="apv.b.docStatus.rejected">Abgelehnt</option><option value="expired" data-i18n="apv.b.docStatus.expired">Abgelaufen</option></select>
    </div>
    <table class="table"><thead><tr><th data-i18n="apv.b.th.trafficLight">Ampel</th><th data-i18n="apv.b.th.type">Typ</th><th data-i18n="apv.b.th.name">Name</th><th data-i18n="apv.b.th.status">Status</th><th data-i18n="apv.b.th.validUntil">Gueltig bis</th><th data-i18n="apv.b.th.organization">Organisation</th><th data-i18n="apv.b.th.actions">Aktionen</th></tr></thead><tbody id="docBody"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--ds-text-secondary)" data-i18n="apv.b.loading">Lade&hellip;</td></tr></tbody></table>
    <!-- Kein data-i18n auf Titel/Text des Leerzustands: setEmptyState() setzt beide
         situationsabhaengig ueber t() (Zugriff, Drilldown, Ladefehler). -->
    <div id="emptyMsg" class="ds-empty" style="display:none"><div class="ds-empty__title">Keine Compliance-Dokumente</div><div class="ds-empty__text">Laden Sie Ihr erstes Dokument hoch.</div><button id="emptyUploadAction" class="ds-btn ds-btn--primary" onclick="showUpload()" style="margin-top:12px" data-i18n="apv.b.action.upload">+ Dokument hochladen</button></div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal" onclick="if(event.target===this)closeUpload()">
    <div class="panel" style="max-width:520px;width:92vw">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0;font-size:18px" data-i18n="apv.b.upload.title">Dokument hochladen</h2><button onclick="closeUpload()" style="background:none;border:none;color:var(--ds-text-secondary);font-size:18px;cursor:pointer" title="Schliessen" data-i18n-title="apv.b.upload.close" aria-label="Schliessen" data-i18n-aria="apv.b.upload.close">&times;</button></div>
      <form id="uploadForm" onsubmit="submitUpload(event)">
        <div class="form-grid">
          <div><label data-i18n="apv.b.upload.docType">Dokumenttyp *</label><select id="uDocType" required><option value="" data-i18n="apv.b.upload.choose">Bitte waehlen</option><option value="aueg_erlaubnis" data-i18n="apv.b.docType.aueg_erlaubnis">AUeG-Erlaubnis</option><option value="unbedenklichkeit" data-i18n="apv.b.docType.unbedenklichkeit">Unbedenklichkeit</option><option value="uvv_nachweis" data-i18n="apv.b.docType.uvv_nachweis">UVV-Nachweis</option><option value="versicherung" data-i18n="apv.b.docType.versicherung">Versicherung</option><option value="zertifikat" data-i18n="apv.b.docType.zertifikat">Zertifikat</option><option value="gewerbeanmeldung" data-i18n="apv.b.docType.gewerbeanmeldung">Gewerbeanmeldung</option><option value="handelsregister" data-i18n="apv.b.docType.handelsregister">Handelsregister</option><option value="datenschutz" data-i18n="apv.b.docType.datenschutz">Datenschutz</option><option value="arbeitssicherheit" data-i18n="apv.b.docType.arbeitssicherheit">Arbeitssicherheit</option><option value="qualifikation" data-i18n="apv.b.docType.qualifikation">Qualifikation</option><option value="sonstige" data-i18n="apv.b.docType.sonstige">Sonstige</option></select></div>
          <div><label data-i18n="apv.b.upload.name">Name *</label><input id="uDocName" required maxlength="200" placeholder="z.B. AUeG 2026" data-i18n-ph="apv.b.upload.namePh"/></div>
          <div><label data-i18n="apv.b.upload.validFrom">Gueltig von</label><input id="uFrom" type="date"/></div>
          <div><label data-i18n="apv.b.upload.validUntil">Gueltig bis</label><input id="uUntil" type="date"/></div>
          <div class="form-full"><label data-i18n="apv.b.upload.file">Datei (PDF, PNG, JPG &mdash; max. 10 MB)</label><div class="file-drop" id="fileDrop" onclick="document.getElementById('uFile').click()"><div style="font-size:13px;color:var(--ds-text-secondary)" data-i18n="apv.b.upload.drop">Klicken oder Datei ziehen</div><div class="name" id="fileName" style="display:none"></div></div><input type="file" id="uFile" accept=".pdf,.png,.jpg,.jpeg,.webp" style="display:none" onchange="onFileSelect(this)"/></div>
          <div class="form-full"><label data-i18n="apv.b.upload.notes">Notizen</label><textarea id="uNotes" rows="2" maxlength="2000" placeholder="Optional&hellip;" data-i18n-ph="apv.b.upload.notesPh"></textarea></div>
        </div>
        <!-- Kein data-i18n auf #btnUpload: submitUpload() wechselt die Beschriftung (ueber t()). -->
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button type="button" class="ds-btn" onclick="closeUpload()" data-i18n="apv.b.upload.cancel">Abbrechen</button><button type="submit" class="ds-btn ds-btn--primary" id="btnUpload">Hochladen</button></div>
      </form>
    </div>
  </div>

<script src="/public/js/surfaceAccess.js"></script>

    var until=d.valid_until?new Date(d.valid_until).toLocaleDateString(cDateLocale()):'–';
    var act='';
    if(d.file_ref)act+='<button class="act-btn dl" onclick="window.open(\'/api/compliance-documents/'+esc(d.id)+'/download\',\'_blank\')" title="'+esc(ct('apv.b.act.download'))+'">&darr;</button>';
    if(d.status==='pending'&&complianceAccess.canVerify){act+='<button class="act-btn good" onclick="verifyDoc(\''+esc(d.id)+'\')" title="'+esc(ct('apv.b.act.verify'))+'">&#10003;</button>';act+='<button class="act-btn bad" onclick="rejectDoc(\''+esc(d.id)+'\')" title="'+esc(ct('apv.b.act.reject'))+'">&#10007;</button>';}
    if(complianceAccess.canDelete)act+='<button class="act-btn" onclick="deleteDoc(\''+esc(d.id)+'\')" title="'+esc(ct('apv.b.act.delete'))+'" style="opacity:.4">&times;</button>';
    return '<tr class="doc-row"><td><span class="tl tl-'+tl+'"></span></td><td style="font-size:12px">'+esc(docTypeLabel(d.doc_type))+'</td><td><strong>'+esc(d.doc_name||'–')+'</strong></td><td><span class="doc-status '+sc+'">'+esc(docStatusLabel(d.status))+'</span></td><td style="font-size:12px;color:var(--ds-text-secondary)">'+esc(until)+'</td><td style="font-size:12px;color:var(--ds-text-secondary)">'+esc(d.org_name||'–')+'</td><td style="white-space:nowrap">'+act+'</td></tr>';
  }).join('');
  renderPartialOrModeState(partialIssues);
}

/** Teil-Ausfall vor Read-only vor "alles gut" — an beiden Ausgaengen von loadDocs identisch. */
function renderPartialOrModeState(partialIssues){
  if(partialIssues&&partialIssues.length)showComplianceState('warn',ct('apv.b.state.partialTitle'),ct('apv.b.state.partialText',{parts:partialIssues.join(ct('apv.b.part.join'))}));
  else if(complianceAccess.mode==='read_only')showComplianceState('info',ct('apv.b.state.readOnlyTitle'),complianceAccess.reason||ct('apv.b.state.readOnlyText'));
  else clearComplianceState();
}

function showUpload(){if(!complianceAccess.canUpload){showComplianceState('info',ct('apv.b.upload.blockedTitle'),ct('apv.b.upload.blockedText'));return;}document.getElementById('uploadModal').classList.add('show');}
function closeUpload(){document.getElementById('uploadModal').classList.remove('show');}
function onFileSelect(i){var n=document.getElementById('fileName');if(i.files&&i.files[0]){n.textContent=ct('apv.b.upload.fileSize',{name:i.files[0].name,size:(i.files[0].size/1024/1024).toFixed(1)});n.style.display='';}else n.style.display='none';}
(function(){var d=document.getElementById('fileDrop');if(!d)return;d.addEventListener('dragover',function(e){e.preventDefault();d.style.borderColor='#4a9eff';});d.addEventListener('dragleave',function(){d.style.borderColor='';});d.addEventListener('drop',function(e){e.preventDefault();d.style.borderColor='';var i=document.getElementById('uFile');if(e.dataTransfer.files.length){i.files=e.dataTransfer.files;onFileSelect(i);}});})();

async function submitUpload(e){
  if(!complianceAccess.canUpload){showComplianceState('info',ct('apv.b.upload.blockedTitle'),ct('apv.b.upload.blockedText'));return;}
  e.preventDefault();var csrf=await getCsrf();var fd=new FormData();
  fd.append('doc_type',document.getElementById('uDocType').value);
  fd.append('doc_name',document.getElementById('uDocName').value.trim());
  var f=document.getElementById('uFrom').value,u=document.getElementById('uUntil').value,n=document.getElementById('uNotes').value;
  if(f)fd.append('valid_from',f);if(u)fd.append('valid_until',u);if(n)fd.append('notes',n);
  var fi=document.getElementById('uFile');if(fi.files[0])fd.append('file',fi.files[0]);
  document.getElementById('btnUpload').disabled=true;document.getElementById('btnUpload').textContent=ct('apv.b.upload.submitting');
  try{var r=await fetch('/api/compliance-documents',{method:'POST',credentials:'include',headers:{'x-csrf-token':csrf},body:fd});
    if(r.ok){closeUpload();document.getElementById('uploadForm').reset();document.getElementById('fileName').style.display='none';showComplianceState('good',ct('apv.b.upload.okTitle'),ct('apv.b.upload.okText'));loadDocs();}
    else{var d=await r.json();showComplianceState('bad',ct('apv.b.upload.failTitle'),parseApiError(d,ct('apv.b.upload.failText')));}
  }catch(err){showComplianceState('bad',ct('apv.b.upload.failTitle'),ct('apv.b.upload.failNetwork'));}
  finally{document.getElementById('btnUpload').disabled=false;document.getElementById('btnUpload').textContent=ct('apv.b.upload.submit');}
}
async function verifyDoc(id){if(!complianceAccess.canVerify){showComplianceState('info',ct('apv.b.verify.blockedTitle'),ct('apv.b.verify.blockedText'));return;}if(!confirm(ct('apv.b.verify.confirm')))return;var r=await apiMut('POST','/compliance-documents/'+id+'/verify',{});if(r&&!r.error){showComplianceState('good',ct('apv.b.verify.okTitle'),ct('apv.b.verify.okText'));loadDocs();}else showComplianceState('bad',ct('apv.b.verify.failTitle'),parseApiError(r,ct('apv.b.verify.failText')));}
async function rejectDoc(id){if(!complianceAccess.canVerify){showComplianceState('info',ct('apv.b.reject.blockedTitle'),ct('apv.b.reject.blockedText'));return;}var reason=prompt(ct('apv.b.reject.prompt'));if(reason===null)return;var r=await apiMut('POST','/compliance-documents/'+id+'/reject',{reason:reason||null});if(r&&!r.error){showComplianceState('good',ct('apv.b.reject.okTitle'),ct('apv.b.reject.okText'));loadDocs();}else showComplianceState('bad',ct('apv.b.reject.failTitle'),parseApiError(r,ct('apv.b.reject.failText')));}
async function deleteDoc(id){if(!complianceAccess.canDelete){showComplianceState('info',ct('apv.b.delete.blockedTitle'),ct('apv.b.delete.blockedText'));return;}if(!confirm(ct('apv.b.delete.confirm')))return;var r=await apiMut('DELETE','/compliance-documents/'+id,{});if(r&&!r.error){showComplianceState('good',ct('apv.b.delete.okTitle'),ct('apv.b.delete.okText'));loadDocs();}else showComplianceState('bad',ct('apv.b.delete.failTitle'),parseApiError(r,ct('apv.b.delete.failText')));}
