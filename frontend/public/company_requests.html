<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/public/js/theme.js"></script>
  <title>Meine Anfragen – TempConnect</title>
  <link rel="stylesheet" href="/public/css/enterprise.css"/>
  <link rel="stylesheet" href="/public/css/approval-badges.css"/>
  <style>.item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);}.item-row:last-child{border-bottom:none;}</style>
</head>
<body data-sla-guard="sla_access">
  <div id="paywall" class="wrap" style="display:none">
    <nav class="ds-topbar"><div class="ds-topbar__brand"><span class="ds-topbar__brand-dot"></span>TempConnect</div><div class="ds-topbar__nav"><a href="/" class="ds-btn">Startseite</a></div></nav>
    <div class="paywall-box">
      <h2>Bereich nicht verfügbar</h2>
      <p>Das Feature &quot;<span id="paywall-feature-name">Pulse-Bereich</span>&quot; ist mit deinem aktuellen Plan nicht nutzbar.</p>
      <p>Aktueller Plan: <span id="paywall-current-plan" class="paywall-plan">–</span></p>
      <a id="paywall-cta" href="/public/sla_abo.html" class="btn primary">Abo ansehen</a>
    </div>
  </div>
  <div id="main-content" class="wrap">
    <div id="tc-shell"></div>
    <h1>Meine Anfragen</h1>
    <p style="color:var(--muted);margin:0 0 16px">Pulse-Timer und Compliance-Ampel pro Anfrage. Klicken Sie auf Details für Countdown, Gründe und Lieferanten-Bewertung.</p>
    <div id="list"></div>
  </div>
  <script src="/public/js/planFeatures.js"></script>
  <script src="/public/js/slaGuard.js"></script>
  <script>
    var API="/api";
    var STATUS_MAP={SENT:{badge:"pending",label:"Gesendet"},ACCEPTED:{badge:"approved",label:"Angenommen"},DECLINED:{badge:"rejected",label:"Abgelehnt"},FILLED:{badge:"completed",label:"Besetzt"},FINALIZED:{badge:"completed",label:"Abgeschlossen"},CANCELED:{badge:"expired",label:"Storniert"},CREATED:{badge:"pending",label:"Erstellt"},OFFER_SENT:{badge:"in-review",label:"Angebot gesendet"},CONFIRMED:{badge:"approved",label:"Best\u00e4tigt"},ASSIGNMENT_STARTED:{badge:"in-review",label:"Einsatz gestartet"},COMPLETED:{badge:"completed",label:"Abgeschlossen"}};
    function esc(s){if(!s)return "";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
    function api(path){return fetch(API+path,{credentials:"include"});}
    function checkAuth(r){if(r.status===401){window.location.href="/";return false;}return true;}
    function slaBadge(respondBy,status){if(status==="BREACHED")return '<span class="approval-badge approval-badge--rejected"><span class="approval-badge__dot"></span>Pulse \u00fcberschritten</span>';if(!respondBy)return '';var min=Math.floor((new Date(respondBy).getTime()-Date.now())/60000);if(min<=0)return '<span class="approval-badge approval-badge--rejected"><span class="approval-badge__dot"></span>Abgelaufen</span>';if(min<=15)return '<span class="approval-badge approval-badge--correction"><span class="approval-badge__dot"></span>'+min+' min</span>';return '<span class="approval-badge approval-badge--approved"><span class="approval-badge__dot"></span>'+min+' min</span>';}
    function compBadge(s){if(!s)return "";var c=(s+"").toUpperCase(),cls=c==="GREEN"?"approved":c==="YELLOW"?"correction":"rejected";return '<span class="approval-badge approval-badge--'+cls+'"><span class="approval-badge__dot"></span>'+esc(s)+'</span>';}
    function reqStatusBadge(s){var m=STATUS_MAP[s]||{badge:"pending",label:s||"?"};return '<span class="approval-badge approval-badge--'+m.badge+'"><span class="approval-badge__dot"></span>'+esc(m.label)+'</span>';}
    api("/my/requests/sent").then(function(r){if(!checkAuth(r))return;return r.ok?r.json():null;}).then(function(data){var list=document.getElementById("list");if(!data||!data.length){list.innerHTML="<div class=\"empty\">Noch keine Anfragen. Nutzen Sie die Personalsuche oder die Startseite, um Anfragen zu senden.</div>";return;}var html="";data.forEach(function(r){var role=esc(r.role||r.capacity_role||r.listing_category||"Anfrage");var partner=esc(r.receiver_company||r.receiver_email||"Partner");html+='<div class="card"><div class="item-row"><div>'+compBadge(r.compliance_status)+' '+slaBadge(r.sla_respond_by,r.sla_status)+' <strong>'+role+'</strong> &bull; '+partner+' '+reqStatusBadge(r.status)+'</div><a href="/public/request_detail.html?id='+encodeURIComponent(r.id)+'" class="btn primary">Details (Pulse &amp; Scorecard)</a></div></div>';});list.innerHTML=html;});
  </script>
  <script src="/public/js/pageShell.js"></script>
  <div id="tc-footer" data-tc-footer></div>
  <script src="/public/js/footer.js"></script>
<script src="/public/js/demoBanner.js" defer></script>
<script src="/public/js/onboardingWizard.js" defer></script><script src="/public/js/notifications.js" defer></script>
<script src="/public/js/contextHints.js"></script>
<script src="/public/js/breadcrumb.js" defer></script>
</body>
</html>
