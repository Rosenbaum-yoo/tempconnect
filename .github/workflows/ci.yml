name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_ENV: test
  POSTGRES_DB: tempconnect_test
  POSTGRES_USER: tempconnect
  POSTGRES_PASSWORD: tempconnect_pw
  DATABASE_URL: postgres://tempconnect:tempconnect_pw@localhost:5432/tempconnect_test
  SESSION_SECRET: ci_test_secret
  CORS_ORIGIN: http://localhost:8080
  BASE_URL: http://localhost:8080
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_FROM: test@tempconnect.local

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tempconnect_test
          POSTGRES_USER: tempconnect
          POSTGRES_PASSWORD: tempconnect_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Initialize Database
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f sql/init.sql

      - name: Start API Server
        working-directory: ./api
        run: |
          node server.js &
          sleep 5

      - name: Health Check
        run: |
          curl -f http://localhost:3000/health || exit 1

      - name: API Smoke Test
        run: |
          # Test public endpoints
          curl -f http://localhost:3000/listings || exit 1
          echo "API smoke test passed"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=test
          POSTGRES_DB=tempconnect
          POSTGRES_USER=tempconnect
          POSTGRES_PASSWORD=tempconnect_pw
          DATABASE_URL=postgres://tempconnect:tempconnect_pw@db:5432/tempconnect
          SESSION_SECRET=ci_test_secret
          CORS_ORIGIN=http://localhost:8080
          BASE_URL=http://localhost:8080
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_FROM=test@tempconnect.local
          FRONTEND_PORT=8080
          API_EXTERNAL_PORT=3000
          DB_EXTERNAL_PORT=5432
          MAILPIT_UI_PORT=8025
          MAILPIT_SMTP_PORT=1025
          EOF

      - name: Build and Start Docker Compose
        run: |
          docker compose --profile dev up -d --build
          sleep 30

      - name: Check Services Health
        run: |
          docker compose ps
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:8080/api/health || exit 1

      - name: Stop Docker Compose
        if: always()
        run: docker compose --profile dev down -v
